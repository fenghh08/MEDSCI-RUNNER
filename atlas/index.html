,"A **vital anti-oxidant** — this is not a side job."],"reg":["**G6PDH is driven by demand for NADP⁺**, so NADPH supply tracks lipogenesis automatically."],"clin":["**G6PDH deficiency** → haemolytic anaemia: red cells are very prone to oxidative damage. **Heinz bodies** are clumped haemoglobin."],"why":"Same hydride, different enzymes — that separation is what lets a cell oxidise and reduce at once.","course":[{"l":"L10","t":"PPP / lipogenesis","ids":["10S21.1","10S21.2","10S24.2","10S24.3","10S24.4","10S26.1","10S18.3"]}]},"fa":{"n":"Fatty acid","cls":"lipid","hub":1,"one":"Nearly fully reduced carbon — the body's real energy store, and a detergent that must never be left loose.","does":["**37 kJ/g** and stores of **many kg** (~15 kg) — vs 300 g of glycogen.","**Totally hydrophobic**: travels in blood **loosely bound to albumin**, handled in cells by **fatty acid binding protein**.","Burnt by **β-oxidation**, 2 carbons at a time, feeding acetyl-CoA to the Krebs cycle.","**Cannot be used by the brain** — it does not cross the blood–brain barrier."],"reg":["Released from WAT triglyceride by **hormone-sensitive lipase** when insulin is low / glucagon high.","Oxidation is blocked when **malonyl-CoA** inhibits CAT-1 — i.e. whenever insulin is driving lipogenesis."],"clin":["They are **soap**: unbound fatty acids are membrane-disrupting, which is why binding and CoA-trapping are obligatory.","Massive unopposed release in untreated type 1 diabetes drives ketogenesis and **acidosis**."],"why":"Fatty acids cannot become glucose — that single fact generates starvation physiology.","course":[{"l":"L01","t":"Introduction","ids":["1S24.1","1S24.2","1S24.3","1S24.4","1S24.5"]},{"l":"L03","t":"β-oxidation","ids":["3S9.1","3S9.2","3S9.3"]},{"l":"L05","t":"Lipolysis","ids":["5S16.5","5S19.5"]}]},"tag":{"n":"Triglyceride","cls":"lipid","f":"TAG / triacylglycerol","one":"Three fatty acids esterified to glycerol — anhydrous, inert, and the reason we can survive weeks without food.","does":["Stored in **white adipose tissue** as a vacuole wrapped in a **perilipin** shell.","Made by **esterification**, which needs **glycerol 3-phosphate**, not glycerol.","Broken down by **hormone-sensitive lipase** to fatty acids + **glycerol**.","Transported in blood only inside **lipoproteins** (chylomicrons, VLDL)."],"reg":["**PKA phosphorylates HSL** (activating it) **and perilipin** (letting HSL reach the fat). Both are needed.","**Insulin inhibits lipolysis** by lowering cAMP in the fat cell.","Esterification enzymes and FAS are **upregulated by insulin** at the gene level."],"clin":["Weight loss sends fat out of the body as **CO₂ and water**, not 'into the bowel'."],"why":"Esterification needs glycerol 3-P — and only liver has glycerol kinase, so other tissues must make it from glycolysis.","course":[{"l":"L05","t":"Lipolysis","ids":["5S16.1","5S16.2","5S16.3","5S16.4"]},{"l":"L10","t":"Esterification","ids":["10S2.3","10S11.1","10S12.1","10S12.2","10S12.5","10S12.6"]},{"l":"L13","t":"Type 1 diabetes","ids":["13S11.1","13S11.2"]}]},"facoa":{"n":"Fatty acyl-CoA","cls":"acyl","one":"A fatty acid with its CoA tag on — trapped, activated, and committed to being handled by enzymes.","does":["Made by **fatty acyl-CoA synthetase**; costs **ATP → AMP + PPi** (two phosphates' worth, not one).","**PPi is then hydrolysed**, pulling the reaction over so trapping is effectively irreversible.","Once on, the CoA stays on — 'trapping' and 'activating' are the same event.","Cannot cross the inner mitochondrial membrane: needs the **carnitine shuttle**."],"reg":["Long-chain fatty acyl-CoA **allosterically inhibits ACC**, its own ultimate product — classic feedback."],"why":"Spot 'ATP → AMP' instead of 'ATP → ADP' and you are looking at the fatty acid trapping step.","course":[{"l":"L01","t":"Introduction","ids":["1S25.1"]},{"l":"L03","t":"β-oxidation","ids":["3S10.1","3S10.2","3S10.3","3S10.4","3S10.5"]},{"l":"L10","t":"Lipogenesis","ids":["10S5.3","10S10.3"]}]},"facarn":{"n":"Fatty acyl-carnitine","cls":"acyl","one":"The only form in which long-chain fat can cross into the mitochondrial matrix.","does":["**CAT-1 (CPT-1)** swaps CoA for carnitine on the cytosolic side.","**CAT-2 (CPT-2)** swaps it back inside the matrix, releasing carnitine to be reused.","Both are **carnitine acyl-transferases** — the shuttle is a straight exchange, not a pump."],"reg":["**CAT-1 is inhibited by malonyl-CoA**, so fat oxidation stops the moment fat synthesis starts."],"clin":["**Unlike acyl-CoA, acylcarnitine leaves the cell and circulates**, which is why a bloodspot can show what is piling up inside mitochondria.","**CPT-2 deficiency** raises long-chain acylcarnitines and causes rhabdomyolysis on exertion; **CPT-1 deficiency** does the opposite — low acylcarnitines, high free carnitine."],"why":"CAT-1 is the gate: block it, and β-oxidation stops no matter how much fatty acid is around.","course":[{"l":"L01","t":"Introduction","ids":["1S25.2","1S25.5"]},{"l":"L03","t":"β-oxidation","ids":["3S12.1","3S12.2","3S12.3","3S12.4"]},{"l":"L10","t":"Malonyl-CoA control","ids":["10S20.1","10S20.2"]}]},"carnitine":{"n":"Carnitine","cls":"carrier","one":"The shuttle that carries acyl groups into the matrix and comes straight back — and, because its esters can leave the cell, the only part of fat oxidation you can measure in blood.","does":["Takes the acyl group off CoA outside the matrix and hands it to CoA inside, then returns empty.","**Recycled, never consumed** — a carrier, like oxaloacetate in the Krebs cycle.","Comes from the **diet, mostly meat**, and from **synthesis in liver and kidney out of lysine and methionine**.","How much is available is one of the limits on how fast a tissue can oxidise fat."],"reg":["The shuttle, not β-oxidation itself, is the **control point**: **malonyl-CoA inhibits CAT-1**, so fat oxidation stops the moment fat synthesis starts.","Acyl groups leaving the cell as acylcarnitines **drain the free carnitine pool** — secondary carnitine depletion."],"clin":["**Acylcarnitines can leave the cell; acyl-CoAs cannot.** Trapping on CoA is what keeps a metabolite inside, so the carnitine ester is the only form of this chemistry that reaches the blood — and therefore the only form you can measure.","That is the basis of **newborn screening**: a dried bloodspot acylcarnitine profile, where the **chain length that accumulates names the blocked enzyme**.","**Primary carnitine deficiency** (a defective OCTN2 transporter) wastes carnitine in the urine, giving **hypoketotic hypoglycaemia** — fat cannot be oxidised, so no ketone bodies are made, so the brain has no backup when glucose runs down.","Sold as a **fat metaboliser** supplement. The transport step really is rate-limiting, which is the grain of truth in the marketing."],"why":"Carnitine is the gate into fat oxidation and the one part of that chemistry that escapes the cell — so it is both the regulator and the test.","course":[{"l":"L03","t":"β-oxidation","ids":["3S12.3"]},{"l":"L07","t":"Rate-limiting steps","ids":["7S18.1"]}]},"malonylcoa":{"n":"Malonyl-CoA","cls":"acyl","one":"Primed acetyl-CoA for building fat — and the signal that tells the cell to stop burning fat.","does":["**ACC** adds CO₂ from **bicarbonate** using **ATP**: acetyl-CoA + HCO₃⁻ → malonyl-CoA.","Donates 2 carbons per round to fatty acid synthase; the **CO₂ comes straight back off**.","So the carboxylation **does not fix CO₂** — it is an activation trick, not carbon capture.","**Inhibits CAT-1**, shutting β-oxidation down."],"reg":["ACC is **stimulated by insulin** (dephosphorylation) and by **citrate**; **inhibited by long-chain FA-CoA**."],"why":"Malonyl-CoA is how one molecule makes synthesis and oxidation mutually exclusive — no futile cycle.","course":[{"l":"L10","t":"Lipogenesis","ids":["10S4.1","10S4.2","10S4.3","10S5.1","10S5.2","10S5.3","10S10.1","10S10.2","10S20.1","10S20.2","10S20.3"]}]},"palmitate":{"n":"Palmitate (C16)","cls":"lipid","one":"The standard product of fatty acid synthase — released as FA-CoA at C14–C18.","does":["Built **2 carbons at a time** by **reduction – dehydration – reduction** (the exact reverse logic of β-oxidation).","Needs **2 NADPH per round and no ATP** (the ATP went in at ACC).","**Desaturation happens after release** from FAS, not during."],"clin":["We cannot introduce double bonds **beyond carbon 9**, so long **omega-3 / omega-6** fatty acids are **essential in the diet**."],"why":"Lipogenesis = oxidation run backwards with NADPH instead of NAD, on one giant multifunctional enzyme.","course":[{"l":"L10","t":"Lipogenesis","ids":["10S6.1","10S6.2","10S7.4","10S9.1","10S10.1","10S10.3","10S10.4","10S10.5"]}]},"glycerol":{"n":"Glycerol","cls":"alcohol","one":"The 3-carbon backbone released with fatty acids — and the only genuinely new glucose in early starvation.","does":["Released from TAG by lipolysis and carried to the **liver**.","Enters gluconeogenesis as **DHAP**, not as pyruvate.","Supplies at most **~30 g glucose/day** against a brain demand of **120 g/day**.","**Only the liver has glycerol kinase** — other tissues must make glycerol 3-P from glycolysis."],"why":"Glycerol gluconeogenesis is *de novo*; lactate gluconeogenesis is only recycling. That 30 vs 120 g gap is what forces proteolysis.","course":[{"l":"L05","t":"Early starvation","ids":["5S20.4"]},{"l":"L06","t":"Late starvation","ids":["6S3.1","6S3.2","6S3.3"]},{"l":"L10","t":"Esterification","ids":["10S12.2"]}]},"glycerol3p":{"n":"Glycerol 3-phosphate","cls":"alcohol","one":"The phosphorylated backbone esterification actually requires — glycerol itself will not do.","does":["In liver: from **glycerol + glycerol kinase**. Elsewhere: from **reducing glycolytic G3P**.","Accepts **three fatty acids as FA-CoA, one at a time**, by ester bonds → triglyceride.","Can also be made from pyruvate via gluconeogenic steps — called **glyceroneogenesis**.","A shuttle version delivers cytosolic reducing equivalents to **ubiquinone**, bypassing Complex I."],"why":"This is why fat storage needs glycolysis running: you need the glycerol backbone as well as the acetyl-CoA.","course":[{"l":"L10","t":"Esterification","ids":["10S3.4","10S11.1","10S12.2","10S12.3","10S12.4","10S26.5"]},{"l":"L04","t":"Shuttles","ids":["4S30.1","4S33.4"]}]},"acetylcoa":{"n":"Acetyl-CoA","cls":"acyl","hub":2,"star":1,"one":"Two carbons on a CoA handle — the single currency every fuel is converted into, and the molecule that cannot go back to glucose.","does":["**Everything converges here**: glucose (via PDH), fatty acids (via β-oxidation), ketogenic amino acids, ketone bodies.","**Everything diverges from here**: Krebs cycle, ketone bodies, fatty acid synthesis, cholesterol.","Condenses with **oxaloacetate → citrate**, which is step one whether it is being burnt *or* exported.","CoA is a **carrier of acyl groups** and **trapping on CoA keeps metabolites inside the cell**."],"reg":["**Stimulates PDH kinase → PDH OFF.** So acetyl-CoA from fat switches off glucose oxidation. This is the glucose–fatty acid cycle.","**Stimulates pyruvate carboxylase → gluconeogenesis ON.** Same signal, opposite pathway, both correct.","Its own disposal regenerates **CoA**, and without free CoA β-oxidation stalls."],"clin":["In untreated type 1 diabetes the liver is flooded with acetyl-CoA while oxaloacetate is being stolen for gluconeogenesis — so it all goes to ketone bodies."],"why":"If you learn one molecule in this unit, learn this one: it is the hub, and it is a one-way door.","deep":[["Why it is a one-way door","**Pyruvate → acetyl-CoA (PDH) is irreversible.** There is no enzyme to run it back. Therefore **acetyl-CoA cannot be made into gluconeogenic precursors**, therefore **fatty acids cannot be converted into glucose**, therefore in starvation the body must break down **protein** to feed the brain. One irreversible arrow generates the entire physiology of late starvation."],["Why all three fates start the same way","Burning it, exporting it for lipogenesis — **both begin with citrate synthase**. Acetyl-CoA + oxaloacetate → citrate. Whether that citrate is **oxidised** in the Krebs cycle or **transported out** to the cytoplasm depends on the **energy charge** and on whether lipogenesis is being driven. Citrate formation also **regenerates CoA**, which is what lets PDH and β-oxidation carry on."],["How much ATP it is worth","One acetyl-CoA through the Krebs cycle gives **3 NADH + 1 FADH₂ + 1 GTP**. At **2.5 ATP per NADH** and **1.5 per FADH₂**, that is about **10 ATP per acetyl-CoA**. A C16 fatty acid gives 8 acetyl-CoA plus 7 NADH and 7 FADH₂ from the β-oxidation rounds themselves."],["The two-carbon chunk idea","Stage 1 of fuel oxidation is simply *break every fuel into two-carbon pieces and put them on CoA*. Glucose via glycolysis + PDH, fatty acids via β-oxidation, amino acids by several routes. Stage 2 (Krebs) strips H/e⁻ off those two carbons. Stage 3 (ETC) cashes the H/e⁻ in for ATP. Acetyl-CoA is the joint between stage 1 and stage 2."]],"course":[{"l":"L01","t":"Introduction to Metabolism","ids":["1S16.1","1S16.2","1S17.1","1S17.2","1S17.4","1S18.1","1S18.2"]},{"l":"L02","t":"Exercise","ids":["2S19.1","2S23.1"]},{"l":"L03","t":"Krebs cycle","ids":["3S16.1","3S33.1","3S36.5"]},{"l":"L05","t":"Glucose–fatty acid cycle","ids":["5S3.7","5S17.1","5S19.2","5S19.6"]},{"l":"L06","t":"Ketone bodies","ids":["6S9.1","6S12.4"]},{"l":"L08","t":"Gluconeogenesis","ids":["8S17.2","8S19.1"]},{"l":"L10","t":"Lipogenesis","ids":["10S2.1","10S16.1","10S16.2","10S16.3","10S16.4","10S16.5"]}]},"coa":{"n":"Coenzyme A","cls":"carrier","one":"The acyl-group handle — and a tether that keeps metabolites from leaking out of the cell.","does":["Carries **acyl groups**: acetyl, fatty acyl, succinyl, HMG.","Attachment is good for **trapping metabolites within the cell**.","In **short supply** — it must be regenerated or acyl-CoA-dependent pathways stall.","Regenerated by **citrate synthase** (Krebs) or by **ketone body synthesis** (liver)."],"why":"The liver can keep burning fat with no ATP demand *because* ketogenesis is a second way to recycle CoA.","course":[{"l":"L01","t":"Introduction","ids":["1S16.1","1S16.2"]},{"l":"L06","t":"Liver β-oxidation","ids":["6S12.2","6S12.4"]},{"l":"L10","t":"Citrate","ids":["10S16.4"]}]},"oaa":{"n":"Oxaloacetate","cls":"acid","f":"OAA","one":"The 4-carbon carrier that picks acetate up and hands it back — not consumed, but easily stolen.","does":["Condenses with acetyl-CoA to make **citrate**; regenerated each turn, so **not net consumed**.","**Anaplerotic**: made from pyruvate by **pyruvate carboxylase** to top the cycle up.","Leaves as **PEP** (via PEPCK) for gluconeogenesis, or as **aspartate** by transamination.","**Cannot cross the inner membrane** — it exits disguised as malate."],"reg":["Pyruvate carboxylase is **stimulated by acetyl-CoA**, which both replaces OAA taken for glucose and supplies more carrier when the cycle is busy."],"clin":["Pull OAA out for gluconeogenesis fast enough — late starvation, type 1 diabetes — and acetyl-CoA has nowhere to go but **ketone bodies**."],"why":"Krebs is not a furnace that eats OAA; it is a carousel. Anaplerosis is topping up the carousel.","course":[{"l":"L03","t":"Krebs","ids":["3S34.1","3S36.6"]},{"l":"L08","t":"Gluconeogenesis","ids":["8S3.4","8S19.2","8S19.3","8S20.1"]},{"l":"L10","t":"Citrate shuttle","ids":["10S18.1","10S18.2","10S18.4"]},{"l":"L12","t":"Transamination","ids":["12S8.3"]}]},"citrate":{"n":"Citrate","cls":"acid","hub":1,"one":"Six carbons, two jobs: the first step of burning acetate, and a battery that carries acetate out of the mitochondrion.","does":["Made by **citrate synthase** from acetyl-CoA + OAA — **regenerating CoA** in the process.","Oxidised round the Krebs cycle, **or** **transported into the cytoplasm** for lipogenesis.","In the cytosol, **ATP-citrate lyase** splits it back into acetyl-CoA + OAA, using ATP."],"reg":["Cytosolic citrate is the master reciprocal signal: **OFF** glycolysis (inhibits PFK) and **OFF** β-oxidation (via malonyl-CoA).","**ON** fatty acid synthesis (activates ACC into polymers) and **ON** gluconeogenesis.","'Citrate is like a battery for the cell' — charged inside, spent outside."],"clin":["**Hydroxycitrate** (Brindle Berry) inhibits ATP-citrate lyase and is sold as a fat-synthesis blocker."],"why":"The single best reciprocal-control example in the unit: one metabolite, four pathways, all pointing the same way.","course":[{"l":"L07","t":"Reciprocal control","ids":["7S13.4","7S20.1"]},{"l":"L10","t":"Citrate shuttle","ids":["10S3.2","10S17.1","10S17.2","10S17.3","10S17.4","10S19.1","10S19.2","10S19.3","10S19.4","10S19.5","10S19.6"]}]},"isocitrate":{"n":"Isocitrate","cls":"acid","one":"Citrate rearranged by aconitase, ready for the cycle's first oxidative decarboxylation.","does":["**ICDH** oxidises and decarboxylates it → α-ketoglutarate + CO₂ + NADH.","**ICDH is a rate-limiting step** of the Krebs cycle and an NAD-linked dehydrogenase."],"reg":["Like all the Krebs dehydrogenases, driven by **NAD⁺ and ADP availability** — i.e. by ATP demand."],"why":"ICDH and OGDH are the two Krebs steps worth naming as rate-limiting.","course":[{"l":"L06","t":"Krebs dehydrogenases","ids":["6S11.3"]},{"l":"L07","t":"RLS","ids":["7S12.1"]}]},"akg":{"n":"α-Ketoglutarate","cls":"acid","f":"α-KG / 2-oxoglutarate","hub":1,"one":"A Krebs intermediate that doubles as the main acceptor of amine groups in the body.","does":["**OGDH** takes it to succinyl-CoA + CO₂ + NADH — the second oxidative decarboxylation.","**α-KG + NH₂ → glutamate** — one of only three amine acceptors.","**Glutamate dehydrogenase** runs it back, releasing **NH₃** for urea synthesis.","Entry point for the carbon skeletons of many glucogenic amino acids — **anaplerotic**."],"why":"Where the Krebs cycle and nitrogen metabolism are literally the same molecule.","course":[{"l":"L06","t":"Transamination","ids":["6S5.2"]},{"l":"L12","t":"Nitrogen","ids":["12S1.4","12S8.2","12S8.3","12S8.4","12S10.2","12S12.2"]}]},"succinylcoa":{"n":"Succinyl-CoA","cls":"acyl","one":"The only point in the Krebs cycle that makes a nucleotide triphosphate directly.","does":["Converted to succinate by **succinyl-CoA synthetase**, making **GTP**.","That GTP is **substrate-level phosphorylation** — the cycle's 'ATP, but not directly'."],"why":"One turn = 3 NADH + 1 FADH₂ + 1 GTP. The GTP comes from here.","course":[{"l":"L03","t":"Krebs","ids":["3S33.4","3S36.2"]}]},"succinate":{"n":"Succinate","cls":"acid","one":"The Krebs intermediate whose dehydrogenase *is* Complex II of the electron transport chain.","does":["Oxidised to fumarate by **succinate dehydrogenase**, reducing **FAD → FADH₂**.","**SDH = Complex II**, embedded in the inner membrane — the Krebs cycle physically touching the ETC.","Its FAD is **stuck inside Complex II** and cannot roam like NAD does."],"why":"The one Krebs enzyme that is a membrane complex — and the reason FADH₂ yields less ATP (6 H⁺ pumped, not 10).","course":[{"l":"L04","t":"ETC","ids":["4S19.1","4S19.3","4S33.2"]},{"l":"L03","t":"Krebs","ids":["3S36.2"]}]},"fumarate":{"n":"Fumarate","cls":"acid","one":"A 4-carbon Krebs intermediate, and the carbon that the urea cycle hands back.","does":["Hydrated to **malate** by fumarase.","Released by the **urea cycle** (argininosuccinate → arginine + fumarate), linking the two cycles."],"why":"A named 'molecule shared with the Krebs cycle' in the urea cycle learning outcomes.","course":[{"l":"L12","t":"Urea cycle","ids":["12S9.1"]},{"l":"L03","t":"Krebs","ids":["3S36.1"]}]},"malate":{"n":"Malate","cls":"acid","one":"The transportable form of oxaloacetate — how 4-carbon units and reducing equivalents cross the membrane.","does":["Oxidised to OAA by **malate dehydrogenase**, giving NADH.","Carries OAA **out** of the matrix for gluconeogenesis (OAA itself cannot cross).","The **malate–aspartate shuttle** moves cytosolic NADH in **without losing proton-pumping potential**.","On the lipogenesis return trip, malate → pyruvate **generates some of the NADPH**."],"why":"Whenever something 4-carbon has to cross the inner membrane, it travels as malate.","course":[{"l":"L04","t":"Shuttles","ids":["4S32.1"]},{"l":"L10","t":"Citrate shuttle","ids":["10S18.2","10S18.3"]}]},"acacoa":{"n":"Acetoacetyl-CoA","cls":"acyl","x":1,"one":"Two acetyl-CoA joined head to tail — the first step out of the Krebs cycle towards ketone bodies.","does":["Formed from **2 × acetyl-CoA** by thiolase, running the β-oxidation cleavage backwards.","Condenses with a third acetyl-CoA to give **HMG-CoA**."],"why":"Two acetyl-CoA joined, then a third added — after that it is all downhill to acetoacetate.","course":[{"l":"L06","t":"Ketone body formation","ids":["6S13.1"]}]},"hmgcoa":{"n":"HMG-CoA","cls":"acyl","f":"β-hydroxy-β-methylglutaryl-CoA","one":"The branch point of two completely different pathways: ketone bodies in the mitochondrion, cholesterol in the cytosol.","does":["**Mitochondrial HMG-CoA → acetoacetate** — the named intermediate of ketone body formation.","**Cytosolic HMG-CoA → cholesterol**, via **HMG-CoA reductase**, the rate-limiting step.","Same molecule, two compartments, two fates — the compartment is the whole answer."],"clin":["**Statins inhibit HMG-CoA reductase**; cells respond by **expressing more LDL receptors**, which is what lowers blood LDL."],"why":"See HMG-CoA and check the compartment first — that alone decides ketones or cholesterol.","course":[{"l":"L06","t":"Ketone body formation","ids":["6S13.1"]},{"l":"L11","t":"Cholesterol","ids":["11S23.2","11S23.4","11S28.4"]}]},"acac":{"n":"Acetoacetate","cls":"ketone","star":1,"one":"The primary ketone body — a water-soluble, brain-permeable parcel of two acetyl-CoA.","does":["Made in the **liver** from acetyl-CoA via **HMG-CoA**.","Interconverted with **β-hydroxybutyrate**; both circulate.","Taken up by tissues **including the brain** and **split in the mitochondria back to acetyl-CoA**.","Can **spontaneously decarboxylate** to **acetone**."],"why":"Water-soluble, so it crosses the blood–brain barrier where fatty acids cannot. That is the entire trick.","course":[{"l":"L06","t":"Ketone bodies","ids":["6S13.1","6S14.1","6S14.2","6S14.3","6S15.2"]}]},"bhb":{"n":"β-Hydroxybutyrate","cls":"ketone","star":1,"one":"The reduced ketone body — the one that actually predominates in blood, in equilibrium with acetoacetate.","does":["Freely interconverted with acetoacetate by β-hydroxybutyrate dehydrogenase.","Oxidised back to acetoacetate in the target tissue, then split to **2 acetyl-CoA**.","Strictly it is **not a ketone** — it is a hydroxy acid — but it is counted as a ketone body."],"why":"Named a 'ketone body' but chemically an alcohol: a favourite catch.","course":[{"l":"L06","t":"Ketone bodies","ids":["6S14.1","6S14.2","6S14.3"]}]},"acetone":{"n":"Acetone","cls":"ketone","one":"The dead end — acetoacetate that decarboxylated itself, and the smell on the breath.","does":["Forms **spontaneously**, with no enzyme, from acetoacetate.","Volatile, so it is **exhaled** — nothing recovers the carbon.","One of the two routes by which ketone body carbon is simply **lost**; the other is urine."],"clin":["The **sweet / organic breath** of untreated type 1 diabetes and of deep ketosis."],"why":"Asked why ketone body metabolism is 'inefficient'? Not the oxidation — the losses: urine and acetone.","course":[{"l":"L06","t":"Ketone bodies","ids":["6S15.1","6S15.2"]},{"l":"L13","t":"Type 1 diabetes","ids":["13S17.4","13S2.6"]}]},"kb":{"n":"Ketone bodies","cls":"ketone","hub":1,"star":1,"one":"The liver's water-soluble export form of fat — the only way fat-derived energy ever reaches the brain.","does":["Three species: **acetoacetate**, **β-hydroxybutyrate**, and **acetone** (a dead end).","Made **only in the liver**, used **everywhere else, including the brain**.","Split in the recipient's mitochondria to **acetyl-CoA** — an instant Krebs substrate.","Drop the brain's glucose requirement from **120 g/day to 30 g/day** by about **day 5**."],"reg":["Made when the liver has **lots of acetyl-CoA from β-oxidation** and the Krebs cycle cannot take it — either no ATP demand, or oxaloacetate stolen for gluconeogenesis.","Their acetyl-CoA then **inhibits PDH** in target tissues (via PDH kinase), sparing glucose there too."],"clin":["Normal and protective in starvation; **pathological in untreated type 1 diabetes**, where production is unopposed.","Contribute with lactate and fatty acids to a **severe fall in pH — ultimately fatal**."],"why":"Ketone bodies are not a disease. They are the adaptation that stops starvation from eating your muscles.","deep":[["The problem they solve","The brain needs **120 g glucose/day** and cannot use fatty acids. Glycerol gives only **30 g/day**. Liver glycogen is gone in **<24 h**. The only remaining source is **protein** — and at **2 g protein per 1 g glucose**, covering the 90 g shortfall costs **180 g protein/day** out of a 6 kg pool. That rate of loss is unsurvivable for long. Ketone bodies exist to stop it."],["Why only the liver makes them","In most tissues β-oxidation runs only as fast as the tissue needs ATP, because **CoA is regenerated by the Krebs cycle** and the Krebs cycle is demand-driven. **The liver can oxidise fat with no extra ATP demand at all**, because it has a second way to regenerate CoA: ketone body synthesis. That is the whole reason the liver is the ketogenic organ."],["The numbers to keep","**Day 2:** brain 120 g glucose/day, protein loss >100 g/day. **Day 3–4:** ketone bodies rising, protein loss ~75 g/day (sources differ; nearer 50 g/day). **Day 5:** brain down to **30 g glucose/day**. Rule of thumb: *protein breakdown = (glucose needed − 30) × ~2*."],["Where it goes wrong","In **untreated type 1 diabetes** every switch points the same way with nothing to oppose it: no insulin → uncontrolled lipolysis → **massive fatty acid supply to the liver**; and Krebs intermediates are being **removed for gluconeogenesis**. So ketone body production is **enormous** rather than adaptive, and with lactate and fatty acids it produces a fatal **acidosis**. Starvation in the face of plenty."],["Why it is still 'inefficient'","There is **nothing inefficient about the oxidation** itself. The losses are at the edges: ketone bodies are **excreted in the urine**, and acetoacetate **spontaneously decarboxylates to acetone** which is breathed out. Carbon that leaves by either route is gone."]],"course":[{"l":"L06","t":"Ketone Body Synthesis","ids":["6S12.4","6S13.1","6S14.1","6S14.2","6S14.3","6S14.4","6S14.5","6S15.1","6S15.2","6S16.1","6S16.2","6S16.3"]},{"l":"L13","t":"Type 1 diabetes","ids":["13S13.1","13S13.2","13S13.3","13S13.4","13S15.1","13S17.4"]}]},"atp":{"n":"ATP","cls":"carrier","hub":1,"one":"The cell's working currency — held at 5 mM, turned over 1000 times a day, and deliberately *not* the most energetic molecule around.","does":["Couples unfavourable reactions to a favourable hydrolysis — chemical, transport and mechanical work.","Held at **5 mM**; below **3 mM the cell dies**. A sprinting fibre uses 5 mM **per second**.","The 'store' is **1 g/kg** body weight but turnover is **1 kg/kg — 1000× the store**.","Both **ATP→ADP and ADP→AMP** release energy; it is not only the terminal phosphate that counts."],"reg":["Synthesis rate is **exactly matched to use**: cells **cannot burn fuel without doing work**. Catabolism is demand-driven.","Enzymes are sensitive to **ADP and especially AMP**, hardly to ATP — because ATP barely moves."],"why":"ATP is a buffer, not a battery. Nothing in metabolism is regulated by how much ATP there is.","course":[{"l":"L01","t":"Introduction","ids":["1S9.1","1S9.2","1S33.1","1S33.2","1S33.3","1S33.4"]},{"l":"L02","t":"Exercise","ids":["2S8.1","2S8.2"]},{"l":"L07","t":"Energy charge","ids":["7S2.1","7S2.2","7S3.1","7S5.1","7S5.2"]}]},"amp":{"n":"AMP","cls":"carrier","one":"The actual regulatory signal — a 10% dip in ATP becomes a huge proportional rise in AMP.","does":["**Adenylate kinase**: **2 ADP → ATP + AMP**, which **amplifies** a small ATP change into a large AMP change.","Hierarchy is **ATP > ADP >> AMP**, so AMP has the most room to move proportionally.","Of the adenine nucleotides, **[AMP] is the most important regulatory signal**.","**Activates PFK** allosterically and changes how PFK responds to ATP."],"reg":["The ratio of adenine nucleotides is the **energy charge**; the formula is not worth rote-learning, the hierarchy is."],"clin":["Feeding adenine nucleotides into purine degradation in an **energy crisis** is one route to raised urate."],"why":"Ask 'what senses low energy?' The answer is AMP, every time — never ATP.","course":[{"l":"L01","t":"Introduction","ids":["1S10.1","1S10.2"]},{"l":"L07","t":"Energy charge","ids":["7S4.1","7S4.2","7S4.3","7S4.4","7S6.1","7S13.2","7S13.3"]},{"l":"L12","t":"Purine degradation","ids":["12S17.1"]}]},"nad":{"n":"NAD⁺ / NADH","cls":"carrier","f":"nicotinamide adenine dinucleotide","hub":1,"one":"The roaming hydride carrier — in short supply, which is why so much of metabolism is about regenerating it.","does":["Likes to oxidise **–CH₂–CHOH–** groups, becoming NADH.","Accepts **one H⁺ and 2 e⁻** — effectively a **hydride ion**.","Donates to **Complex I**; worth **2.5 ATP** each in oxidative phosphorylation.","Unlike FAD it is **free to roam** between enzymes."],"reg":["**BIG CONCEPT 1: the H/e⁻ carriers are in short supply.** Once loaded they cannot strip any more, so catabolism stops unless they are reoxidised.","Glycolytic NADH is **cytosolic** and needs a shuttle (glycerol 3-P or malate–aspartate) to reach the chain."],"why":"Every 'why does X stop?' question in this unit ends at either NAD⁺ or ADP running out.","course":[{"l":"L01","t":"Introduction","ids":["1S14.1","1S19.1","1S19.3","1S23.1"]},{"l":"L03","t":"Glycolysis","ids":["3S27.2","3S28.2","3S28.3","3S36.3"]},{"l":"L04","t":"ETC","ids":["4S17.1","4S17.2","4S29.1"]}]},"fad":{"n":"FAD / FADH₂","cls":"carrier","f":"flavin adenine dinucleotide","one":"The carrier for jobs NAD cannot do — and in Complex II it is bolted down.","does":["Likes to oxidise **–CH₂–CH₂– to –CH=CH–**, i.e. saturated hydrocarbon chains.","Accepts **2 H⁺ and 2 e⁻**.","Enters the chain at **ubiquinone**, skipping Complex I, so only **6 H⁺** are pumped — worth **1.5 ATP**.","In Complex II it is **totally stuck** and **cannot roam like NAD**."],"why":"NAD does alcohols, FAD does alkanes. That is why β-oxidation uses FAD first, then NAD.","course":[{"l":"L01","t":"Introduction","ids":["1S15.1","1S19.2"]},{"l":"L03","t":"β-oxidation","ids":["3S13.1","3S20.1","3S36.4"]},{"l":"L04","t":"ETC","ids":["4S19.1","4S19.2","4S19.3","4S26.1"]}]},"creatinep":{"n":"Creatine phosphate","cls":"carrier","f":"CP / phosphocreatine","one":"An instant ATP buffer for the first few seconds — before glycogenolysis has even got going.","does":["**Creatine phosphate + ADP → ATP + creatine** — pure substrate-level phosphorylation.","**~15 mM: less than five seconds' supply.**","Needed because it takes **several seconds to get glycogenolysis going**.","**Creatine supplements** raise CP levels — the one supplement in this unit with a real mechanism."],"why":"The order of a sprint: CP (seconds) → muscle glycogen → glycolysis → lactate.","course":[{"l":"L02","t":"Exercise","ids":["2S34.1","2S34.2","2S34.3","2S34.4"]},{"l":"L07","t":"Instant reserve","ids":["7S2.3"]}]},"uq":{"n":"Ubiquinone (Q)","cls":"carrier","f":"coenzyme Q / Q10","hub":1,"one":"The membrane-soluble collector — four separate routes feed electrons into this one pool.","does":["**Very hydrophobic**, lives in the inner membrane; reduced form is **UQH₂**.","Route 1 **Complex I**. Route 2 **Complex II (= succinate dehydrogenase)**.","Route 3 **the first step of β-oxidation**. Route 4 the **glycerol 3-phosphate shuttle**.","Hands hydrogens on to **Complex III**."],"clin":["Electrons in the Q pool can **react with O₂ directly, making free radicals**, which **mutate DNA**. Less likely if **Complex III is vacant**."],"why":"Anything that bypasses Complex I enters at Q — and therefore yields less ATP.","course":[{"l":"L04","t":"ETC","ids":["4S20.1","4S20.2","4S20.3","4S20.4","4S20.5","4S33.1","4S33.2","4S33.3","4S33.4","4S35.1","4S35.2","4S35.3"]}]},"cytc":{"n":"Cytochrome c","cls":"carrier","one":"A small iron protein shuttling electrons — and only electrons — from Complex III to Complex IV.","does":["Prosthetic group holds an **iron atom** cycling between **ferrous and ferric**.","**Iron does NOT carry hydrogens** — electrons only.","Iron sits either in a **porphyrin ring** or in **iron–sulphur complexes**."],"why":"The H⁺/e⁻ bookkeeping only works if you notice where hydrogens stop travelling and electrons carry on alone.","course":[{"l":"L04","t":"ETC","ids":["4S22.1","4S22.2","4S22.3","4S23.1"]}]},"hplus":{"n":"Proton gradient","cls":"carrier","f":"H⁺ / proton-motive force","hub":1,"one":"The battery. Charge plus concentration across the inner membrane — everything in phase 3 is about this.","does":["**10 H⁺ pumped per NADH**, **6 per FADH₂**; **3 H⁺ in → 1 ATP**.","Energy is in **both charge and concentration** — the **electrochemical gradient / proton-motive force**.","Also spends itself on **transport**: ADP/ATP exchange and **phosphate import consumes protons**.","That spending is why **10 H⁺ per NADH** does not give the naive >3 ATP."],"reg":["**BIG CONCEPT 4–7:** the membrane is **impermeable to protons**; protons only flow in **if ATP is being made**; pumps **stall if the gradient is too high**; and **no pumping means no electron flow**.","That chain of four is the whole mechanism of **coupling**."],"why":"Coupling is not a metaphor — it is back-pressure. Stop using ATP and the gradient physically blocks electron transport.","course":[{"l":"L01","t":"Introduction","ids":["1S20.2","1S21.1","1S23.4","1S23.5","1S23.6","1S23.7"]},{"l":"L04","t":"Ox phos","ids":["4S14.3","4S24.2","4S26.1","4S28.1","4S28.2","4S36.1","4S36.2","4S39.1","4S39.2","4S40.1"]}]},"o2":{"n":"Oxygen → water","cls":"carrier","f":"O₂ / H₂O","one":"The terminal electron acceptor — the only reason any of the carriers can be reused.","does":["Reduced to water at **Complex IV**, the final step.","The reaction of **hydrogen with oxygen liberates a lot of energy**, captured as the proton gradient.","Because coupling is tight, **oxygen consumption measures energy expenditure**."],"clin":["**Cyanide, azide and carbon monoxide** block Complex IV: the whole chain stops and **everything upstream stays reduced**."],"why":"Fuel oxidation and a fire are the same reaction: fuel + O₂ → CO₂ + water.","course":[{"l":"L01","t":"Introduction","ids":["1S20.1","1S22.1","1S30.1"]},{"l":"L04","t":"ETC","ids":["4S4.2","4S4.3","4S41.2"]}]},"dnp":{"n":"DNP (2,4-dinitrophenol)","cls":"drug","one":"An uncoupler: a weak acid hydrophobic enough to ferry protons straight across the membrane.","does":["**Hydrophobic when protonated**, and when H⁺ comes off the **negative charge is delocalised** so it is **still hydrophobic** — hence it shuttles freely.","**Dissipates the proton gradient**, so protons bypass ATP synthase: **no ATP made**.","No gradient → **no back-pressure** → instant NAD⁺ regeneration → **massive fuel oxidation and O₂ consumption**.","Energy comes out as **heat**."],"clin":["First seen in **munitions workers**: massive weight loss and heat production.","Later sold as a **weight-loss agent**; there has been a **recent spate of deaths** — young people are dying from it.","Uncoupling gives **low ATP and cell death** unless it can be controlled."],"why":"DNP is the experiment that proves coupling: break it and oxidation runs flat out while ATP collapses.","course":[{"l":"L01","t":"Introduction","ids":["1S33.5"]},{"l":"L04","t":"Uncoupling","ids":["4S5.1","4S5.2","4S6.1","4S6.2","4S6.3","4S6.4","4S7.1","4S7.2","4S8.1","4S8.2","4S8.3"]}]},"ucp1":{"n":"UCP-1 (thermogenin)","cls":"protein","one":"The body's own uncoupler — the same trick as DNP, but targeted and controllable.","does":["Found **only in brown adipose tissue**.","Its job is to **generate heat** — crucial in **small mammals and hibernators**.","**Noradrenalin binds β3-receptors**, which both **releases fatty acids** and **opens the proton channel**.","**High in neonates**, falling as we grow up."],"why":"DNP kills because it is everywhere and always on. UCP-1 is safe because it is one tissue and hormone-gated.","course":[{"l":"L04","t":"Uncoupling","ids":["4S9.1","4S9.2","4S10.1","4S10.2","4S10.3","4S10.4","4S34.1"]}]},"bilesalts":{"n":"Bile salts","cls":"lipid","one":"Cholesterol with polar groups bolted on — a detergent, and the only exit route cholesterol has.","does":["Made **from cholesterol in the liver** by adding polar groups; stored in the **gall bladder**.","Emulsify dietary fat into **micelles** so **pancreatic lipase** can reach it.","**Reabsorbed and returned to the liver via the hepatic portal vein** — ~18 g secreted, 17.5 g recovered daily.","**Making bile salts is the only way cholesterol is metabolised and disposed of.**"],"clin":["**Gall stones** blocking the bile duct → less fat digestion and lower calorie intake.","**Bile-salt-binding resins** stop reabsorption, so the liver must make more from cholesterol — less cholesterol to export."],"why":"Net loss is only ~0.5 g/day, and it equals the amount absorbed — which is why eating less cholesterol barely moves the needle.","course":[{"l":"L11","t":"Lipoproteins & cholesterol","ids":["11S10.1","11S10.2","11S10.3","11S10.4","11S11.1","11S11.2","11S11.3","11S12.1","11S28.3","11S29.3","11S29.4"]}]},"chylomicron":{"n":"Chylomicron","cls":"lipoprotein","one":"The first lipoprotein — built by intestinal cells, and the only one that goes via lymph.","does":["Made by **intestinal cells**, carrying **dietary fat and dietary cholesterol**.","**Enters the lymphatic system**, not the portal blood — fat bypasses first-pass liver.","Meets **lipoprotein lipase** on capillary surfaces, which hydrolyses the fat out.","Cholesterol is **esterified** to make it fully hydrophobic for the particle core."],"why":"Fat is the one macronutrient that does not go straight to the liver — because of the lymphatic route.","course":[{"l":"L11","t":"Lipoproteins","ids":["11S14.1","11S14.2","11S14.3","11S14.4","11S15.1","11S15.2","11S15.3","11S16.1","11S17.1"]}]},"chylo_rem":{"n":"Chylomicron remnant","cls":"lipoprotein","one":"A fat-depleted, cholesterol-rich leftover that the liver swallows whole.","does":["**Endocytosed by the liver** and digested internally, releasing fat and cholesterol inside.","**Still contains quite a lot of fat**, so **much dietary fat ends up in the liver** anyway.","Its cholesterol becomes the raw material the liver packs into **VLDL**."],"why":"The lymphatic bypass is only a delay — the liver gets the fat in the end.","course":[{"l":"L11","t":"Lipoproteins","ids":["11S18.1","11S18.2","11S18.3","11S19.1"]}]},"vldl":{"n":"VLDL","cls":"lipoprotein","f":"very low density lipoprotein","one":"The liver's export van — fat out to the tissues, whether that fat came from the diet or from lipogenesis.","does":["Assembled by the **liver** from **fat and cholesterol esters**, then **excreted into the blood**.","The fat **could have come from the diet (via remnants) or from lipogenesis**.","**LPL strips fat out of VLDL exactly as it did from chylomicrons**, leaving IDL."],"clin":["**CETP** swapping cholesterol ester onto an outgoing VLDL leaves it **cholesterol-enriched** — and keeps cholesterol in circulation."],"why":"Chylomicrons = gut to tissues. VLDL = liver to tissues. Same cargo, same enzyme, different origin.","course":[{"l":"L11","t":"Lipoproteins","ids":["11S19.2","11S19.3","11S19.4","11S20.1","11S26.3"]}]},"idl":{"n":"IDL","cls":"lipoprotein","f":"intermediate density lipoprotein","one":"VLDL part-way through being stripped — relatively cholesterol rich, on its way to becoming LDL.","does":["Formed as **LPL depletes VLDL of fat**.","**Even more fat stripped out makes LDL**.","**Both IDL and LDL can be endocytosed by the liver.**"],"why":"The density series is just a fat-to-cholesterol ratio: strip fat, density rises.","course":[{"l":"L11","t":"Lipoproteins","ids":["11S20.2","11S20.3","11S20.4"]}]},"ldl":{"n":"LDL","cls":"lipoprotein","f":"low density lipoprotein","one":"How cholesterol is delivered to tissues — and, once oxidised, how plaques start.","does":["Taken up through the **LDL receptor** by endocytosis.","**LDL uptake is how cholesterol is delivered to the tissues.**","**Cells signal that they want cholesterol by expressing LDL receptors**; they stop when they have enough."],"clin":["**LDL oxidises with time**; **macrophages take up ox-LDL without control and become foam cells**.","Foam cells create an **inflammatory environment that encourages plaque formation**.","**Statins** raise LDL receptor expression, which is what clears blood LDL. What matters is the **HDL/LDL ratio**."],"why":"LDL is not 'bad cholesterol'. It is the delivery service; the problem is uncontrolled uptake of the oxidised form.","course":[{"l":"L11","t":"Lipoproteins","ids":["11S21.1","11S21.2","11S21.3","11S23.5","11S24.1","11S24.2","11S24.3","11S28.4","11S28.6"]}]},"hdl":{"n":"HDL","cls":"lipoprotein","f":"high density lipoprotein","one":"A patrolling disc of phospholipid that collects cholesterol from tissues and takes it home.","does":["Made **mainly by the liver** as **thin discs of phospholipid**.","Picks up cholesterol cells want to shed — **reverse cholesterol transport**.","**Returns to the liver**, which **re-exports that cholesterol or turns it into bile salts**.","Because it removes cholesterol from tissues, **HDL is 'good'**."],"clin":["**CETP** exchanges its cholesterol ester for triglyceride with an outgoing VLDL/chylomicron — so **HDL comes back with more fat and less cholesterol**.","**High saturated fat lowers HDL and raises LDL**; polyunsaturated fats help."],"why":"HDL is the only vector that moves cholesterol *towards* disposal — and CETP is the leak in that system.","course":[{"l":"L11","t":"Lipoproteins","ids":["11S25.1","11S25.2","11S25.3","11S25.4","11S25.5","11S26.1","11S26.2","11S26.3","11S28.5","11S28.6"]}]},"cholesterol":{"n":"Cholesterol","cls":"lipid","hub":1,"one":"A membrane fluidity regulator that nearly every cell can make for itself — and can barely get rid of.","does":["**Nearly all our cells can make cholesterol themselves**, from acetyl-CoA via HMG-CoA.","Main role is **regulating membrane fluidity in ALL membranes**, plus structural integrity and receptor/enzyme activity.","**Steroid hormone synthesis is only a tiny proportion** of its use.","Total body cholesterol **~140 g**; **~1 g/day eaten, only 0.5 g absorbed**."],"reg":["**HMG-CoA reductase is the rate-limiting step**, regulated by insulin, by cholesterol levels, by **gene expression and enzyme degradation**, and even by a **circadian rhythm**."],"clin":["**Statins** inhibit HMG-CoA reductase → more LDL receptors → lower blood LDL.","**Phytosterols** are competitive inhibitors of absorption from the gut.","Cutting dietary intake does little: **absorbed = lost as bile salts**, so the liver just synthesises more."],"why":"Cholesterol is the one molecule with no catabolic pathway — it leaves only as bile salt, which is why it accumulates.","course":[{"l":"L11","t":"Cholesterol","ids":["11S23.1","11S23.2","11S23.3","11S23.4","11S28.1","11S28.2","11S29.1","11S29.2","11S29.4","11S30.1","11S30.2","11S30.3","11S33.1"]}]},"foamcell":{"n":"Foam cell","cls":"cell","one":"A macrophage that has eaten oxidised LDL without a brake and cannot stop.","does":["Takes up **ox-LDL without control** — no receptor downregulation.","Creates an **inflammatory environment** in the vessel wall.","That inflammation **encourages the formation of plaques**."],"clin":["The link between lipid handling and **atherosclerosis**; **trans fats** also raise markers of inflammation and the LDL:HDL ratio."],"why":"The pathology is not high cholesterol per se — it is uncontrolled uptake plus inflammation.","course":[{"l":"L11","t":"Cholesterol","ids":["11S24.1","11S24.2","11S24.3","11S36.4","11S36.5"]}]},"transfat":{"n":"Trans fatty acids","cls":"lipid","one":"Industrial by-products of partial hydrogenation — the wrong geometry for the enzyme that fixes double bonds.","does":["Made by **catalytic hydrogenation** of polyunsaturated fats, to make them **easier to spread**.","Hydrogenation is **incomplete**, causing **random new TRANS double bonds**.","Oxidising an unsaturated fatty acid needs **one extra enzyme** — and the double bond must be **cis**."],"clin":["Correlated with **heart disease**, especially a **raised LDL:HDL ratio**, and with raised **inflammation markers**.","**<1% of energy intake in Australia vs 3% in the USA**; **Denmark banned them in 2003**; New York caps restaurants at 0.5 g/serve."],"why":"A geometry problem, not a calorie problem: cis is metabolisable, trans is not.","course":[{"l":"L11","t":"Fatty acid structure","ids":["11S31.1","11S32.1","11S34.1","11S35.1","11S35.2","11S35.3","11S36.1","11S36.2","11S36.3","11S36.4","11S36.5","11S37.1","11S37.2","11S37.3"]}]},"aa":{"n":"Amino acids","cls":"amino","hub":1,"one":"Twenty side chains, no storage form, and two problems to solve every time one is broken down.","does":["Protein pool **6 kg**; intake **100 g/day**, loss **100 g/day**, **turnover 200 g/day (~4%)**.","**We cannot store protein** — it all has a function, so any excess **must be degraded**.","Yield ~**17 kJ/g**, but protein is a **last-ditch fuel store**.","Two problems always: **dispose of the amine group** (ammonia is toxic) and **place the carbon skeleton**."],"reg":["Degradation enzymes have **very high Km**, so they are **not really 'controlled'** — they just respond to [amino acid]. Excess is therefore burnt."],"clin":["In **protein malnutrition**, lacking **one** amino acid can stop an entire protein being made, leaving **all the others in excess**.","Turnover varies hugely by tissue: **muscle 2%/day, intestine 15%/day**."],"why":"Breaking protein for glucose is doubly wasteful: it cost ATP to build, and costs ATP to dispose of the nitrogen.","course":[{"l":"L01","t":"Introduction","ids":["1S28.1","1S28.2","1S28.3","1S28.4","1S28.5"]},{"l":"L12","t":"Nitrogen metabolism","ids":["12S2.1","12S2.2","12S3.1","12S3.2","12S4.4","12S5.4","12S5.5","12S13.1","12S3.5"]}]},"bcaa":{"n":"Branched-chain amino acids","cls":"amino","f":"Leu / Ile / Val","one":"The amino acids the liver refuses — so muscle burns them itself.","does":["**Portal vein: 20% BCAA.** **Hepatic vein: 70% BCAA.** The liver has kept the rest.","Arterial blood matches what left the liver; **muscle veins have had the BCAA removed**.","**Muscle uses a lot of BCAA for energy**, directly."],"why":"The portal/hepatic/arterial/muscle-vein series is the cleanest evidence in the unit that organs specialise.","course":[{"l":"L12","t":"Nitrogen metabolism","ids":["12S6.1","12S6.2","12S6.3","12S6.4","12S7.3"]}]},"alanine":{"n":"Alanine","cls":"amino","one":"Pyruvate wearing an amine group — muscle's way of posting nitrogen to the liver.","does":["**Alanine aminotransferase (ALT)** interconverts alanine and **pyruvate**.","Made from pyruvate by **transamination**, which **gets amine groups out of the muscle**.","In the **glucose–alanine cycle** muscle sends alanine to the liver and gets **glucose** back.","Muscle releases **disproportionately high alanine and glutamine** during starvation."],"why":"Cori cycle sends carbon as lactate; the glucose–alanine cycle sends carbon *and* nitrogen.","course":[{"l":"L06","t":"Amine disposal","ids":["6S5.1","6S5.2"]},{"l":"L12","t":"Nitrogen","ids":["12S1.5","12S1.6","12S7.2","12S7.4","12S8.3"]}]},"glutamate":{"n":"Glutamate","cls":"amino","one":"The central amine clearing house — α-ketoglutarate plus a nitrogen, and the hub of transamination.","does":["One of the **three amine acceptors**: α-ketoglutarate → glutamate.","**Glutamate dehydrogenase** releases its **NH₃** for urea synthesis.","**Glutamine synthetase** adds a second nitrogen: glutamate + NH₃ → glutamine, **using ATP**.","With aspartate, supplies the nitrogen that is **synthesised into urea**."],"why":"Three acceptors only — alanine, glutamate, aspartate — and all three come from glycolysis/Krebs.","course":[{"l":"L06","t":"Amine disposal","ids":["6S5.1","6S5.2","6S6.2"]},{"l":"L12","t":"Nitrogen","ids":["12S1.2","12S1.3","12S1.4","12S8.1","12S8.3"]}]},"glutamine":{"n":"Glutamine","cls":"amino","one":"A two-nitrogen, non-toxic courier — how peripheral tissues safely ship ammonia to the liver.","does":["In most tissues **glutamine synthetase**: glutamate + NH₃ → glutamine, **consuming ATP**.","In the liver **glutaminase** hydrolyses it back: glutamine → glutamate + NH₃.","Released from muscle in **disproportionately high amounts** during starvation, alongside alanine."],"why":"Ammonia never travels free in blood. It travels as glutamine or as an amino group on alanine.","course":[{"l":"L12","t":"Nitrogen","ids":["12S1.2","12S1.3","12S7.2"]}]},"aspartate":{"n":"Aspartate","cls":"amino","one":"Oxaloacetate plus a nitrogen — and the donor of urea's second nitrogen atom.","does":["The third amine acceptor: **oxaloacetate → aspartate**.","Feeds the **urea cycle** directly; **urea is synthesised from aspartate and glutamate**.","Its carbon leaves the urea cycle again as **fumarate**, back to Krebs."],"why":"Urea's two nitrogens: one from free NH₃ (via carbamoyl phosphate), one from aspartate.","course":[{"l":"L06","t":"Amine disposal","ids":["6S5.1","6S5.2","6S6.2"]},{"l":"L12","t":"Urea cycle","ids":["12S8.3","12S9.1"]}]},"nh3":{"n":"Ammonia","cls":"amino","f":"NH₃ / NH₄⁺","one":"The thing all of nitrogen metabolism is arranged around avoiding.","does":["**Poisonous** — which is why amine groups are channelled onto carriers instead of released.","Released in the liver by **glutaminase** and **glutamate dehydrogenase**, right where the urea cycle is.","**Fixed** into carbamoyl phosphate, then into urea."],"why":"Every oddity of nitrogen metabolism — three acceptors, glutamine couriers, a whole ATP-hungry cycle — exists because of this one toxicity.","course":[{"l":"L06","t":"Amine disposal","ids":["6S4.5","6S6.4"]},{"l":"L12","t":"Nitrogen","ids":["12S4.4","12S9.1"]}]},"carbamoylp":{"n":"Carbamoyl phosphate","cls":"acid","x":1,"one":"The ammonia-fixing step of the urea cycle — where free NH₃ is locked up at the cost of ATP.","does":["Fixes **NH₃** into an activated form that ornithine can accept.","Supplies **one of urea's two nitrogen atoms** (the other comes from aspartate).","One of the **steps requiring energy** that make the urea cycle expensive."],"why":"The learning outcome asks for the ammonia-**fixing** and ammonia-**releasing** reactions — this is the fixing one.","course":[{"l":"L12","t":"Urea cycle","ids":["12S9.1","12S9.2"]}]},"ornithine":{"n":"Ornithine","cls":"amino","one":"The carrier of the urea cycle — same logic as oxaloacetate in Krebs, regenerated every turn.","does":["**Ornithine is the carrier of the urea cycle.**","Accepts carbamoyl phosphate → citrulline, goes round, and is regenerated when urea is released.","Its **route through the compartments** is one of the listed learnable features."],"why":"Three carriers to recognise: CoA for acyl, oxaloacetate for acetate, ornithine for nitrogen.","course":[{"l":"L12","t":"Urea cycle","ids":["12S9.1","12S9.2"]}]},"citrulline":{"n":"Citrulline","cls":"amino","x":1,"one":"Ornithine that has picked up its carbamoyl group — and the step that crosses the mitochondrial membrane.","does":["Formed from **ornithine + carbamoyl phosphate**.","Condenses with **aspartate** (which brings urea's second nitrogen) to make argininosuccinate."],"why":"Compartmentation is an explicit learning outcome for this cycle — citrulline is where it changes.","course":[{"l":"L12","t":"Urea cycle","ids":["12S9.1"]}]},"argininosucc":{"n":"Argininosuccinate","cls":"amino","x":1,"one":"The join between the urea cycle and the Krebs cycle.","does":["Made from **citrulline + aspartate**, using ATP.","Split into **arginine + fumarate** — and that fumarate goes to the **Krebs cycle**."],"why":"This is the 'molecules shared with the Krebs cycle' answer.","course":[{"l":"L12","t":"Urea cycle","ids":["12S9.1"]}]},"arginine":{"n":"Arginine","cls":"amino","x":1,"one":"One hydrolysis away from urea — and from regenerating the carrier.","does":["Hydrolysed to **urea + ornithine**, closing the cycle.","Carries both of urea's nitrogen atoms at this point."],"course":[{"l":"L12","t":"Urea cycle","ids":["12S9.1","12S9.2"]}]},"urea":{"n":"Urea","cls":"acid","one":"Two nitrogens, non-toxic, water-soluble — the safe disposal form, made only in the liver.","does":["**The urea cycle occurs only in the liver.**","Synthesised from **aspartate and glutamate** nitrogen; **urea carries two nitrogen atoms**.","**Urea is non-toxic, in contrast to ammonia.**","The cycle **consumes a lot of ATP** — nitrogen disposal is not free."],"clin":["Nitrogen balance: 100 g protein ≈ **16.5 g N** in; out as **~14 g urea**, ~2 g faeces, 0.5 g skin."],"why":"A lot of ATP to dispose of amine groups is one of the two reasons making glucose from protein is wasteful.","course":[{"l":"L06","t":"Urea cycle","ids":["6S6.1","6S6.2","6S6.3","6S6.4","6S10.2"]},{"l":"L12","t":"Nitrogen","ids":["12S3.3","12S3.4","12S5.2","12S9.1","12S9.2"]}]},"prpp":{"n":"PRPP","cls":"sugar","f":"phosphoribosyl pyrophosphate","one":"Ribose 5-phosphate activated — the first committed step of making purines from scratch.","does":["Built on **ribose 5-phosphate** from the pentose phosphate pathway.","**Purine synthesis is complex**, needing **ATP, folate and amino acids** — so much purine comes from **salvage**."],"clin":["Drugs **inhibit PRPP — the first step of de novo purine synthesis**. **6-mercaptopurine** treats cancers, **particularly leukaemias**.","It works because **cancer cells have a very high demand** for purine/pyrimidine synthesis while **normal cells manage on salvage**."],"why":"The link from the pentose phosphate pathway to chemotherapy — one step, one drug class.","course":[{"l":"L12","t":"Purines","ids":["12S16.1","12S16.2","12S16.3","12S16.4"]},{"l":"L10","t":"PPP","ids":["10S24.1"]}]},"urate":{"n":"Urate","cls":"acid","one":"The end of purine degradation — and poorly soluble, which is the whole problem.","does":["Produced when purines are **in excess**, and **also in an energy crisis**.","The energy-crisis route is via **adenylate kinase (2 ADP ⇌ ATP + AMP)** feeding adenine nucleotides into degradation."],"clin":["**Urate crystallises out in joints, causing gout.**"],"why":"Gout is not only a diet problem — anything that dumps AMP into degradation can do it.","course":[{"l":"L12","t":"Purines","ids":["12S17.1","12S17.2"]}]},"insulin":{"n":"Insulin","cls":"hormone","hub":1,"one":"The fed-state signal: anabolic and anti-catabolic at the same time, in every tissue at once.","does":["Secreted by **β-cells when glucose >5 mM**; also responds to **amino acids**.","**Anabolic** — stimulates synthesis of macromolecules. **Anti-catabolic** — prevents their breakdown.","Needed for **GLUT-4 translocation only** — **not** for GLUT-1 or GLUT-2.","**More importantly than uptake, it stimulates disposal** into storage products."],"reg":["ON: **GLUT-4, PDH phosphatase, ACC, PP1 → glycogen synthase, LPL**; genes for **FAS** and the esterification enzyme.","OFF: **lipolysis** (lowers cAMP in fat cells), hepatic glucose production, proteolysis.","Indirectly stimulates **PFK**: driving storage uses ATP, which lowers the energy charge, which activates PFK. Signals to store fuel also cause fuel to be burnt."],"clin":["**Insulin resistance**: more insulin needed for the same clearance. **Intolerance**: hyperinsulinaemia that still is not enough.","**Type 2 diabetes**: β-cells exhausted, no dynamic response, basal euglycaemia lost.","**C-peptide** indicates endogenous secretion; insulin is **post-translationally cleaved** before release."],"why":"One hormone, one direction, every tissue — which is why removing it (type 1) breaks everything at once.","course":[{"l":"L09","t":"Glycaemic responses","ids":["9S5.3","9S5.4","9S5.5","9S5.6","9S6.1","9S6.2","9S6.3","9S20.4","9S22.4"]},{"l":"L10","t":"Lipogenesis","ids":["10S5.1","10S15.1","10S26.2","10S26.3"]},{"l":"L13","t":"Type 1 diabetes","ids":["13S3.1","13S3.2","13S6.1","13S6.2","13S8.1","13S8.2","13S11.1"]}]},"glucagon":{"n":"Glucagon","cls":"hormone","hub":1,"one":"The fasting signal — one receptor, one second messenger, and a cascade that amplifies it enormously.","does":["Secreted by **α-cells when glucose <4.5 mM**.","Receptor → **cAMP** → **PKA** → phosphorylation cascade.","**Liver glycogenolysis** ON, **WAT lipolysis** ON, **glycolysis** OFF, **gluconeogenesis** ON.","**Muscle has no glucagon receptors** — in muscle the equivalent signal is **adrenalin**."],"reg":["A cascade gives **amplification** (a massive response from a tiny signal) and **more control** (each step can also be tuned by calcium, AMP).","**PKA is activated by removing its inhibitory R subunit**; the amounts of cAMP made are tiny and do not dent cellular ATP."],"why":"Glucagon's whole effect is 'add phosphate' — and phosphate switches the fed-state enzymes off and the fasting ones on.","course":[{"l":"L05","t":"Glycogenolysis","ids":["5S6.3","5S8.1","5S9.1","5S9.2","5S9.3","5S10.1","5S10.2","5S10.3","5S12.1","5S16.1"]},{"l":"L08","t":"F2,6BP","ids":["8S13.3","8S14.1","8S15.5"]},{"l":"L09","t":"Islets","ids":["9S5.2"]}]},"glut":{"n":"Glucose transporters (GLUT)","cls":"protein","one":"Four letters that decide which tissue sees glucose and which tissue needs permission.","does":["**GLUT-1**: all cells, all the time — background uptake, including the **brain**.","**GLUT-2**: **liver and pancreas** — the blood-glucose-regulating tissues; so active that **[glucose]blood = [glucose]cell**.","**GLUT-4**: **muscle and adipose** — the **insulin-sensitive** ones, translocated from Golgi vesicles.","**GLUT-9** appears alongside the hepatic G6Pase system."],"reg":["Insulin moves **GLUT-4 only**. Without insulin GLUT-4 is endocytosed, but **GLUT-1 remains**, so muscle still takes up some glucose — it just sends it out as lactate."],"clin":["In type 1 diabetes **basal and hepatic glucose transport are unaffected**, because they do not use GLUT-4."],"why":"Any question about which tissue responds to insulin is really a question about which GLUT it uses.","course":[{"l":"L03","t":"Glycolysis","ids":["3S22.2","3S22.3","3S22.4","3S22.5"]},{"l":"L05","t":"Starvation","ids":["5S3.5","5S6.2","5S6.4","5S17.2"]},{"l":"L09","t":"Glucose disposal","ids":["9S13.1","9S13.2","9S13.3","9S13.4","9S14.1"]},{"l":"L13","t":"Type 1 diabetes","ids":["13S8.1","13S8.2"]}]}},"enz":{"glut":{"n":"GLUT transporters","r":"glucose in or out, facilitated","w":"GLUT-1 everywhere, GLUT-2 liver/pancreas, GLUT-4 muscle/fat","k":["GLUT-4 only: insulin moves it to the surface"],"rls":1,"mol":"glut","course":[{"l":"L03","ids":["3S22.2","3S22.3","3S22.4","3S22.5"]}]},"hk":{"n":"Hexokinase","r":"glucose + ATP → G6P + ADP","w":"all tissues; the glucose-trapping step","k":["**Inhibited by its product G6P**","So if G6P is not being used, glucose is **not trapped and goes back out** — no wasted ATP"],"rls":1,"course":[{"l":"L07","ids":["7S14.1","7S14.2","7S14.3"]}]},"gk":{"n":"Glucokinase","r":"glucose + ATP → G6P + ADP","w":"liver (the hexokinase isoform that does the liver's job)","k":["**NOT inhibited by G6P**","**High Km (10 mM)** so it is never saturated — hepatic [G6P] tracks blood glucose"],"course":[{"l":"L09","ids":["9S23.2","9S23.3","9S23.4"]}]},"pfk1":{"n":"PFK-1 (phosphofructokinase)","r":"F6P + ATP → F1,6BP + ADP","w":"cytosol, all tissues — **the** classic rate-limiting step of glycolysis","k":["**Inhibited by high ATP**, its own substrate","**AMP binds away from the active site** and changes how it responds to ATP — activating","**Citrate inhibits** it allosterically","**F2,6BP stimulates** it","**Not** directly stimulated by insulin — insulin acts on it indirectly, by creating energy demand"],"rls":1,"course":[{"l":"L07","ids":["7S13.1","7S13.2","7S13.3","7S13.4","7S13.5"]},{"l":"L09","ids":["9S21.1","9S21.2","9S21.3"]}]},"pfk2":{"n":"PFK-2 / F2,6BPase","r":"F6P ⇌ F2,6BP — two activities on one polypeptide","w":"liver","k":["**PKA phosphorylation converts PFK-2 into F2,6BPase**","Glucagon → cAMP → PKA → [F2,6BP] falls → gluconeogenesis"],"course":[{"l":"L08","ids":["8S10.1","8S13.1","8S13.2","8S13.3","8S15.3","8S15.6"]}]},"aldolase":{"n":"Aldolase","r":"F1,6BP → G3P + DHAP","w":"cytosol; reversible, so it serves gluconeogenesis too","course":[{"l":"L03","ids":["3S23.3"]}]},"tpi":{"n":"Triose phosphate isomerase","r":"DHAP ⇌ G3P","w":"cytosol","x":1,"course":[{"l":"L03","ids":["3S23.3"]}]},"gapdh":{"n":"G3P dehydrogenase","r":"G3P + NAD⁺ + Pi → 1,3-BPG + NADH","w":"cytosol — the only oxidation in glycolysis","k":["Needs NAD⁺, so it needs lactate or a shuttle to keep going"],"course":[{"l":"L03","ids":["3S26.1"]}]},"pgk":{"n":"PGK / mutase / enolase","r":"1,3-BPG → … → PEP, recouping one ATP","w":"cytosol; substrate-level phosphorylation","course":[{"l":"L03","ids":["3S26.2","3S26.3"]}]},"pk":{"n":"Pyruvate kinase","r":"PEP → pyruvate + ATP","w":"cytosol; the final, energy-releasing step","k":["Irreversible — gluconeogenesis must bypass it with **two** ATP-consuming steps"],"rls":1,"course":[{"l":"L06","ids":["6S7.4"]},{"l":"L07","ids":["7S12.1"]}]},"ldh":{"n":"Lactate dehydrogenase (LDH)","r":"pyruvate + NADH → lactate + NAD⁺","w":"cytosol, everywhere","k":["Runs whenever cytosolic NAD⁺ must be regenerated — PDH off, or no oxygen, or glycolysis outrunning mitochondria"],"course":[{"l":"L03","ids":["3S28.3","3S31.1"]},{"l":"L05","ids":["5S20.1"]}]},"phosphorylase":{"n":"Glycogen phosphorylase","r":"glycogen + Pi → G1P (**phosphorolysis**)","w":"liver (glucagon) and muscle (adrenalin)","k":["Active **phosphorylated**","Glucagon/adrenalin → cAMP → PKA → cascade → ON","Also tunable by **calcium and AMP** at intermediate steps"],"rls":1,"course":[{"l":"L05","ids":["5S6.1","5S7.1","5S8.1","5S10.2","5S10.3"]}]},"debranch":{"n":"Debranching enzyme","r":"glycogen + H₂O → **free glucose** (simple hydrolysis)","w":"at branch points","k":["About **10% of residues** come off as free glucose, not G1P — because it uses water, not phosphate"],"course":[{"l":"L05","ids":["5S11.1","5S11.2","5S12.3"]}]},"pgm":{"n":"Phosphoglucomutase","r":"G1P ⇌ G6P","w":"cytosol","x":1,"course":[{"l":"L05","ids":["5S7.2"]}]},"gs":{"n":"Glycogen synthase (GS)","r":"UDP-glucose + glycogen → glycogen(n+1) + UDP","w":"liver and muscle; **not** in white adipose tissue","k":["Active **dephosphorylated**","**Insulin stimulates PP1**, which dephosphorylates GS → ON","Phosphorylated by **glycogen synthase kinase**","**G6P can activate even the phosphorylated form**","Branching is **not** done by GS"],"rls":1,"course":[{"l":"L09","ids":["9S19.1","9S20.1","9S20.2","9S20.3","9S20.4","9S23.5"]}]},"g6pase":{"n":"Glucose 6-phosphatase (G6Pase)","r":"G6P + H₂O → glucose + Pi","w":"**liver only** — in the endoplasmic reticulum, working with GLUT-2","k":["**No ATP is gained** from losing the phosphate","Its absence in muscle is why muscle glycogen cannot leave the muscle"],"course":[{"l":"L05","ids":["5S6.2","5S12.2"]},{"l":"L08","ids":["8S2.2","8S2.3","8S4.1"]}]},"fbpase":{"n":"Fructose 1,6-bisphosphatase","r":"F1,6BP + H₂O → F6P + Pi","w":"**liver only**; bypasses PFK-1","k":["**Inhibited by F2,6BP**","So when glucagon lowers F2,6BP, this enzyme is released → gluconeogenesis"],"course":[{"l":"L06","ids":["6S7.3"]},{"l":"L08","ids":["8S11.1","8S15.2","8S15.4","8S15.5"]}]},"pc":{"n":"Pyruvate carboxylase (PC)","r":"pyruvate + CO₂ + ATP → oxaloacetate","w":"**mitochondrial**; can exist outside the liver","k":["**Stimulated by acetyl-CoA**","So β-oxidation simultaneously shuts PDH and opens gluconeogenesis","Its oxaloacetate is **anaplerotic** — more carrier for Krebs, and it replaces OAA taken for glucose"],"course":[{"l":"L06","ids":["6S7.6"]},{"l":"L08","ids":["8S3.2","8S3.4","8S17.2","8S19.2","8S19.3","8S20.1"]}]},"pepck":{"n":"PEPCK","r":"oxaloacetate + GTP → PEP + CO₂","w":"location **varies**; can exist outside the liver","k":["Controlled by **increased transcription/translation of its gene**, not allosterically"],"course":[{"l":"L08","ids":["8S3.2","8S3.3","8S17.1","8S17.3"]}]},"facs":{"n":"Fatty acyl-CoA synthetase","r":"FA + CoA + ATP → FA-CoA + **AMP** + PPi","w":"cytosol — the trapping/activating step","k":["**ATP → AMP, not ADP**; PPi hydrolysis pulls it over, so it is effectively irreversible"],"course":[{"l":"L03","ids":["3S10.3","3S10.4","3S10.5"]}]},"cat1":{"n":"CAT-1 / CPT-1","r":"FA-CoA + carnitine → FA-carnitine + CoA","w":"cytosolic face of the inner membrane — the gate into β-oxidation","k":["**Inhibited by malonyl-CoA**","So insulin, by driving ACC, **inhibits fatty acid oxidation**","Carnitine availability is a listed rate-limiting factor"],"rls":1,"course":[{"l":"L03","ids":["3S12.1","3S12.4"]},{"l":"L10","ids":["10S20.1","10S20.2","10S20.3"]}]},"cat2":{"n":"CAT-2 / CPT-2","r":"FA-carnitine + CoA → FA-CoA + carnitine","w":"matrix face; carnitine returns to the cytosol","course":[{"l":"L03","ids":["3S12.2","3S12.3"]}]},"betaox":{"n":"β-oxidation (4 steps)","r":"FA-CoA → acetyl-CoA + FA-CoA(−2C) + NADH + FADH₂","w":"matrix; named for action on the **β-carbon**","k":["Order: **oxidation – hydration – oxidation – cleavage**","Step 1 uses **FAD** (makes –C=C–), step 3 uses **NAD⁺** (makes –C=O), then **CoA attacks**","Each round: **1 acetyl-CoA, 1 NADH, 1 FADH₂**. C16 needs **7 rounds → 8 acetyl-CoA, 7 NADH, 7 FADH₂**","Rate depends on **CoA regeneration**, i.e. on Krebs — except in liver, where ketogenesis can do it"],"course":[{"l":"L03","ids":["3S8.1","3S13.1","3S13.2","3S14.1","3S14.2","3S16.1","3S16.2","3S17.1"]},{"l":"L06","ids":["6S12.1","6S12.2","6S12.4"]}]},"pdh":{"n":"Pyruvate dehydrogenase (PDH)","r":"pyruvate + CoA + NAD⁺ → acetyl-CoA + CO₂ + NADH","w":"matrix — **irreversible**, the point of no return","k":["**Inactive when phosphorylated (totally OFF), active when dephosphorylated (totally ON)**","**PDH kinase** phosphorylates; **PDH phosphatase** reactivates. Activity is the **balance** of the two","**Acetyl-CoA stimulates PDH kinase → PDH off** — so β-oxidation stops glucose oxidation","**Insulin stimulates PDH phosphatase → PDH on**","The **total amount of enzyme does not change**, only the phosphorylated fraction"],"rls":1,"course":[{"l":"L05","ids":["5S19.1","5S19.2","5S19.3","5S19.6"]},{"l":"L07","ids":["7S17.1","7S17.2","7S17.3","7S17.4","7S17.5"]},{"l":"L10","ids":["10S15.1"]}]},"cs":{"n":"Citrate synthase","r":"acetyl-CoA + oxaloacetate → citrate + **CoA**","w":"matrix — first step of Krebs *and* of acetyl-CoA export","k":["**Regenerates CoA**, which is what allows PDH and β-oxidation to continue"],"course":[{"l":"L01","ids":["1S18.2"]},{"l":"L10","ids":["10S16.3","10S16.4"]}]},"aconitase":{"n":"Aconitase","r":"citrate ⇌ isocitrate","w":"matrix","x":1,"course":[{"l":"L03","ids":["3S36.1"]}]},"icdh":{"n":"Isocitrate dehydrogenase (ICDH)","r":"isocitrate → α-KG + CO₂ + NADH","w":"matrix","k":["NAD-linked; driven by **NAD⁺ and ADP availability**, i.e. ATP demand"],"rls":1,"course":[{"l":"L06","ids":["6S11.3"]},{"l":"L07","ids":["7S12.1"]}]},"ogdh":{"n":"α-Ketoglutarate dehydrogenase (OGDH)","r":"α-KG → succinyl-CoA + CO₂ + NADH","w":"matrix","k":["NAD-linked; same demand-driven control as ICDH"],"rls":1,"course":[{"l":"L06","ids":["6S11.3"]},{"l":"L07","ids":["7S12.1"]}]},"scs":{"n":"Succinyl-CoA synthetase","r":"succinyl-CoA → succinate + **GTP**","w":"matrix; the cycle's substrate-level phosphorylation","course":[{"l":"L03","ids":["3S33.4","3S36.2"]}]},"sdh":{"n":"Succinate dehydrogenase (SDH) = Complex II","r":"succinate → fumarate + FADH₂","w":"inner mem
