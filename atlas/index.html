    });
  });

  m.nodes.forEach(function (n) {
    var b = BOX[mapId][n.id];
    var cls = "node";
    if (n.hub === 1) cls += " hub";
    if (n.hub === 2) cls += " hub2";
    if (n.e) cls += " enz";
    if (n.t) cls += " " + n.t;
    if (n.reg) cls += " reg";
    var g = svgEl("g", { "class": cls, "data-node": n.id, tabindex: n.t === "note" ? null : 0 });
    if (n.t !== "note") {
      g.appendChild(svgEl("rect", {
        x: b.x, y: b.y, width: b.w, height: b.h, "class": "hit",
        "vector-effect": "non-scaling-stroke"
      }));
    }
    g.appendChild(svgEl("rect", { x: b.x, y: b.y, width: b.w, height: b.h, "class": "box" }));
    var topPad = b.sub ? 0 : 0;
    var startY = b.y + b.h / 2 - ((b.lines.length - 1) * b.lh) / 2 + (b.sub ? -5 : 0)
                 + (n.t === "note" ? 0 : 4.5);
    b.lines.forEach(function (L, k) {
      var t = svgEl("text", {
        x: n.x, y: startY + k * (n.t === "note" ? 14 : b.lh),
        "class": n.t === "note" ? "s" : "n"
      });
      t.textContent = L; g.appendChild(t);
    });
    if (b.sub) {
      var st = svgEl("text", { x: n.x, y: b.y + b.h - 8, "class": "s" });
      st.textContent = b.sub; g.appendChild(st);
    }
    if (n.e && ENZ[n.e].rls)
      g.appendChild(svgEl("circle", { cx: b.x + b.w - 9, cy: b.y + 9, r: 3.6, "class": "rlsdot" }));
    if (n.inh) {
      var it = svgEl("text", { x: n.x, y: b.y + b.h + 13, "class": "inh" });
      it.textContent = "⊣ " + n.inh; g.appendChild(it);
    }
    g.addEventListener("click", function (ev) {
      ev.stopPropagation();
      if (n.t === "note") return;
      if (n.t === "jump") { go("#map/" + n.to); return; }
      go((n.m ? "#m/" : "#e/") + (n.m || n.e) + "@" + mapId + "/" + n.id);
    });
    g.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); g.dispatchEvent(new Event("click")); }
    });
    gNodes.appendChild(g);
  });

  svg.addEventListener("click", function () {
    if (Date.now() - (V.dragEnd || 0) < 250) return;
    if (V.sel) { V.sel = null; go("#map/" + mapId); }
  });

  applyFilters();
  initialView();
}

/* dim everything that is not part of the current selection / filter / state */
function applyFilters() {
  var m = MAPBY[V.map]; if (!m) return;
  var svg = el("canvas");
  var anyPw = Object.keys(V.pwOn).some(function (k) { return V.pwOn[k]; });
  var st = V.state ? STBY[V.state] : null;
  var selNode = V.sel;
  var keepNodes = null;
  if (selNode) {
    keepNodes = {}; keepNodes[selNode] = 1;
    m.edges.forEach(function (e) {
      if (e.a === selNode) keepNodes[e.b] = 1;
      if (e.b === selNode) keepNodes[e.a] = 1;
    });
  }
  m.edges.forEach(function (e, i) {
    var g = svg.querySelector('[data-edge="' + i + '"]');
    var lab = svg.querySelector('[data-elab="' + i + '"]');
    if (!g) return;
    var show = true;
    if (anyPw) show = show && !!V.pwOn[e.pw];
    if (st) {
      if (st.off.indexOf(e.pw) >= 0) show = false;
      else if (st.on.length && st.on.indexOf(e.pw) < 0) show = false;
    }
    if (selNode) show = show && (e.a === selNode || e.b === selNode);
    g.querySelector(".edge").classList.toggle("dim", !show);
    Array.prototype.forEach.call(g.querySelectorAll("polygon"), function (p) {
      p.setAttribute("fill-opacity", show ? 0.85 : 0.07);
    });
    if (lab) Array.prototype.forEach.call(lab.children, function (c) { c.classList.toggle("dim", !show); });
  });
  m.nodes.forEach(function (n) {
    var g = svg.querySelector('[data-node="' + n.id + '"]');
    if (!g) return;
    var dim = false;
    if (keepNodes) dim = !keepNodes[n.id];
    else if (anyPw || st) {
      dim = true;
      m.edges.forEach(function (e) {
        if (e.a !== n.id && e.b !== n.id) return;
        var ok = true;
        if (anyPw) ok = ok && !!V.pwOn[e.pw];
        if (st) {
          if (st.off.indexOf(e.pw) >= 0) ok = false;
          else if (st.on.length && st.on.indexOf(e.pw) < 0) ok = false;
        }
        if (ok) dim = false;
      });
      if (n.t === "jump" || n.t === "note") dim = false;
    }
    g.classList.toggle("dim", dim);
    g.classList.toggle("sel", n.id === selNode);
  });
}

/* ----------------------------------------------------------- pan and zoom */
function setView() {
  var vp = el("canvas").querySelector("#vp");
  if (vp) vp.setAttribute("transform",
    "translate(" + V.tx.toFixed(2) + " " + V.ty.toFixed(2) + ") scale(" + V.k.toFixed(4) + ")");
}
function fitMap() {
  /* preserveAspectRatio already fits the viewBox to the element, and the
     viewBox IS the content bounding box, so the fit is the identity. */
  V.k = 1; V.tx = 0; V.ty = 0;
  setView();
}
/* Fitting a 3240-unit wall chart to a laptop screen renders each molecule
   about 31x9 px - too small to read and too small to hit. Large maps open at
   a legible zoom on their busiest molecule instead; the fit button and 0 still
   give the overview. */
function initialView() {
  var m = MAPBY[V.map];
  if (!m) return;
  var r = el("canvaswrap").getBoundingClientRect();
  if (!r.width || !r.height) { fitMap(); return; }
  var s = Math.max(m.vb[2] / r.width, m.vb[3] / r.height);
  var k = 0.62 * s;
  if (k <= 1.05) { fitMap(); return; }
  V.k = k;
  var f = m.focus && BOX[m.id] && BOX[m.id][m.focus];
  if (f) {
    V.tx = m.vb[2] / 2 - (f.x + f.w / 2) * k;
    V.ty = m.vb[3] / 2 - (f.y + f.h / 2) * k;
  } else {
    V.tx = (m.vb[2] - m.vb[2] * k) / 2;
    V.ty = (m.vb[3] - m.vb[3] * k) / 2;
  }
  setView();
}

function zoomBy(f, cx, cy) {
  var m = MAPBY[V.map]; if (!m) return;
  var k2 = Math.max(0.25, Math.min(6, V.k * f));
  if (cx == null) { cx = m.vb[2] / 2; cy = m.vb[3] / 2; }
  V.tx = cx - (cx - V.tx) * (k2 / V.k);
  V.ty = cy - (cy - V.ty) * (k2 / V.k);
  V.k = k2; setView();
}
function toVB(ev) {
  var svg = el("canvas"), r = svg.getBoundingClientRect(), m = MAPBY[V.map];
  var s = Math.max(m.vb[2] / r.width, m.vb[3] / r.height);
  return [(ev.clientX - r.left - (r.width - m.vb[2] / s) / 2) * s,
          (ev.clientY - r.top - (r.height - m.vb[3] / s) / 2) * s];
}
/* Wheel handling, the way a large chart wants it: two-finger scroll pans and
   pinch (which arrives as ctrl+wheel) zooms. A fixed per-event zoom step is
   unusable on a trackpad, which fires dozens of events per flick - so the
   factor is proportional to the delta and clamped so no single event can
   jump more than a notch. */
function pxToVB() {
  var m = MAPBY[V.map];
  if (!m) return 1;
  var r = el("canvaswrap").getBoundingClientRect();
  return Math.max(m.vb[2] / r.width, m.vb[3] / r.height);
}
function initCanvas() {
  var svg = el("canvas"), pts = {}, drag = null, pinch = null;

  svg.addEventListener("wheel", function (ev) {
    if (!V.map) return;
    ev.preventDefault();
    var unit = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? 100 : 1;
    var dx = ev.deltaX * unit, dy = ev.deltaY * unit;
    if (ev.ctrlKey || ev.metaKey) {
      var p = toVB(ev);
      var f = Math.exp(-dy * 0.0075);
      f = Math.max(0.85, Math.min(1.18, f));
      zoomBy(f, p[0], p[1]);
    } else {
      var s = pxToVB();
      if (ev.shiftKey) { V.tx -= dy * s; }
      else { V.tx -= dx * s; V.ty -= dy * s; }
      setView();
    }
  }, { passive: false });

  svg.addEventListener("dblclick", function (ev) {
    var p = toVB(ev);
    zoomBy(ev.altKey ? 1 / 1.6 : 1.6, p[0], p[1]);
  });

  svg.addEventListener("pointerdown", function (ev) {
    pts[ev.pointerId] = ev;
    var ids = Object.keys(pts);
    if (ids.length === 1) {
      drag = { p: toVB(ev), tx: V.tx, ty: V.ty, moved: false, id: ev.pointerId };
    } else if (ids.length === 2) {
      drag = null;
      pinch = { d: spread(pts, ids) };
    }
  });

  function spread(map, ids) {
    var a = toVB(map[ids[0]]), b = toVB(map[ids[1]]);
    return { dist: Math.hypot(a[0] - b[0], a[1] - b[1]),
             cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2 };
  }

  svg.addEventListener("pointermove", function (ev) {
    if (!pts[ev.pointerId]) return;
    pts[ev.pointerId] = ev;
    var ids = Object.keys(pts);
    if (ids.length >= 2) {
      var now = spread(pts, ids);
      if (pinch && pinch.d.dist > 0) zoomBy(now.dist / pinch.d.dist, now.cx, now.cy);
      pinch = { d: now };
      return;
    }
    if (!drag) return;
    var p = toVB(ev);
    V.tx = drag.tx + (p[0] - drag.p[0]);
    V.ty = drag.ty + (p[1] - drag.p[1]);
    if (!drag.moved && Math.abs(p[0] - drag.p[0]) + Math.abs(p[1] - drag.p[1]) > 4) {
      drag.moved = true;
      svg.classList.add("drag");
      /* only now take the pointer, so a plain click still reaches the node */
      try { svg.setPointerCapture(drag.id); } catch (err) {}
    }
    setView();
  });

  function up(ev) {
    delete pts[ev.pointerId];
    if (Object.keys(pts).length < 2) pinch = null;
    if (!Object.keys(pts).length) {
      if (drag && drag.moved) V.dragEnd = Date.now();
      drag = null;
      svg.classList.remove("drag");
    }
  }
  svg.addEventListener("pointerup", up);
  svg.addEventListener("pointercancel", up);

  document.addEventListener("keydown", function (ev) {
    if (!V.map) return;
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (ev.key === "+" || ev.key === "=") { ev.preventDefault(); zoomBy(1.25); }
    else if (ev.key === "-" || ev.key === "_") { ev.preventDefault(); zoomBy(1 / 1.25); }
    else if (ev.key === "0") { ev.preventDefault(); fitMap(); }
  });

  el("zin").addEventListener("click", function () { zoomBy(1.25); });
  el("zout").addEventListener("click", function () { zoomBy(1 / 1.25); });
  el("zfit").addEventListener("click", fitMap);
}

/* ============================================================ the panel */
function openPanel(kind, id, place) {
  var p = el("panel"), body = el("pbody");
  p.classList.add("on");
  body.innerHTML = "";
  if (kind === "m") renderMolecule(id, body, place); else renderEnzyme(id, body);
  body.scrollTop = 0;
}
function closePanel() {
  el("panel").classList.remove("on");
  V.sel = null;
  if (V.map) applyFilters();
}
function listBlock(title, items, cls) {
  if (!items || !items.length) return null;
  var b = h("div", "blk " + (cls || ""));
  b.appendChild(h("h5", null, esc(title)));
  var ul = h("ul");
  items.forEach(function (t) { ul.appendChild(h("li", null, fmt(t))); });
  b.appendChild(ul);
  return b;
}
function topicChips(kind, id) {
  var ts = topicsOf(kind, id);
  if (!ts.length) return null;
  var b = h("div", "blk");
  b.appendChild(h("h5", null, "Topics"));
  var w = h("div", "pills");
  ts.forEach(function (t) {
    var btn = h("button", "pill", esc(t.n));
    btn.addEventListener("click", function () { go("#t/" + t.id); });
    w.appendChild(btn);
  });
  b.appendChild(w);
  return b;
}
function renderMolecule(id, body, place) {
  var M = MOL[id];
  el("ptitle").textContent = M.n;
  el("pformula").textContent = M.f || "";
  var tagw = el("ptags"); tagw.innerHTML = "";
  if (M.cls) tagw.appendChild(h("span", "tag cls", esc(M.cls)));
  if (M.hub) tagw.appendChild(h("span", "tag", "hub"));
  if (place) {
    var pm = MAPBY[place.map];
    if (pm) tagw.appendChild(h("span", "tag", esc(pm.n)));
  }

  body.appendChild(h("p", "one", fmt(M.one)));
  var b = listBlock("What it does", M.does); if (b) body.appendChild(b);

  /* connections, gathered from every map */
  var cs = (CONN[id] || []);
  var outs = cs.filter(function (c) { return c.dir === "out" || c.dir === "both"; });
  var ins = cs.filter(function (c) { return c.dir === "in" || c.dir === "both"; });
  if (ins.length || outs.length) {
    var cb = h("div", "blk");
    cb.appendChild(h("h5", null, "Connections"));
    var cw = h("div", "conn");
    function row(c, arrow) {
      var r = h("div", "row");
      r.appendChild(h("span", "arrow", arrow));
      var who = h("button", "who", esc(MOL[c.other].n));
      who.addEventListener("click", function () { go("#m/" + c.other); });
      r.appendChild(who);
      var via = h("span", "via");
      if (c.enz) {
        var eb = h("button", null, esc(ENZ[c.enz].n));
        eb.addEventListener("click", function () { go("#e/" + c.enz); });
        via.appendChild(eb);
      } else if (c.lbl) {
        via.appendChild(document.createTextNode(c.lbl));
      }
      if (c.note) {
        var sp = h("span");
        sp.style.color = "var(--ink-3)";
        sp.textContent = (via.textContent ? " · " : "") + c.note;
        via.appendChild(sp);
      }
      r.appendChild(via);
      return r;
    }
    ins.forEach(function (c) { cw.appendChild(row(c, "←")); });
    outs.forEach(function (c) { cw.appendChild(row(c, "→")); });
    cb.appendChild(cw);
    body.appendChild(cb);
  }

  b = listBlock("Regulation", M.reg, "reg"); if (b) body.appendChild(b);
  b = listBlock("Clinical", M.clin, "clin"); if (b) body.appendChild(b);
  if (M.why) body.appendChild(h("div", "why", fmt(M.why)));

  if (M.deep && M.deep.length) {
    var d = h("div", "blk");
    d.appendChild(h("h5", null, "Going deeper"));
    M.deep.forEach(function (pair, i) {
      var det = h("details", "deep");
      if (i === 0) det.setAttribute("open", "");
      var s = h("summary", null, esc(pair[0]));
      det.appendChild(s);
      det.appendChild(h("div", "d", fmt(pair[1])));
      d.appendChild(det);
    });
    body.appendChild(d);
  }

  b = topicChips("m", id); if (b) body.appendChild(b);

  var pl = (PLACES[id] || []);
  if (pl.length) {
    var mb = h("div", "blk");
    mb.appendChild(h("h5", null, "Find it on"));
    var jb = h("div", "jumpbtns");
    var seen = {};
    pl.forEach(function (q) {
      if (seen[q.map]) return; seen[q.map] = 1;
      var btn = h("button", "btn", esc(MAPBY[q.map].n));
      btn.addEventListener("click", function () {
        go("#m/" + id + "@" + q.map + "/" + q.node);
      });
      jb.appendChild(btn);
    });
    mb.appendChild(jb);
    body.appendChild(mb);
  }
}
function renderEnzyme(id, body) {
  var E = ENZ[id];
  el("ptitle").textContent = E.n;
  el("pformula").textContent = E.r || "";
  var tagw = el("ptags"); tagw.innerHTML = "";
  tagw.appendChild(h("span", "tag cls", "enzyme"));
  if (E.rls) tagw.appendChild(h("span", "tag rls", "rate-limiting"));

  if (E.w) body.appendChild(h("p", "one", fmt(E.w)));
  var b = listBlock("Regulation / detail", E.k, "reg"); if (b) body.appendChild(b);
  b = listBlock("Clinical", E.clin, "clin"); if (b) body.appendChild(b);

  var ee = ENZEDGE[id] || [];
  if (ee.length) {
    var cb = h("div", "blk");
    cb.appendChild(h("h5", null, "Catalyses"));
    var cw = h("div", "conn");
    var seen = {};
    ee.forEach(function (r) {
      var key = r.a + ">" + r.b; if (seen[key]) return; seen[key] = 1;
      var row = h("div", "row");
      row.appendChild(h("span", "arrow", "→"));
      [r.a, r.b].forEach(function (x, i) {
        if (MOL[x]) {
          var btn = h("button", "who", esc(MOL[x].n));
          btn.addEventListener("click", function () { go("#m/" + x); });
          row.appendChild(btn);
        } else row.appendChild(h("span", "who", esc(x)));
        if (i === 0) row.appendChild(h("span", "via", "→"));
      });
      cw.appendChild(row);
    });
    cb.appendChild(cw);
    body.appendChild(cb);
  }
  b = topicChips("e", id); if (b) body.appendChild(b);
}

  tt.appendChild(h("p", null, esc(t.d)));

  });
  var mk = Object.keys(mc).sort(function (a, b) { return mc[b] - mc[a]; });

  var g = h("div", "pills");
  t.mol.forEach(function (mid) {
    var M = MOL[mid]; if (!M) return;
    var btn = h("button", "pill", esc(M.n));
    btn.addEventListener("click", function () { go("#m/" + mid); });
    g.appendChild(btn);
  });
  wrap.appendChild(g);

  wrap.appendChild(h("h3", "sec", "Enzymes & steps — " + t.enz.length));
  var g2 = h("div", "pills");
  t.enz.forEach(function (eid) {
    var E = ENZ[eid]; if (!E) return;
    var btn = h("button", "pill enzpill",
      esc(E.n) + (E.rls ? ' <span class="mini" style="color:var(--bad)">RLS</span>' : ""));
    btn.addEventListener("click", function () { go("#e/" + eid); });
    g2.appendChild(btn);
  });
  wrap.appendChild(g2);

  w.appendChild(wrap);
  var parts = [{ label: "All maps", hash: "" }];
  var pm = routeMapId(PREV);
  if (pm && MAPBY[pm]) parts.push({ label: MAPBY[pm].n, hash: PREV });
  parts.push({ label: t.n });
  setCrumb(parts);
}

/* ============================================================= quiz view */
var QS = null;
function shuffled(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function viewQuiz(id) {
  var t = TOPBY[id], bank = QUIZ[id];
  if (!t || !bank) return viewHome();
  QS = {
    topic: id,
    qs: shuffled(bank).map(function (q) {
      var order = shuffled([0, 1, 2, 3]);
      return { n: q.n, q: q.q, f: q.f,
               o: order.map(function (i) { return q.o[i]; }),
               a: order.indexOf(q.a) };
    }),
    i: 0, score: 0, picked: null
  };
  showStage("scrollview");
  setCrumb([{ label: "All maps", hash: "" }, { label: t.n, hash: "#t/" + id }, { label: "Quiz" }]);
  drawQuiz();
}
function drawQuiz() {
  var w = el("scrollview"); w.innerHTML = "";
  var wrap = h("div", "quizwrap");
  var t = TOPBY[QS.topic];

  if (QS.i >= QS.qs.length) {
    var pct = Math.round(100 * QS.score / QS.qs.length);
    var sb = h("div", "scorebig");
    sb.appendChild(h("div", "big", QS.score + " / " + QS.qs.length));
    sb.appendChild(h("p", null, esc(t.n) + " — " + pct + "%"));
    var row = h("div", "qfoot");
    row.style.justifyContent = "center";
    var again = h("button", "btn on", "Try again");
    again.addEventListener("click", function () { viewQuiz(QS.topic); });
    var back = h("button", "btn", "Back to " + t.n);
    back.addEventListener("click", function () { go("#t/" + QS.topic); });
    row.appendChild(again); row.appendChild(back);
    sb.appendChild(row);
    wrap.appendChild(sb);
    w.appendChild(wrap);
    return;
  }

  var Q = QS.qs[QS.i];
  var head = h("div", "qhead");
  head.appendChild(h("h2", null, esc(t.n)));
  wrap.appendChild(head);
  wrap.appendChild(h("div", "qmeta", "Question " + (QS.i + 1) + " of " + QS.qs.length +
    " · score " + QS.score));
  var pr = h("div", "qprog");
  pr.appendChild(h("i")).style.width = (100 * QS.i / QS.qs.length) + "%";
  wrap.appendChild(pr);

  var card = h("div", "qcard");
  card.appendChild(h("div", "qn", esc(Q.n.replace(/_/g, " "))));
  card.appendChild(h("div", "qstem", esc(Q.q)));
  var opts = h("div", "opts");
  Q.o.forEach(function (o, i) {
    var btn = h("button", "opt");
    btn.appendChild(h("span", "ltr", "ABCD"[i]));
    btn.appendChild(h("span", null, esc(o)));
    if (QS.picked != null) {
      btn.disabled = true;
      if (i === Q.a) btn.classList.add("right");
      else if (i === QS.picked) btn.classList.add("wrong");
    } else {
      btn.addEventListener("click", function () {
        QS.picked = i;
        if (i === Q.a) QS.score++;
        drawQuiz();
      });
    }
    opts.appendChild(btn);
  });
  card.appendChild(opts);

  if (QS.picked != null) {
    var ok = QS.picked === Q.a;
    var fb = h("div", "fb" + (ok ? "" : " bad"));
    fb.appendChild(h("span", "h", ok ? "Correct" : "Not quite"));
    fb.appendChild(document.createTextNode(Q.f));
    card.appendChild(fb);
    var foot = h("div", "qfoot");
    foot.appendChild(h("span", "spacer"));
    var nx = h("button", "btn on", QS.i + 1 >= QS.qs.length ? "See score" : "Next question");
    nx.addEventListener("click", function () { QS.i++; QS.picked = null; drawQuiz(); });
    foot.appendChild(nx);
    card.appendChild(foot);
  }
  wrap.appendChild(card);

  var bk = h("div", "qfoot");
  var b2 = h("button", "btn", "← " + t.n);
  b2.addEventListener("click", function () { go("#t/" + QS.topic); });
  bk.appendChild(b2);
  wrap.appendChild(bk);
  w.appendChild(wrap);
}

/* =============================================================== map view */
function viewMap(mapId, stateId) {
  var m = MAPBY[mapId];
  if (!m) return viewHome();
  if (V.map && V.map !== mapId) saveMapState();
  showStage("mapview");
  var mem = MEM[mapId];
  V.state = stateId && STBY[stateId] ? stateId : (mem ? mem.state : null);
  V.pwOn = mem ? mem.pwOn : {};
  V.pwOpen = mem ? mem.pwOpen : false;
  V.sel = null;
  buildMapBar(m, V.state);
  renderMap(mapId);
  if (mem && mem.k) { V.k = mem.k; V.tx = mem.tx; V.ty = mem.ty; setView(); }
  drawStateBar();
  setCrumb([{ label: "All maps", hash: "" }, { label: m.n }]);
}
function buildMapBar(m, stateId) {
  var bar = el("mapbar"); bar.innerHTML = "";
  bar.appendChild(h("span", "label", "Map"));
  MAPS.forEach(function (x) {
    var b = h("button", "btn", esc(x.n));
    if (x.id === m.id) b.setAttribute("aria-current", "true");
    b.addEventListener("click", function () { go("#map/" + x.id); });
    bar.appendChild(b);
  });
  bar.appendChild(h("span", "sep"));
  bar.appendChild(h("span", "label", "State"));
  STATES.forEach(function (s) {
    var b = h("button", "btn", esc(s.n));
    if (s.id === V.state) b.classList.add("on");
    b.addEventListener("click", function () {
      V.state = (V.state === s.id) ? null : s.id;
      V.pwOn = {};
      buildMapBar(m, V.state); drawStateBar(); applyFilters();
    });
    bar.appendChild(b);
  });

  var used = {};
  m.edges.forEach(function (e) { if (e.pw) used[e.pw] = 1; });
  var keys = PW.filter(function (p) { return used[p.id]; });
  if (keys.length) {
    bar.appendChild(h("span", "sep"));
    var nOn = keys.filter(function (p) { return V.pwOn[p.id]; }).length;
    var toggle = h("button", "btn", "Pathways \u00b7 " + keys.length +
      (nOn ? " \u00b7 " + nOn + " on" : "") + (V.pwOpen ? " \u25b4" : " \u25be"));
    if (nOn) toggle.classList.add("on");
    toggle.addEventListener("click", function () {
      V.pwOpen = !V.pwOpen; buildMapBar(m, V.state);
    });
    bar.appendChild(toggle);
    if (nOn) {
      var clr = h("button", "btn", "clear");
      clr.addEventListener("click", function () {
        V.pwOn = {}; buildMapBar(m, V.state); applyFilters();
      });
      bar.appendChild(clr);
    }
  }
  if (keys.length && V.pwOpen) {
    keys.forEach(function (p) {
      var c = h("span", "chip");
      var d = h("span", "dot");
      d.style.background = pwColor(p.id);
      c.appendChild(d);
      c.appendChild(document.createTextNode(p.n));
      if (V.pwOn[p.id]) c.classList.add("on");
      c.addEventListener("click", function () {
        V.pwOn[p.id] = !V.pwOn[p.id];
        V.state = null;
        buildMapBar(m, null); drawStateBar(); applyFilters();
      });
      bar.appendChild(c);
    });
  }
}
function drawStateBar() {
  var sb = el("statebar");
  if (!V.state) { sb.classList.remove("on"); sb.innerHTML = ""; return; }
  var s = STBY[V.state];
  sb.classList.add("on");
  sb.classList.remove("open");
  sb.innerHTML = '<span class="st">' + esc(s.n) + " — " + esc(s.sub) + "</span>" +
    '<span class="cap">' + fmt(s.cap) + "</span>";
  var more = h("button", "capmore", "more");
  more.addEventListener("click", function () {
    more.textContent = sb.classList.toggle("open") ? "less" : "more";
  });
  sb.appendChild(more);
}

/* ================================================================ router */
/* Leaving a map to read a topic should not cost you your place in it. Each
   map remembers where it was left - zoom, pan, selection, filters, state -
   and is put back exactly as you had it. */
var MEM = {};
function saveMapState() {
  if (!V.map) return;
  MEM[V.map] = { k: V.k, tx: V.tx, ty: V.ty,
                 pwOn: V.pwOn, pwOpen: V.pwOpen, state: V.state };
}
function showStage(which) {
  if (which !== "mapview" && V.map) saveMapState();
  ["scrollview", "mapview"].forEach(function (k) {
    el(k).style.display = (k === which) ? (k === "mapview" ? "flex" : "block") : "none";
  });
  if (which !== "mapview") { V.map = null; }
}

/* Which map a route points at, so a topic can offer a way back to the exact
   spot it was opened from rather than to the top of the map. */
function routeMapId(hash) {
  if (!hash) return null;
  var p2 = String(hash).replace(/^#/, "").split("/");
  if (p2[0] === "map") return p2[1] || null;
  if ((p2[0] === "m" || p2[0] === "e") && p2[1] && p2[1].indexOf("@") > 0) return p2[1].split("@")[1];
  return null;
}

/* parts: [{label, hash}] - every part but the last is a link */
function setCrumb(parts) {
  var c = el("crumb");
  c.innerHTML = "";
  if (!parts || !parts.length) { c.style.display = "none"; return; }
  c.style.display = "";
  parts.forEach(function (p2, i) {
    if (i) c.appendChild(h("span", "csep", "\u203a"));
    if (p2.hash != null) {
      var b = h("button", "clink", esc(p2.label));
      b.addEventListener("click", function () { go(p2.hash); });
      c.appendChild(b);
    } else {
      c.appendChild(h("span", "ccur", esc(p2.label)));
    }
  });
}
function route(explicit) {
  var norm = String(explicit != null ? explicit : location.hash || "");
  if (norm && norm.charAt(0) !== "#") norm = "#" + norm;
  if (LASTROUTE !== norm) PREV = LASTROUTE;
  LASTROUTE = norm;
  var hash = norm.replace(/^#/, "");
  var parts = hash.split("/");
  var at = null;
  /* #m/<id>@<map>/<node> */
  if ((parts[0] === "m" || parts[0] === "e") && parts[1] && parts[1].indexOf("@") > 0) {
    var bits = parts[1].split("@");
    at = { map: bits[1], node: parts[2] };
    parts[1] = bits[0];
  }
  if (parts[0] === "map") {
    viewMap(parts[1], parts[2]);
    closePanelQuiet();
    return;
  }
  if (parts[0] === "t") { closePanelQuiet(); return viewTopic(parts[1]); }
  if (parts[0] === "q") { closePanelQuiet(); return viewQuiz(parts[1]); }
  if (parts[0] === "m" && MOL[parts[1]]) {
    if (at && MAPBY[at.map]) {
      if (V.map !== at.map) { viewMap(at.map, V.state); }
      V.sel = at.node; applyFilters();
      centreOn(at.map, at.node);
    } else {
      /* prefer the map already open, else the first one that carries it */
      var pl = (V.map && placementOn(V.map, parts[1], V.sel)) || (PLACES[parts[1]] || [])[0];
      if (pl) {
        if (V.map !== pl.map) viewMap(pl.map, V.state);
        V.sel = pl.node;
        applyFilters();
        centreOn(pl.map, pl.node);
      } else if (!V.map) {
        viewHome();
      }
    }
    openPanel("m", parts[1], at || (PLACES[parts[1]] || [])[0]);
    return;
  }
  if (parts[0] === "e" && ENZ[parts[1]]) {
    if (at && MAPBY[at.map]) {
      if (V.map !== at.map) viewMap(at.map, V.state);
      V.sel = at.node; applyFilters(); centreOn(at.map, at.node);
    } else {
      var ep = (ENZPLACE[parts[1]] || []);
      var e1 = null, j;
      for (j = 0; j < ep.length; j++) if (ep[j].map === V.map) { e1 = ep[j]; break; }
      if (!e1 && !V.map) e1 = ep[0];
      if (e1) {
        if (V.map !== e1.map) viewMap(e1.map, V.state);
        V.sel = e1.node; applyFilters(); centreOn(e1.map, e1.node);
      }
    }
    openPanel("e", parts[1]);
    return;
  }
  closePanelQuiet();
  viewHome();
}
var LASTROUTE = null, PREV = null;
/* Navigate. The hash is the address, but the view - not the URL - is the
   thing that has to change, so routing is driven by what was last rendered.
   Comparing against location.hash instead meant that if the two ever drifted
   apart (a hash write the environment did not honour), clicking a link whose
   target matched the stale URL did nothing at all. */
function go(hash) {
  hash = String(hash || "");
  if (hash && hash.charAt(0) !== "#") hash = "#" + hash;
  try { location.hash = hash; } catch (e) {}
  if (LASTROUTE !== hash) route(hash);
}
function closePanelQuiet() { el("panel").classList.remove("on"); }
function centreOn(mapId, nodeId) {
  var b = BOX[mapId] && BOX[mapId][nodeId];
  var m = MAPBY[mapId];
  if (!b || !m) return;
  var r = el("canvaswrap").getBoundingClientRect();
  var s = Math.max(m.vb[2] / r.width, m.vb[3] / r.height);
  var viewW = m.vb[2], viewH = m.vb[3];
  if (V.k < 0.9) V.k = 0.9;
  V.tx = viewW / 2 - (b.x + b.w / 2) * V.k;
  V.ty = viewH / 2 - (b.y + b.h / 2) * V.k;
  setView();
}

/* ================================================================ search */
var SIDX = [];
Object.keys(MOL).forEach(function (k) {
  SIDX.push({ kind: "Molecule", id: k, n: MOL[k].n, sub: MOL[k].one,
              s: (MOL[k].n + " " + (MOL[k].f || "") + " " + MOL[k].one).toLowerCase(), href: "#m/" + k });
});
Object.keys(ENZ).forEach(function (k) {
  SIDX.push({ kind: "Enzyme", id: k, n: ENZ[k].n, sub: ENZ[k].r || "",
              s: (ENZ[k].n + " " + (ENZ[k].r || "")).toLowerCase(), href: "#e/" + k });
});
TOPICS.forEach(function (t) {
  SIDX.push({ kind: "Topic", id: t.id, n: t.n, sub: t.d, s: (t.n + " " + t.d).toLowerCase(), href: "#t/" + t.id });
});
MAPS.forEach(function (m) {
  SIDX.push({ kind: "Map", id: m.id, n: m.n, sub: m.sub, s: (m.n + " " + m.sub).toLowerCase(), href: "#map/" + m.id });
});
STATES.forEach(function (s) {
  SIDX.push({ kind: "State", id: s.id, n: s.n, sub: s.sub,
              s: (s.n + " " + s.sub + " " + s.cap).toLowerCase(), href: "#map/core/" + s.id });
});

function initSearch() {
  var inp = el("search"), box = el("results"), cur = -1, hits = [];
  function close() { box.classList.remove("on"); box.innerHTML = ""; cur = -1; hits = []; }
  inp.addEventListener("input", function () {
    var q = inp.value.trim().toLowerCase();
    if (q.length < 2) return close();
    hits = SIDX.filter(function (r) { return r.s.indexOf(q) >= 0; })
      .sort(function (a, b) {
        var an = a.n.toLowerCase().indexOf(q), bn = b.n.toLowerCase().indexOf(q);
        if ((an === 0) !== (bn === 0)) return an === 0 ? -1 : 1;
        if ((an >= 0) !== (bn >= 0)) return an >= 0 ? -1 : 1;
        return a.n.length - b.n.length;
      }).slice(0, 14);
    box.innerHTML = "";
    hits.forEach(function (r, i) {
      var b = h("button", null,
        '<span class="k">' + esc(r.kind) + "</span> <b>" + esc(r.n) + "</b>" +
        '<div class="sub">' + esc((r.sub || "").slice(0, 92)) + "</div>");
      b.addEventListener("click", function () { go(r.href); inp.value = ""; close(); inp.blur(); });
      box.appendChild(b);
    });
    box.classList.toggle("on", hits.length > 0);
  });
  inp.addEventListener("keydown", function (ev) {
    if (!hits.length) { if (ev.key === "Escape") { inp.value = ""; close(); } return; }
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      cur = (cur + (ev.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
      Array.prototype.forEach.call(box.children, function (c, i) {
        c.setAttribute("aria-selected", i === cur ? "true" : "false");
        if (i === cur) c.scrollIntoView({ block: "nearest" });
      });
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      box.children[cur < 0 ? 0 : cur].click();
    } else if (ev.key === "Escape") { inp.value = ""; close(); }
  });
  document.addEventListener("click", function (ev) {
    if (!el("searchwrap").contains(ev.target)) close();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "/" && document.activeElement !== inp &&
        !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      ev.preventDefault(); inp.focus();
    }
    if (ev.key === "Escape" && el("panel").classList.contains("on")) closePanel();
  });
}

/* ================================================================== boot */
function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem("mpw-theme"); } catch (e) {}
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  el("theme").addEventListener("click", function () {
    var now = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", now);
    try { localStorage.setItem("mpw-theme", now); } catch (e) {}
    if (V.map) { var s = V.sel; renderMap(V.map); V.sel = s; buildMapBar(MAPBY[V.map], V.state); applyFilters(); }
  });
}
el("pclose").addEventListener("click", function () {
  closePanel();
  if (V.map) go("#map/" + V.map);
  else go("");
});
el("home").addEventListener("click", function () { go(""); });
initTheme(); initSearch(); initCanvas();
window.addEventListener("hashchange", function () {
  /* go() has usually routed already; only act on a real back/forward or a
     hash typed into the address bar */
  if (String(location.hash || "") === LASTROUTE) return;
  route();
});
window.addEventListener("resize", function () { if (V.map && !V.sel) fitMap(); });
route();
})();
</script>
