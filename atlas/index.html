backwards except for three bypasses — and only the liver has the full set.","lec":"L06 · L08","ic":"arrow-up","mol":["pyruvate","oaa","pep","f16bp","f6p","g6p","glucose","lactate","glycerol","dhap","alanine","aa","acetylcoa","f26bp"],"enz":["pc","pepck","fbpase","g6pase","pfk2","alt"]},{"id":"ketone","n":"Ketone bodies","d":"The liver's water-soluble export form of fat — the only fat-derived fuel the brain can use.","lec":"L06 · L13","ic":"flame","mol":["kb","acac","bhb","acetone","hmgcoa","acacoa","acetylcoa","coa","oaa","fa","glucose"],"enz":["thiolase","hmgcs","hmgcl","bdh","ketolysis","betaox","pdh"]},{"id":"lipogen","n":"Lipogenesis & the pentose phosphate pathway","d":"Disposing of glucose as fat: the citrate shuttle out, NADPH in, two carbons at a time.","lec":"L09 · L10","ic":"plus-circle","mol":["acetylcoa","citrate","malonylcoa","palmitate","nadph","pgl6","ru5p","r5p","glycerol3p","tag","malate","oaa","insulin","g6p"],"enz":["acc","fas","acl","g6pdh","tktta","pdh"]},{"id":"lipo","n":"Lipoproteins & cholesterol","d":"Moving hydrophobic cargo through water — and the one molecule with no catabolic pathway.","lec":"L11","ic":"package","mol":["bilesalts","chylomicron","chylo_rem","vldl","idl","ldl","hdl","cholesterol","foamcell","transfat","hmgcoa","tag","fa"],"enz":["panclipase","lpl","cetp","ldlr","hmgcr"]},{"id":"nitrogen","n":"Nitrogen & amino acids","d":"No storage form, a toxic by-product, and three acceptors borrowed from glycolysis and Krebs.","lec":"L06 · L12","ic":"hexagon","mol":["aa","bcaa","alanine","glutamate","glutamine","aspartate","nh3","carbamoylp","citrulline","argininosucc","arginine","ornithine","urea","prpp","urate","akg","oaa","pyruvate","fumarate"],"enz":["transam","alt","glusyn","glutaminase","gdh","ureacycle","adk"]},{"id":"reg","n":"Regulation & rate-limiting steps","d":"What a rate-limiting step actually is, the three ways to change one, and reciprocal control.","lec":"L07 · L08","ic":"sliders","mol":["amp","atp","f26bp","citrate","acetylcoa","malonylcoa","insulin","glucagon","g6p","nadph"],"enz":["hk","pfk1","pfk2","pdh","gs","phosphorylase","acc","cat1","hmgcr","g6pdh","pka","pp1","adk","hsl","pc","pepck"]},{"id":"states","n":"Fuel selection: fed, fasting, exercise, diabetes","d":"The same map read six ways — this is what the unit is actually assessing.","lec":"L02 · L05 · L06 · L09 · L13","ic":"activity","mol":["glucose","fa","kb","lactate","glycogen","tag","aa","insulin","glucagon","creatinep","acetylcoa","glycerol","bcaa","alanine"],"enz":["pdh","hsl","cat1","phosphorylase","ck","pfk1"]}],"pw":[{"id":"glyco","n":"Glycolysis","c":"#2563eb"},{"id":"gluconeo","n":"Gluconeogenesis","c":"#0891b2"},{"id":"glycogenolysis","n":"Glycogenolysis","c":"#7c3aed"},{"id":"glycogenesis","n":"Glycogenesis","c":"#9333ea"},{"id":"betaox","n":"β-oxidation","c":"#ea580c"},{"id":"lipolysis","n":"Lipolysis","c":"#f59e0b"},{"id":"lipogen","n":"Lipogenesis","c":"#d97706"},{"id":"esterif","n":"Esterification","c":"#b45309"},{"id":"ppp","n":"Pentose phosphate","c":"#059669"},{"id":"krebs","n":"Krebs cycle","c":"#dc2626"},{"id":"ketogen","n":"Ketogenesis","c":"#db2777"},{"id":"ketolysis","n":"Ketolysis","c":"#be185d"},{"id":"lactate","n":"Lactate / NAD⁺","c":"#64748b"},{"id":"cori","n":"Cori cycle","c":"#475569"},{"id":"proteolysis","n":"Proteolysis","c":"#4f46e5"},{"id":"nitro","n":"Transamination","c":"#6366f1"},{"id":"urea","n":"Urea cycle","c":"#4338ca"},{"id":"purine","n":"Purines","c":"#818cf8"},{"id":"carrier","n":"H/e⁻ carriers","c":"#6b7280"},{"id":"etc","n":"Electron transport","c":"#0d9488"},{"id":"pump","n":"H⁺ pumping","c":"#14b8a6"},{"id":"oxphos","n":"ATP synthesis","c":"#15803d"},{"id":"uncouple","n":"Uncoupling","c":"#b91c1c"},{"id":"lipo","n":"Lipoprotein traffic","c":"#c026d3"},{"id":"chol","n":"Cholesterol","c":"#a21caf"}],"states":[{"id":"fed","n":"Fed / post-prandial","sub":"insulin high","cap":"Insulin is the only signal that matters. **GLUT-4 goes to the surface**, **PDH and ACC are dephosphorylated and ON**, PP1 switches **glycogen synthase** on, and G6P is pushed into **glycogen and fat**. Hepatic glucose output is off. Note the twist: driving storage *costs* ATP, which lowers the energy charge, which **stimulates PFK** — so the signal to store fuel also causes fuel to be burnt.","on":["glyco","glycogenesis","lipogen","esterif","ppp","krebs","etc","oxphos","pump","lipo"],"off":["gluconeo","glycogenolysis","betaox","ketogen","lipolysis","proteolysis"],"course":[{"l":"L09","ids":["9S13.5","9S14.1","9S22.1","9S22.3","9S22.4"]},{"l":"L10","ids":["10S26.2","10S26.3"]}]},{"id":"fasting","n":"Fasting / early starvation","sub":"first 24 hours","cap":"Post-absorptive: nothing coming from the gut. Glucagon up, insulin down. **Liver glycogen → blood glucose** (G6Pase, liver only) holds euglycaemia at ~4 mM, and **WAT lipolysis** floods the blood with fatty acids. Those fatty acids make acetyl-CoA, which **switches PDH off** — so muscle still takes up glucose on GLUT-1 but only takes it as far as **lactate**, which the liver rebuilds. That is the **glucose–fatty acid cycle** plus the **Cori cycle**: conservation and recycling. The problem: liver glycogen is only 100 g and the brain eats it in under a day.","on":["glycogenolysis","lipolysis","betaox","krebs","cori","lactate","gluconeo","etc","oxphos","pump"],"off":["glycogenesis","lipogen","esterif","ppp"],"course":[{"l":"L05","ids":["5S2.1","5S5.2","5S14.1","5S14.2","5S19.6","5S20.2","5S20.3"]}]},{"id":"starvation","n":"Late starvation","sub":"2–5 days and beyond","cap":"Liver glycogen is gone. **Hypoinsulinaemia drives proteolysis**, mostly from muscle; the skeletons go to **gluconeogenesis** and the amine groups to **urea**. Glycerol gives only 30 g glucose/day against a 120 g brain demand, and at **2 g protein per 1 g glucose** that shortfall costs ~180 g protein/day. The rescue is **ketone bodies**: the liver can oxidise fat with no ATP demand of its own because ketogenesis is a second way to regenerate CoA. By day 5 the brain is on **30 g glucose/day** and protein loss has fallen. Loss of body protein is still ultimately what kills.","on":["lipolysis","betaox","ketogen","ketolysis","gluconeo","proteolysis","krebs","urea","nitro","etc","oxphos","pump"],"off":["glyco","glycogenesis","lipogen","esterif","ppp","glycogenolysis"],"course":[{"l":"L06","ids":["6S4.3","6S10.4","6S10.5","6S12.4","6S14.5","6S16.1","6S16.2","6S16.3","6S17.2"]}]},{"id":"exercise","n":"Moderate exercise","sub":"jogging","cap":"Demand-driven, not hormone-driven. ATP use raises **ADP**, which speeds **ATP synthase**, which **dissipates the proton gradient**, which lets **electron transport** run faster, which regenerates the **H/e⁻ carriers** — so fuel oxidation rises. Walking: glucose first, then fatty acids take over within minutes and glucose is only taken to lactate. As the pace rises, **fatty acid oxidising enzymes hit their maximum**, so the brake on glucose oxidation comes off and you burn a mixture. That means **less recycling and faster liver glycogen depletion**.","on":["glyco","betaox","krebs","glycogenolysis","cori","lactate","lipolysis","etc","oxphos","pump"],"off":["lipogen","glycogenesis","esterif","ppp"],"course":[{"l":"L02","ids":["2S12.1","2S12.2","2S12.3","2S20.1","2S21.1","2S21.2","2S21.3","2S24.1","2S35.1"]}]},{"id":"sprint","n":"Sprint","sub":"Type IIb, seconds","cap":"Too fast for mitochondria — oxidative phosphorylation simply cannot deliver ATP at this rate. Order of supply: **creatine phosphate** (<5 s, 15 mM), then **muscle glycogen → glycolysis → lactate**, which is **2 ATP per glucose vs >30**. It must be muscle glycogen, because glucose transport is already maxed and takes seconds to recruit. Fatty acids cannot help at all: Type IIb fibres have **poor blood supply and few mitochondria**. Lots of lactate, very fast, into a poor blood supply.","on":["glycogenolysis","glyco","lactate"],"off":["betaox","krebs","etc","oxphos","pump","lipogen","glycogenesis","gluconeo","ketogen"],"course":[{"l":"L02","ids":["2S27.1","2S27.2","2S27.4","2S30.1","2S30.2","2S30.3","2S33.3","2S34.1","2S34.2"]}]},{"id":"t1dm","n":"Untreated type 1 diabetes","sub":"catabolic meltdown","cap":"**Starvation in the face of plenty.** No insulin, so every switch points the same way with nothing opposing it: **uncontrolled lipolysis** (fatty acids + glycerol), **uncontrolled proteolysis** (amino acids), **no glucose disposal** (G6P rises, inhibits hexokinase, glucose goes back out) and **hepatic glucose production continues**, with extra substrate from glycerol, amino acids and lactate. The liver is flooded with fatty acids while Krebs intermediates are being taken for gluconeogenesis → **enormous ketone body production**. Hyperglycaemia draws water out of tissues (thirst, polyuria); glucose spills once blood >10 mM; acetone on the breath; and ketone bodies + lactate + fatty acids give a **fatal acidosis**.","on":["lipolysis","betaox","ketogen","gluconeo","proteolysis","urea","nitro"],"off":["glyco","glycogenesis","lipogen","esterif","ppp"],"course":[{"l":"L13","ids":["13S9.1","13S9.2","13S10.2","13S11.2","13S12.1","13S12.2","13S13.1","13S13.2","13S14.1","13S15.1","13S16.1","13S16.2","13S17.1","13S17.3","13S17.4"]}]}],"quiz":{"energy":[{"n":"Adenine_Nucleotide_Signal","q":"Cellular ATP is held near 5 mM and falls by only about 10% even during intense work. Which adenine nucleotide is therefore the cell's main regulatory signal?","o":["AMP, because adenylate kinase converts a small fall in ATP into a large proportional rise in AMP levels","ATP, because enzymes are allosterically most sensitive to whichever nucleotide is present in the greatest amount","ADP, because it is the direct substrate of ATP synthase and so reports oxidative phosphorylation most faithfully","GTP, because it is made by substrate-level phosphorylation and is not consumed by other pathways"],"a":0,"f":"A 10% fall in ATP is a huge relative rise in AMP. Key enzymes read AMP, hardly ATP at all."},{"n":"Coupling_And_Oxygen_Consumption","q":"A cell abruptly stops doing work, so ATP is no longer being hydrolysed. What happens to its rate of oxygen consumption?","o":["It rises, because accumulated ATP allosterically stimulates the electron transport complexes","It is unchanged, because electron transport is driven by substrate supply rather than by ATP turnover","It falls, because ADP is not regenerated, so protons cannot re-enter the mitochondrial matrix","It falls only once NADH is exhausted, since the carriers keep delivering electrons until depleted"],"a":2,"f":"No ADP, no proton re-entry; the gradient builds, back-pressure stops pumping, and electron flow stops. Cells cannot burn fuel without doing work."},{"n":"Carrier_Short_Supply","q":"Why does a limited supply of NAD+ and FAD place a ceiling on the rate of fuel catabolism?","o":["Because they are consumed stoichiometrically and must be resynthesised from dietary precursors","Because once they are carrying H/e- they cannot strip any more until they have been reoxidised","Because they inhibit their own dehydrogenases once the reduced form accumulates in the matrix","Because they compete with ADP for binding sites on the inner mitochondrial membrane transporters"],"a":1,"f":"The carriers are recycled, not consumed. A loaded carrier is simply out of action until the chain unloads it."},{"n":"Creatine_Phosphate_Role","q":"What role does creatine phosphate play at the very start of a maximal sprint?","o":["It supplies ATP directly for under five seconds, covering the delay before glycogenolysis gets going","It shuttles cytosolic reducing equivalents into the mitochondrion so glycolysis can keep running","It activates glycogen phosphorylase so that muscle glycogen breakdown begins without hormonal input","It buffers intracellular pH against the lactate produced by rapid anaerobic glycolysis in fast fibres"],"a":0,"f":"About 15 mM, i.e. under five seconds. Creatine phosphate + ADP goes straight to ATP + creatine."},{"n":"Synthase_Versus_Synthetase","q":"A condensation reaction is catalysed by an enzyme named a synthetase rather than a synthase. What does that naming tell you about the reaction?","o":["It occurs only in the mitochondrial matrix rather than in the cytosol","It is freely reversible under physiological conditions and so cannot be rate-limiting","It requires a nucleotide triphosphate","It transfers an acyl group from coenzyme A onto an acceptor molecule"],"a":2,"f":"Synthases need no nucleotide triphosphate; synthetases do. Fatty acyl-CoA synthetase is the example to remember."}],"glyco":[{"n":"GLUT_Isoform_Tissue_Match","q":"Which glucose transporter is responsible for the insulin-dependent uptake of glucose into muscle and adipose tissue?","o":["GLUT-1, which is present in all cells at all times and provides background uptake of glucose","GLUT-2, which is so active in liver and pancreas that intracellular glucose equals blood glucose","GLUT-9, which works together with the glucose 6-phosphatase system in the endoplasmic reticulum","GLUT-4"],"a":3,"f":"GLUT-4 is the only insulin-sensitive transporter. Insulin moves it from Golgi vesicles to the surface."},{"n":"Hexokinase_Feedback_Logic","q":"Hexokinase is inhibited by its own product, glucose 6-phosphate. What is the physiological value of this feedback?","o":["It allows untrapped glucose to leave the cell again, so ATP is not wasted trapping glucose that cannot be used","It prevents glucose 6-phosphate from entering the pentose phosphate pathway when NADPH is not required","It ensures the liver can still release glucose into the blood during the post-absorptive period","It keeps glycolytic flux matched to the supply of NAD+ regenerated by lactate dehydrogenase"],"a":0,"f":"Trapping costs ATP. If G6P is piling up nothing downstream wants it, so stop trapping and let the glucose go."},{"n":"Glycolysis_Net_Yield","q":"What is the net yield from the conversion of one molecule of glucose to pyruvate in the cytosol?","o":["Four ATP, two pyruvate and two NADH, since each of the two triose phosphates yields two ATP","Two ATP, two pyruvate and two NADH","Two ATP, two pyruvate and two FADH2, because the oxidation step uses flavin rather than nicotinamide","Thirty ATP, two pyruvate and two NADH, counting the ATP generated downstream from the reduced carriers"],"a":1,"f":"Two invested, four recouped, so net two ATP, plus two pyruvate and two NADH."},{"n":"Lactate_Production_Purpose","q":"Why does a rapidly contracting muscle fibre convert pyruvate to lactate rather than oxidising it?","o":["Because lactate dehydrogenase has a lower Km for pyruvate than the mitochondrial pyruvate transporter does","Because lactate can cross the blood-brain barrier whereas pyruvate cannot, so the brain is supplied","Because reduction of pyruvate regenerates cytosolic NAD+ and keeps the whole process in the cytosol","Because the decarboxylation of pyruvate would release carbon dioxide faster than it could be exhaled"],"a":2,"f":"Glycolysis stalls without NAD+. Reducing pyruvate to lactate regenerates it without needing mitochondria."},{"n":"F26BP_Direction_Switch","q":"Fructose 2,6-bisphosphate is present in only small amounts and is not an intermediate of any pathway. What does it do?","o":["It phosphorylates PFK-1 directly, converting it from an inactive to an active conformation","It is the committed substrate of the enzyme that splits the six-carbon sugar into two triose phosphates","It carries phosphate into the endoplasmic reticulum so that free glucose can be released by the liver","It stimulates PFK-1 and inhibits fructose 1,6-bisphosphatase, so high levels favour glycolysis"],"a":3,"f":"One metabolite, both directions. High F2,6BP means glycolysis; low means gluconeogenesis."}],"glycogen":[{"n":"Phosphorolysis_Product","q":"Glycogen phosphorylase cleaves glycogen using inorganic phosphate rather than water. What is the immediate consequence?","o":["The product is glucose 1-phosphate, so no ATP is needed to trap the glucose unit that has been released","The product is free glucose, which can diffuse out of the cell through GLUT-2 without further processing","The reaction is freely reversible, so the same enzyme also catalyses glycogen synthesis when glucose is plentiful","The reaction consumes one ATP per glucose residue removed, which is recovered later in glycolysis"],"a":0,"f":"Phosphorolysis delivers G1P already phosphorylated, which is why glycogen is a cheaper fuel than blood glucose."},{"n":"Muscle_Glycogen_Selfishness","q":"Muscle glycogen cannot be used to raise blood glucose during fasting. Which single feature explains this best?","o":["Muscle glycogen is stored as much smaller granules that are degraded too slowly to affect blood glucose","Muscle lacks glucose 6-phosphatase, so it cannot convert glucose 6-phosphate into free glucose at all","Muscle expresses GLUT-4 rather than GLUT-2, so glucose cannot be exported even once it is made","Muscle glycogen phosphorylase is a different isoform that is insensitive to the second messenger cAMP"],"a":1,"f":"No G6Pase means the phosphate cannot come off, and phosphorylated sugars cannot leave the cell. Only liver has it."},{"n":"Glycogen_Synthase_Control","q":"How does insulin increase the activity of glycogen synthase?","o":["By raising cAMP, which activates protein kinase A and phosphorylates the enzyme into its active form","By inducing transcription of the glycogen synthase gene, so that total enzyme protein rises within minutes","By stimulating protein phosphatase 1, which dephosphorylates glycogen synthase into its active form","By increasing the supply of UTP, which raises the saturation of the enzyme with UDP-glucose"],"a":2,"f":"Glycogen synthase is active dephosphorylated. Insulin works through PP1; glucagon works the opposite way via PKA."},{"n":"Debranching_Enzyme_Chemistry","q":"About 10% of the glucose residues released from glycogen appear as free glucose rather than glucose 1-phosphate. Why?","o":["Because glucose 6-phosphatase acts on residues at branch points before they leave the granule","Because the debranching enzyme hydrolyses those linkages with water instead of with phosphate","Because phosphoglucomutase runs in reverse when the concentration of glucose 1-phosphate is high","Because glycogenin, the protein core, releases its attached residues without phosphorylating them"],"a":1,"f":"Simple hydrolysis at branch points, so no phosphate goes on. It matters in muscle, which cannot dephosphorylate G6P."},{"n":"Cascade_Amplification_Benefit","q":"Glucagon acts through a cascade of cAMP, protein kinase A and further phosphorylations rather than binding glycogen phosphorylase directly. What are the two benefits of that arrangement?","o":["It confines the response to the liver, and it avoids any measurable consumption of cellular ATP","It makes the response irreversible, and it allows the hormone to act without entering the cell","It amplifies a tiny signal into a large response, and gives extra control points such as calcium and AMP","It delays the response until glycogen stores are adequate, and it prevents simultaneous glycogen synthesis"],"a":2,"f":"Each step is catalytic, so the signal multiplies; and each step is a place where other inputs can tune the response."}],"fatox":[{"n":"Fatty_Acid_Trapping_Cost","q":"Activation of a fatty acid by fatty acyl-CoA synthetase converts ATP to AMP rather than to ADP. What else makes this step effectively irreversible?","o":["The released pyrophosphate is immediately hydrolysed, which pulls the whole reaction over to completion","The product is immediately exported into the mitochondrial matrix by the carnitine acyl-transferases","Coenzyme A is present at such low concentration that the reverse reaction is kinetically inaccessible","The enzyme is allosterically inhibited by its own product, long-chain fatty acyl-CoA, once activation is complete"],"a":0,"f":"Two phosphates' worth of energy, plus PPi hydrolysis. Once CoA is on, it stays on."},{"n":"Carnitine_Shuttle_Necessity","q":"Why must long-chain fatty acyl-CoA be converted to fatty acyl-carnitine before beta-oxidation can occur?","o":["Because carnitine protects the cell from the detergent properties of the free fatty acid during transit","Because the matrix enzymes of beta-oxidation recognise carnitine esters rather than coenzyme A esters","Because long-chain fatty acyl-CoA cannot cross the inner mitochondrial membrane, but carnitine esters can","Because the conversion releases coenzyme A, which is needed to prime the first oxidation step of the cycle"],"a":2,"f":"A pure transport problem. CAT-1 swaps CoA for carnitine outside, CAT-2 swaps it back inside, carnitine recycles."},{"n":"Malonyl_CoA_Reciprocal_Control","q":"Malonyl-CoA inhibits CAT-1 (carnitine acyl-transferase 1). What does this achieve?","o":["It prevents the cell from oxidising and synthesising fatty acids at the same time, avoiding a futile cycle","It diverts fatty acids towards esterification into triglyceride rather than towards oxidation in the matrix","It ensures that fatty acid oxidation continues only while the Krebs cycle can regenerate coenzyme A","It limits the rate of beta-oxidation to the capacity of the electron transport chain to reoxidise FADH2"],"a":0,"f":"Malonyl-CoA only exists when lipogenesis is running, so its presence shuts the gate into oxidation. No futile cycle."},{"n":"Beta_Oxidation_Reaction_Order","q":"What is the order of reaction types within one round of beta-oxidation?","o":["Oxidation, hydration, oxidation, cleavage","Reduction, dehydration, reduction, condensation, which is the same sequence used to build fatty acids","Carboxylation, oxidation, decarboxylation, cleavage, with carbon dioxide released at the second step","Hydration, oxidation, cleavage, oxidation, so that the flavin-linked step follows the nicotinamide-linked one"],"a":0,"f":"FAD makes the double bond, water adds across it, NAD+ oxidises the alcohol, then CoA attacks. Lipogenesis is the mirror image."},{"n":"Liver_Beta_Oxidation_Independence","q":"In most tissues the rate of beta-oxidation is limited by the tissue's demand for ATP, but the liver can oxidise fatty acids even with no extra ATP demand. Why?","o":["Because hepatic beta-oxidation uses a peroxisomal pathway that does not depend on the proton gradient","Because the liver can regenerate coenzyme A by making ketone bodies, not only through the Krebs cycle","Because glucagon directly activates the hepatic carnitine acyl-transferases independently of malonyl-CoA","Because the liver's high glucose 6-phosphatase activity keeps its cytosolic energy charge permanently low"],"a":1,"f":"This is the whole reason the liver is the ketogenic organ. A second route to free CoA uncouples fat oxidation from ATP demand."}],"krebs":[{"n":"Oxaloacetate_Carrier_Role","q":"Why is oxaloacetate described as a carrier rather than a substrate of the Krebs cycle?","o":["Because it is replenished from pyruvate by pyruvate carboxylase whenever the cycle runs quickly","Because it accepts the acetate unit and is regenerated by the end of each turn, so it is not net consumed","Because it cannot cross the inner mitochondrial membrane and so remains permanently inside the matrix","Because the two carbon atoms released as carbon dioxide derive from it rather than from the incoming acetate"],"a":1,"f":"Same logic as CoA and carnitine. Two carbons in, two out, and the four-carbon carrier comes back round."},{"n":"Krebs_Single_Turn_Yield","q":"What does one turn of the Krebs cycle generate from a single acetyl-CoA?","o":["Two NADH, two reduced FAD and one ATP produced directly by oxidative phosphorylation within the matrix","Four NADH and one GTP, with the fourth NADH arising from the oxidation of succinate to fumarate","Three NADH, one reduced FAD and one GTP","Three NADH and one reduced FAD, with no nucleotide triphosphate produced at any step of the cycle"],"a":2,"f":"At 2.5 ATP per NADH and 1.5 per FADH2, plus the GTP, that is about 10 ATP per acetyl-CoA."},{"n":"Complex_II_Dual_Identity","q":"Which Krebs cycle enzyme is also a complex of the electron transport chain, and what follows from that?","o":["Isocitrate dehydrogenase, which is Complex I, so its NADH is delivered without needing a shuttle","Malate dehydrogenase, which is Complex III, so its reducing equivalents reach cytochrome c directly","Succinyl-CoA synthetase, which is part of ATP synthase, which is why the cycle yields a nucleotide triphosphate","Succinate dehydrogenase, which is Complex II, so its FADH2 enters at ubiquinone and yields less ATP"],"a":3,"f":"Entering at Q skips Complex I, so only 6 protons are pumped instead of 10, i.e. 1.5 ATP rather than 2.5."},{"n":"Anaplerosis_Definition","q":"What does anaplerosis mean in the context of the Krebs cycle?","o":["Replenishing the cycle intermediates that have been extracted from the cycle for use in biosynthesis","Transferring reducing equivalents from the cytosol into the matrix without losing proton-pumping potential","Running the cycle in reverse so that acetyl-CoA can be regenerated from four-carbon intermediates","Oxidising the acetate carbons completely to carbon dioxide so that none are available for gluconeogenesis"],"a":0,"f":"Pyruvate carboxylase is the example: it tops the carousel back up after oxaloacetate has been taken for glucose."},{"n":"Krebs_Rate_Control","q":"What exerts the dominant control over the rate of the Krebs cycle?","o":["Covalent modification of the cycle's dehydrogenases by a dedicated kinase and phosphatase pair","The availability of the cofactors NAD+, FAD and ADP, which together reflect the demand for ATP","The concentration of acetyl-CoA delivered by pyruvate dehydrogenase and by beta-oxidation","Transcriptional induction of isocitrate dehydrogenase and alpha-ketoglutarate dehydrogenase by glucagon"],"a":1,"f":"Catabolism is demand-driven. More cofactor means faster; a high energy charge slows it down."}],"etc":[{"n":"Uncoupler_Oxygen_Consumption","q":"A compound makes the inner mitochondrial membrane permeable to protons. What is the predicted effect on fuel oxidation and ATP synthesis?","o":["Fuel oxidation falls and ATP synthesis falls, because the chain has no acceptor for its electrons","Fuel oxidation rises and ATP synthesis rises, because electrons flow faster through all four complexes","Fuel oxidation is unchanged and ATP synthesis falls, because only the synthase step is bypassed","Fuel oxidation rises sharply and ATP synthesis stops, because there is no back-pressure or gradient"],"a":3,"f":"No gradient means no restriction on pumping or electron flow, so NAD+ is regenerated instantly. Energy leaves as heat."},{"n":"Four_Routes_To_Ubiquinone","q":"Which of the following delivers reducing equivalents to ubiquinone while bypassing Complex I?","o":["The malate-aspartate shuttle, which transfers cytosolic NADH without loss of proton-pumping potential","The glycerol 3-phosphate shuttle","Cytochrome c, which collects electrons from Complex III and passes them on to Complex IV","The adenine nucleotide translocase, which exchanges matrix ATP for cytosolic ADP across the membrane"],"a":1,"f":"Routes to Q are Complex I, Complex II, the first step of beta-oxidation, and the glycerol 3-phosphate shuttle."},{"n":"Inhibitor_Redox_Pattern","q":"Cyanide blocks the transfer of electrons from the end of the electron transport chain to oxygen. What redox pattern results along the chain?","o":["The carriers upstream of the block remain reduced, because they have nowhere to pass their electrons","The carriers upstream of the block become oxidised, because the proton gradient collapses and reverses flow","Only Complex IV is affected, because each complex operates independently of the others","Ubiquinone remains oxidised while the cytochromes stay reduced, because only the latter contain iron"],"a":0,"f":"Block at the end and everything upstream backs up reduced. Block at Complex I with rotenone and everything downstream is oxidised."},{"n":"Cytochrome_C_Iron_Cargo","q":"Cytochrome c carries its cargo between Complex III and Complex IV using a prosthetic group containing iron. What does it carry?","o":["Protons alone, which is why its movement contributes directly to the electrochemical gradient","Both protons and electrons, cycling between ferrous and ferric states as it loads and unloads","Electrons only","Hydride ions, in the same way that NAD+ accepts one proton together with two electrons"],"a":2,"f":"Iron changes between ferrous and ferric; it does not carry hydrogens. That is why protons are released at these junctions."},{"n":"ATP_Synthase_Mechanism","q":"How does proton flow through ATP synthase lead to ATP formation?","o":["Protons are chemically incorporated into the terminal phosphate group of ATP as it is formed","Protons acidify the matrix, which shifts the equilibrium of the ADP phosphorylation reaction towards ATP","Protons bind the beta subunits directly, lowering their affinity for ATP so that the product is released","Protons entering the F0 channel rotate the gamma subunit, driving conformational cycling of three beta subunits"],"a":3,"f":"Each beta subunit cycles through binding ADP and Pi, reacting them, then releasing ATP. Three protons per ATP."}],"gluconeo":[{"n":"Three_Bypassed_Steps","q":"Gluconeogenesis is essentially a reversal of glycolysis except that three steps must be bypassed. Which three?","o":["Hexokinase, phosphofructokinase-1 and pyruvate kinase","Glucose 6-phosphatase, fructose 1,6-bisphosphatase and phosphoenolpyruvate carboxykinase","Phosphoglucose isomerase, aldolase and triose phosphate isomerase, which are all strongly exergonic","Glyceraldehyde 3-phosphate dehydrogenase, phosphoglycerate kinase and enolase, the energy-recouping steps"],"a":0,"f":"The glucose trapping step, the classic rate-limiting step, and the final energy-releasing step. The bypass enzymes are the other list."},{"n":"Glycerol_Entry_Point","q":"Glycerol released by lipolysis is used for gluconeogenesis in the liver. Where does its carbon enter the pathway?","o":["As pyruvate, at the bottom of the pathway, in the same way that lactate does","As oxaloacetate, after carboxylation by the mitochondrial enzyme pyruvate carboxylase","As dihydroxyacetone phosphate","As glucose 6-phosphate, after direct phosphorylation by hepatic glucokinase in the endoplasmic reticulum"],"a":2,"f":"Glycerol kinase then oxidation gives DHAP, which is already a triose phosphate. Lactate is the one that enters as pyruvate."},{"n":"Acetyl_CoA_Cannot_Make_Glucose","q":"Why can fatty acids not be converted into glucose, even though they are the body's largest energy store?","o":["Because the carnitine shuttle operates in one direction only, so acetyl units cannot leave the matrix","Because fatty acid carbons are too reduced to be incorporated into a carbohydrate without an external oxidant","Because the pyruvate dehydrogenase reaction is irreversible, so acetyl-CoA cannot become a gluconeogenic precursor","Because beta-oxidation consumes more ATP than gluconeogenesis from the resulting acetyl-CoA could ever yield"],"a":2,"f":"One irreversible arrow. It is also why an amino acid that can only become acetyl-CoA is ketogenic, not glucogenic."},{"n":"Pyruvate_Carboxylase_Signal","q":"Pyruvate carboxylase is allosterically stimulated by acetyl-CoA. Why is that an appropriate signal?","o":["Acetyl-CoA accumulates during beta-oxidation, which is exactly when glucose must be made and spared","Acetyl-CoA is the substrate of citrate synthase, so its rise indicates that oxaloacetate is in excess","Acetyl-CoA levels track the cytosolic energy charge, so the enzyme is activated whenever ATP is plentiful","Acetyl-CoA is required as a cofactor for the carboxylation, so the enzyme cannot function in its absence"],"a":0,"f":"The same signal switches PDH off and pyruvate carboxylase on. Stop burning glucose, start making it."},{"n":"Complete_Pathway_Location","q":"Which statement about the tissue distribution of gluconeogenic enzymes is correct?","o":["All the gluconeogenic enzymes are confined to the liver, which is why no other tissue can make glucose","Pyruvate carboxylase and PEPCK occur in tissues other than the liver, but the complete pathway exists only in the liver","Muscle has the complete pathway but lacks the transporters needed to export the glucose it produces","The kidney and the liver share the complete pathway, while muscle lacks only phosphoenolpyruvate carboxykinase"],"a":1,"f":"PC and PEPCK are more widely distributed; it is G6Pase and F1,6BPase that are liver-restricted."}],"ketone":[{"n":"Ketone_Body_Brain_Advantage","q":"Ketone bodies allow fat-derived energy to reach the brain, which cannot use fatty acids. What property makes this possible?","o":["They are transported bound to albumin at much higher capacity than free fatty acids are","They are water-soluble, so unlike fatty acids they are able to cross the blood-brain barrier","They are oxidised in the cytosol, so the brain's low mitochondrial content is not a limitation","They can be converted into glucose by neurons, which satisfies the brain's obligatory glucose requirement"],"a":1,"f":"Fatty acids do not cross the blood-brain barrier; the liver's water-soluble parcels of acetyl-CoA do."},{"n":"Ketone_Body_Fate_In_Tissue","q":"What happens to acetoacetate once it has been taken up by a tissue such as brain or muscle?","o":["It is carboxylated to form oxaloacetate, replenishing the Krebs cycle intermediates of the recipient tissue","It is converted to glucose by a shortened gluconeogenic pathway that bypasses pyruvate carboxylase","It is split within the mitochondria into acetyl-CoA, which is an instant substrate for the Krebs cycle","It is reduced to beta-hydroxybutyrate and then exported again, having delivered its reducing equivalents"],"a":2,"f":"And that acetyl-CoA also inhibits PDH via PDH kinase, so ketone bodies spare glucose in the recipient too."},{"n":"Ketogenesis_Trigger_In_Liver","q":"Which combination of conditions in the liver drives maximal ketone body production?","o":["A high rate of beta-oxidation together with removal of Krebs cycle intermediates for gluconeogenesis","A high rate of glycolysis together with inhibition of pyruvate dehydrogenase by acetyl-CoA","A high energy charge together with allosteric activation of acetyl-CoA carboxylase by cytosolic citrate","A high rate of lipogenesis together with export of acetyl-CoA from the matrix on the citrate transporter"],"a":0,"f":"Acetyl-CoA pouring in while oxaloacetate is being stolen. The Krebs cycle cannot take it, so it goes to ketone bodies."},{"n":"Ketone_Body_Protein_Sparing","q":"By about day five of starvation, what is the main benefit of ketone body production?","o":["They supply the obligatory glucose requirement of red blood cells and parts of the kidney","They inhibit hormone-sensitive lipase, which slows the depletion of the triglyceride store","They are excreted in the urine, which removes excess acid produced by fatty acid oxidation","They cut the brain's glucose requirement to about 30 g per day, which reduces the rate of proteolysis"],"a":3,"f":"Down from 120 g/day. Since protein breakdown is roughly (glucose needed - 30) x 2, that drop is what spares muscle."},{"n":"Ketone_Body_Inefficiency","q":"Ketone body metabolism is described as inefficient even though their oxidation itself is not. Where do the losses occur?","o":["During synthesis, because forming HMG-CoA consumes ATP that cannot be recovered on oxidation","During transport, because the carnitine shuttle must operate in both the liver and the recipient tissue","Ketone bodies are lost in the urine, and acetoacetate spontaneously decarboxylates to acetone","During uptake, because tissues lacking monocarboxylate transporters cannot extract them from the blood"],"a":2,"f":"Both routes lose the carbon for good. The acetone is also what produces the sweet breath."},{"n":"Diabetic_Ketosis_Versus_Starvation","q":"Ketone body production is protective in starvation but dangerous in untreated type 1 diabetes. What accounts for the difference?","o":["In diabetes the ketone bodies produced are chemically different and cannot be oxidised by extrahepatic tissues","In diabetes there is no insulin to restrain lipolysis, so production is unopposed and contributes to a fatal acidosis","In diabetes the brain cannot take up ketone bodies because hyperglycaemia saturates the relevant transporters","In diabetes the liver lacks oxaloacetate entirely, so acetoacetate accumulates instead of being exported normally"],"a":1,"f":"Starvation in the face of plenty. With ketone bodies, lactate and fatty acids all rising, pH falls fatally."}],"lipogen":[{"n":"Citrate_Shuttle_Purpose","q":"Lipogenesis is wholly cytosolic but its substrate acetyl-CoA is made in the matrix. How is the acetyl group exported?","o":["As acetyl-carnitine, using the same carnitine acyl-transferases that import fatty acyl groups","As free acetate, which diffuses across the inner membrane and is re-activated by acetyl-CoA synthetase","As citrate, which is cleaved in the cytosol by ATP-citrate lyase back to acetyl-CoA and oxaloacetate","As malate, which is decarboxylated by the malic enzyme to release the acetyl unit in the cytosol"],"a":2,"f":"Citrate crosses easily, so acetyl-CoA travels as citrate. Citrate synthase forward, ATP-citrate lyase in reverse."},{"n":"Cytosolic_Citrate_Reciprocal_Effects","q":"Cytosolic citrate is described as a reciprocal control signal. Which set of effects does it produce?","o":["Glycolysis off and beta-oxidation off; fatty acid synthesis on and gluconeogenesis on","Glycolysis on and beta-oxidation on; fatty acid synthesis off and gluconeogenesis off","Glycolysis off and gluconeogenesis off; fatty acid synthesis on and beta-oxidation on","Glycolysis on and fatty acid synthesis on; beta-oxidation off and gluconeogenesis off"],"a":0,"f":"One metabolite, four pathways, all pointing the same way. It inhibits PFK and, via malonyl-CoA, blocks CAT-1."},{"n":"NADPH_Source_For_Lipogenesis","q":"Fatty acid synthesis requires two NADPH per two-carbon addition. What is the main source of that NADPH, and how is supply matched to demand?","o":["The malate-aspartate shuttle, which is driven by the cytosolic to mitochondrial NADH gradient","The pentose phosphate pathway, whose regulatory enzyme G6PDH is stimulated by demand for NADP+","Glyceraldehyde 3-phosphate dehydrogenase, which can use NADP+ when cytosolic NAD+ is limiting","Isocitrate dehydrogenase in the matrix, whose product is exported on the tricarboxylate transporter"],"a":1,"f":"Demand-led: using NADPH makes NADP+, which drives G6PDH, which makes more NADPH."},{"n":"ACC_Carboxylation_Not_Fixation","q":"Acetyl-CoA carboxylase adds carbon dioxide from bicarbonate to acetyl-CoA, forming malonyl-CoA. Why is this not carbon fixation?","o":["Because the carbon dioxide used comes from bicarbonate rather than from dissolved carbon dioxide gas","Because the carboxyl group is transferred to coenzyme A rather than being incorporated into the acyl chain","Because the very same carbon dioxide is released again during each round of fatty acid chain elongation","Because the reaction consumes ATP, so the net carbon balance of the pathway is unfavourable overall"],"a":2,"f":"The CO2 is a leaving group that activates the methyl carbon. It comes straight back off at the condensation step."},{"n":"Insulin_Stimulates_PFK_Indirectly","q":"Insulin is not a direct activator of phosphofructokinase-1, yet it increases glycolytic flux. By what route?","o":["By stimulating the pentose phosphate pathway, which returns six- and three-carbon sugars into glycolysis","By inducing transcription of the phosphofructokinase-1 gene, raising total enzyme within a few hours","By stimulating glycogen synthase and the lipogenic enzymes, which consume ATP and lower the energy charge","By increasing glucose uptake on GLUT-4, which raises intracellular glucose 6-phosphate and saturates the enzyme"],"a":2,"f":"Storage is anabolic and costs ATP, which raises ADP and AMP, which activates PFK. Storing fuel also causes fuel to be burnt."}],"lipo":[{"n":"Cholesterol_Only_Disposal_Route","q":"What is the only route by which cholesterol is metabolised and disposed of from the body?","o":["Oxidation to acetyl-CoA in hepatocytes, followed by complete oxidation in the Krebs cycle","Conversion into steroid hormones, which are subsequently conjugated and excreted by the kidney","Conversion into bile salts by the liver","Uptake into macrophages as oxidised LDL, which are then cleared through the lymphatic system"],"a":2,"f":"There is no catabolic pathway for the sterol ring. Net bile salt loss is only about 0.5 g/day, which is why diet changes little."},{"n":"Chylomicron_Lymphatic_Route","q":"Which feature distinguishes chylomicrons from the other lipoproteins?","o":["They are assembled by intestinal cells and enter the lymphatic system rather than the portal blood","They are the only lipoproteins that are acted upon by lipoprotein lipase on the capillary endothelium","They carry cholesterol in its unesterified form, which is what gives them their very low density","They are taken up by the LDL receptor, which is how dietary cholesterol reaches peripheral tissues"],"a":0,"f":"The lymphatic route means dietary fat bypasses first-pass liver, though remnants deliver much of it there anyway."},{"n":"Statin_Mechanism_Chain","q":"Statins inhibit HMG-CoA reductase. How does that lower circulating LDL?","o":["By blocking the esterification of cholesterol, so it can no longer be packed into the lipoprotein core","By reducing hepatic cholesterol, so cells express more LDL receptors and clear more LDL from the blood","By increasing the conversion of cholesterol to bile salts, which are then lost in the faeces","By inhibiting cholesterol ester transfer protein, so HDL retains cholesterol on its return to the liver"],"a":1,"f":"Cells advertise their need for cholesterol by putting out LDL receptors. The receptor response is the therapeutic effect."},{"n":"Foam_Cell_Formation","q":"Why does oxidised LDL, rather than native LDL, drive the formation of foam cells?","o":["Because oxidation exposes apoproteins that allow the particle to cross the endothelium into the vessel wall","Because oxidised particles are taken up by macrophages without the controls that limit LDL receptor uptake","Because oxidation converts the cholesterol esters into free cholesterol, which cannot leave the macrophage","Because macrophages lack the enzymes needed to convert oxidised cholesterol into bile salts for disposal"],"a":1,"f":"Uncontrolled uptake, so the macrophage cannot stop. The resulting inflammation is what encourages plaque."},{"n":"CETP_Consequence","q":"Cholesterol ester transfer protein exchanges cholesterol ester for triglyceride between HDL and an outgoing VLDL. What is the consequence?","o":["HDL returns to the liver with more cholesterol, which accelerates its conversion into bile salts","VLDL is depleted of cholesterol, which makes it a more efficient carrier of triglyceride to the tissues","HDL returns with more fat and less cholesterol, and the cholesterol stays in circulation on VLDL","HDL particles are converted into LDL, which is then cleared from the blood by hepatic LDL receptors"],"a":2,"f":"It partly undoes reverse cholesterol transport, and leaves VLDL cholesterol-enriched."}],"nitrogen":[{"n":"Three_Amine_Acceptors","q":"Amine groups from amino acid breakdown are channelled onto just three carrier amino acids. What do the three acceptor keto acids have in common?","o":["They are all four-carbon dicarboxylic acids that can be transported across the inner mitochondrial membrane","They are all produced exclusively in the liver, which is why amine disposal is confined to that organ","They are all intermediates of glycolysis and the Krebs cycle, so they are always available in the cell","They are all substrates of glutamate dehydrogenase, which releases ammonia for incorporation into urea"],"a":2,"f":"Pyruvate to alanine, 2-oxoglutarate to glutamate, oxaloacetate to aspartate. The acceptors are borrowed from the core pathways."},{"n":"Urea_Two_Nitrogens","q":"Urea carries two nitrogen atoms. What are their immediate sources?","o":["Both come from glutamate, which is deaminated twice by glutamate dehydrogenase in the hepatic mitochondrion","One from free ammonia, which is fixed as carbamoyl phosphate, and the other brought in by aspartate","One from glutamine via hepatic glutaminase, and one from ornithine as the carrier is regenerated","Both come from the branched chain amino acids, which are the main nitrogen donors released by muscle"],"a":1,"f":"The ammonia-fixing reaction supplies one; aspartate brings the other in at the argininosuccinate step."},{"n":"Ketogenic_Versus_Glucogenic","q":"What determines whether an amino acid carbon skeleton can be used to make glucose?","o":["Whether the amino acid is essential, since only non-essential amino acids can be diverted to gluconeogenesis","Whether its transamination occurs in muscle or in liver, since only hepatic transamination yields glucose","Whether the skeleton can be converted to pyruvate or a Krebs cycle intermediate rather than only to acetyl-CoA","Whether the skeleton enters the Krebs cycle above or below the two oxidative decarboxylation steps"],"a":2,"f":"Only acetyl-CoA means ketogenic, because the PDH step cannot be reversed."},{"n":"BCAA_Hepatic_Handling","q":"The amino acid mixture in the portal vein contains about 20% branched chain amino acids, but the hepatic vein contains about 70%. What does this show?","o":["The liver has preferentially retained the non-branched chain amino acids and passed the rest on","The liver has synthesised additional branched chain amino acids from Krebs cycle intermediates","The branched chain amino acids are absorbed more slowly, so they arrive at the liver after the others","The liver has converted the branched chain amino acids into glucose and released them as alanine"],"a":0,"f":"Muscle then takes the BCAA out and burns them, which is why they are missing again from muscle venous blood."},{"n":"Glutamine_Courier_Logic","q":"Most tissues convert glutamate and ammonia into glutamine using ATP, and the liver then reverses the reaction. Why is this apparent futility useful?","o":["It generates the ATP needed to drive the urea cycle once the amino groups reach the liver","It allows nitrogen to be carried in the blood without any free ammonia, which would be toxic","It keeps glutamate concentrations low so that transamination can continue in the peripheral tissue","It supplies the liver with a substrate for gluconeogenesis as well as a source of amino groups"],"a":1,"f":"Ammonia never travels free. It goes as glutamine, or as the amino group on alanine."}],"reg":[{"n":"Rate_Limiting_Step_Properties","q":"Which set of properties characterises a rate-limiting, flux-generating step?","o":["Reversible, at equilibrium, and operating well below saturation so that flux tracks substrate supply","Irreversible, not at equilibrium, and saturated with substrate so that it is working at Vmax","Irreversible, at equilibrium, and regulated solely by the rate of transcription of its gene","Reversible, not at equilibrium, and saturated with substrate so that the reverse reaction is negligible"],"a":1,"f":"A committed step working flat out. Because it is irreversible, the opposing pathway needs a different enzyme to go back."},{"n":"PDH_Phosphorylation_State","q":"Pyruvate dehydrogenase is controlled by reversible phosphorylation. Which statement is correct?","o":["It is active when phosphorylated, and insulin activates the kinase that phosphorylates it","It is active when dephosphorylated, and acetyl-CoA stimulates the kinase that switches it off","It is active when dephosphorylated, and the total amount of the enzyme rises when glucose is plentiful","It is active when phosphorylated, and the balance is set by the supply of NAD+ rather than by a kinase"],"a":1,"f":"Totally off phosphorylated, totally on dephosphorylated. Total enzyme does not change, only the phosphorylated fraction."},{"n":"Three_Ways_To_Regulate","q":"Which of the following is one of the three general ways of regulating a rate-limiting enzyme?","o":["Changing the rate at which the enzyme is made or destroyed, by transcription or by degradation","Changing the equilibrium constant of the reaction by altering the concentration of the product","Changing the compartment in which the enzyme resides so that it meets a different substrate pool","Changing the cofactor the enzyme uses, so that a nicotinamide-linked step becomes flavin-linked"],"a":0,"f":"The three are: change intrinsic activity, switch it on or off covalently, and make or destroy it."},{"n":"PFK_Substrate_Inhibition","q":"Phosphofructokinase-1 is inhibited by high concentrations of ATP, which is also one of its substrates. How is this inhibition overcome when the cell needs energy?","o":["Citrate binds an allosteric site and displaces ATP from the inhibitory site on the enzyme","Glucagon raises cAMP, which activates protein kinase A and phosphorylates the enzyme into an active form","AMP binds a site away from the active site and changes the way the enzyme responds to ATP","The accumulating substrate fructose 6-phosphate raises the enzyme's affinity for ATP at the catalytic site"],"a":2,"f":"The point of inhibition by ATP is that it makes the enzyme a sensor of energy charge. AMP is the signal that releases it."},{"n":"Futile_Cycle_Concept","q":"What is meant by a futile cycle in the context of opposing metabolic pathways?","o":["A pathway that produces an intermediate which inhibits the very enzyme that formed it","A pathway whose product is lost from the body before its energy content can be recovered","Both members of an opposing pair of pathways running at the same time, which wastes ATP","A cycle whose carrier molecule is regenerated so that no net substrate is consumed per turn"],"a":2,"f":"Glycolysis against gluconeogenesis, beta-oxidation against fatty acid synthesis. Stimulating one must inhibit the other."}],"states":[{"n":"Glucose_Fatty_Acid_Cycle","q":"During fasting, muscle continues to take up glucose on GLUT-1 but converts it only to lactate. Which mechanism produces this result?","o":["Glucagon acts on muscle to phosphorylate and inhibit pyruvate kinase, so pyruvate cannot be formed from PEP","Acetyl-CoA from beta-oxidation stimulates PDH kinase, switching PDH off, so pyruvate can only go to lactate","Low insulin reduces the mitochondrial pyruvate transporter, so pyruvate cannot reach the matrix at all","Lactate dehydrogenase is induced by hypoinsulinaemia, outcompeting PDH for the available pyruvate"],"a":1,"f":"The glucose-fatty acid cycle. The lactate then goes to the liver and comes back as glucose, which is the Cori cycle."},{"n":"Why_Fat_Cannot_Fuel_Sprint","q":"Why can fatty acids not fuel a maximal sprint in Type IIb muscle fibres?","o":["Because hormone-sensitive lipase takes several minutes to be phosphorylated and activated by protein kinase A","Because malonyl-CoA accumulates during rapid glycolysis and closes the carnitine gate into the matrix","Because Type IIb fibres have a poor blood supply and too few mitochondria to oxidise fatty acids at all","Because fatty acids cannot cross the sarcolemma without the fatty acid binding protein induced by training"],"a":2,"f":"Fat oxidation needs oxygen and mitochondria, and a sprinting white fibre has little of either. Hence CP, then glycogen."},{"n":"Starvation_Protein_Arithmetic","q":"In late starvation the brain needs about 120 g glucose per day while glycerol supplies only about 30 g. Given that roughly 2 g of protein is needed to make 1 g of glucose, what does the shortfall imply?","o":["About 45 g of protein must be broken down per day, since half the glucose comes from recycled lactate","About 90 g of protein must be broken down per day, matching the glucose shortfall gram for gram","No protein breakdown is needed, because lactate recycling through the Cori cycle covers the shortfall","About 180 g of protein must be broken down each day, from a total body pool of only around 6 kg"],"a":3,"f":"Unsustainable, which is exactly the problem ketone bodies solve by cutting the brain's requirement to 30 g/day."},{"n":"T1DM_Hyperglycaemia_Mechanism","q":"In untreated type 1 diabetes, why does blood glucose rise even though the tissues are short of usable fuel?","o":["Because GLUT-1 and GLUT-2 transport is lost along with GLUT-4, so no tissue can take up glucose at all","Because the lipogenic and glycogenic enzymes are not stimulated, so G6P rises, inhibits hexokinase and glucose leaves again","Because hepatic glycogenolysis continues unchecked until the liver glycogen store is completely exhausted","Because hyperosmolar blood draws water out of the tissues, which concentrates the glucose remaining in plasma"],"a":1,"f":"Plus hepatic glucose production carries on, fed by glycerol, amino acids and lactate. Starvation in the face of plenty."},{"n":"Moderate_Exercise_Fuel_Mix","q":"As exercise intensity rises from walking to jogging, glucose oxidation increases. What permits this?","o":["Glucagon falls and insulin rises, which brings GLUT-4 to the muscle surface and raises glucose uptake","Muscle glycogen phosphorylase is activated by calcium, which makes glucose 6-phosphate available locally","The enzymes of fatty acid oxidation reach their maximum capacity, so the inhibition on glucose oxidation is removed","The fall in cellular pH caused by lactate accumulation inhibits the carnitine acyl-transferases"],"a":2,"f":"Fat oxidation saturates, so acetyl-CoA stops accumulating, PDH comes back on, and you burn a mixture."},{"n":"Acetone_Breath_Origin","q":"What causes the sweet, organic smell on the breath in untreated type 1 diabetes?","o":["Spontaneous decarboxylation of acetoacetate into acetone, which is volatile and is therefore exhaled","Exhalation of unoxidised fatty acids released by the uncontrolled lipolysis of adipose triglyceride","Accumulation of lactate, which is partly converted to a volatile ester in the pulmonary circulation","Excretion of glucose across the respiratory epithelium once blood glucose exceeds the renal threshold"],"a":0,"f":"No enzyme involved. It is also one of the two ways ketone body carbon is simply lost, the other being urine."}]}}</script>
<script>/* Human Metabolic Pathways - standalone site.
   One SVG per map, hand-placed so that position carries meaning: vertical
   bands are compartments, and a molecule sits where its chemistry sits. */
(function () {
"use strict";

var D = JSON.parse(document.getElementById("data").textContent);
var MOL = D.mol, ENZ = D.enz, MAPS = D.maps, TOPICS = D.topics,
    PW = D.pw, STATES = D.states, QUIZ = D.quiz;

var PWBY = {}, MAPBY = {}, TOPBY = {}, STBY = {};
PW.forEach(function (p) { PWBY[p.id] = p; });
MAPS.forEach(function (m) { MAPBY[m.id] = m; });
TOPICS.forEach(function (t) { TOPBY[t.id] = t; });
STATES.forEach(function (s) { STBY[s.id] = s; });

/* ------------------------------------------------------------- utilities */
function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
/* the content uses **bold** for the load-bearing part of every line */
function fmt(s) {
  return esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
                .replace(/\*([^*\n]+)\*/g, "<i>$1</i>");
}
function h(tag, cls, html) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function isDark() {
  var t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
/* pathway hues are picked for a light background; lift them for dark */
function hexLift(hex, amt) {
  var m = /^#(\w\w)(\w\w)(\w\w)$/.exec(hex);
  if (!m) return hex;
  var c = [1, 2, 3].map(function (i) {
    var v = parseInt(m[i], 16);
    return Math.round(v + (255 - v) * amt);
  });
  return "rgb(" + c.join(",") + ")";
}
function pwColor(id) {
  var p = PWBY[id];
  if (!p) return null;
  return isDark() ? hexLift(p.c, 0.42) : p.c;
}

/* text measurement, so node boxes fit their labels */
var mctx = document.createElement("canvas").getContext("2d");
function tw(text, font) { mctx.font = font; return mctx.measureText(text).width; }
var F_MAIN = "550 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif";
var F_BIG = "700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif";
var F_SUB = "10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif";

/* ------------------------------------------------------- global indexing */
/* Every placement on every map points at one shared molecule or enzyme page,
   so connections can be gathered across all five maps at once. */
var NODEOF = {};          /* mapId -> nodeId -> node */
var PLACES = {};          /* molecule id -> [{map,node}] */
var CONN = {};            /* molecule id -> [{other, enz, dir, pw, note}] */
var ENZPLACE = {};        /* enzyme id -> [{map,node}] */
var ENZEDGE = {};         /* enzyme id -> [{map, a, b}] */

MAPS.forEach(function (m) {
  NODEOF[m.id] = {};
  m.nodes.forEach(function (n) {
    NODEOF[m.id][n.id] = n;
    if (n.m) (PLACES[n.m] = PLACES[n.m] || []).push({ map: m.id, node: n.id });
    if (n.e) (ENZPLACE[n.e] = ENZPLACE[n.e] || []).push({ map: m.id, node: n.id });
  });
});
MAPS.forEach(function (m) {
  m.edges.forEach(function (e) {
    var A = NODEOF[m.id][e.a], B = NODEOF[m.id][e.b];
    if (!A || !B) return;
    var both = e.d === "both";
    [[A, B, "out"], [B, A, "in"]].forEach(function (pair, i) {
      var src = pair[0], dst = pair[1], dir = both ? "both" : (i === 0 ? "out" : "in");
      var sm = src.m, dm = dst.m;
      if (!sm || !dm || sm === dm) return;
      var rec = { other: dm, enz: e.e || null, lbl: e.lbl || null, dir: dir,
                  pw: e.pw || null, note: e.n || null, map: m.id };
      var list = CONN[sm] = CONN[sm] || [];
      var key = dm + "|" + (e.e || e.lbl || "") + "|" + dir;
      if (!list.some(function (r) { return r.other + "|" + (r.enz || r.lbl || "") + "|" + r.dir === key; }))
        list.push(rec);
    });
    if (e.e) (ENZEDGE[e.e] = ENZEDGE[e.e] || []).push({ map: m.id, a: A.m || A.e, b: B.m || B.e });
    if (e.e2) (ENZEDGE[e.e2] = ENZEDGE[e.e2] || []).push({ map: m.id, a: B.m || B.e, b: A.m || A.e });
  });
});
/* Where to point on the map for a molecule. Some molecules are placed twice on
   the same chart because the compartment matters (HMG-CoA, acetyl-CoA, citrate,
   pyruvate). When that happens, prefer the copy that actually connects to what
   you were just looking at, so arriving from cholesterol lands on the cytosolic
   HMG-CoA rather than the mitochondrial one. */
function placementOn(mapId, molId, nearNode) {
  var list = (PLACES[molId] || []).filter(function (p) { return p.map === mapId; });
  if (!list.length) return null;
  if (list.length > 1 && nearNode) {
    var m = MAPBY[mapId], i, j;
    for (i = 0; i < list.length; i++) {
      for (j = 0; j < m.edges.length; j++) {
        var e = m.edges[j];
        if ((e.a === list[i].node && e.b === nearNode) ||
            (e.b === list[i].node && e.a === nearNode)) return list[i];
      }
    }
  }
  return list[0];
}
function topicsOf(kind, id) {
  return TOPICS.filter(function (t) { return (kind === "m" ? t.mol : t.enz).indexOf(id) >= 0; });
}

/* ------------------------------------------------------------ node layout */
function layoutNode(n) {
  var label = n.lbl || (n.m ? MOL[n.m].n : n.e ? ENZ[n.e].n : "");
  var sub = n.badge || (n.m && MOL[n.m].f && !n.lbl ? null : null);
  var font = n.hub === 2 ? F_BIG : F_MAIN;
  var lines = wrapText(label, font, n.w ? n.w - 20 : (n.t === "note" ? 260 : 190));
  var wNeeded = 0;
  lines.forEach(function (L) { wNeeded = Math.max(wNeeded, tw(L, font)); });
  if (sub) wNeeded = Math.max(wNeeded, tw(sub, F_SUB));
  var w = n.w || Math.max(58, Math.ceil(wNeeded) + 15);
  var lh = n.hub === 2 ? 18 : 16;
  var hh = lines.length * lh + (sub ? 12 : 0) + 11;
  if (n.t === "note") hh = lines.length * 14 + 18;
  return { w: w, h: Math.max(27, hh), lines: lines, sub: sub, font: font, lh: lh,
           x: n.x - w / 2, y: n.y - Math.max(27, hh) / 2 };
}
function wrapText(text, font, maxw) {
  var words = String(text).split(" "), out = [], cur = "";
  for (var i = 0; i < words.length; i++) {
    var t = cur ? cur + " " + words[i] : words[i];
    if (tw(t, font) > maxw && cur) { out.push(cur); cur = words[i]; }
    else cur = t;
  }
  if (cur) out.push(cur);
  return out.length ? out : [""];
}
var BOX = {};  /* mapId -> nodeId -> box */
MAPS.forEach(function (m) {
  BOX[m.id] = {};
  m.nodes.forEach(function (n) { BOX[m.id][n.id] = layoutNode(n); });
});

/* ----------------------------------------------------------- edge routing */
/* Clip the polyline to the two node rectangles so arrows touch the boxes,
   not their centres. */
function clipToRect(box, px, py, qx, qy, gap) {
  var cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  var dx = qx - cx, dy = qy - cy;
  if (!dx && !dy) return [cx, cy];
  var hw = box.w / 2 + gap, hh = box.h / 2 + gap;
  var tx = dx ? hw / Math.abs(dx) : Infinity, ty = dy ? hh / Math.abs(dy) : Infinity;
  var t = Math.min(tx, ty);
  return [cx + dx * t, cy + dy * t];
}
function edgePoints(mapId, e) {
  var A = BOX[mapId][e.a], B = BOX[mapId][e.b];
  var ways = (e.w || []).slice();
  var ac = [A.x + A.w / 2, A.y + A.h / 2], bc = [B.x + B.w / 2, B.y + B.h / 2];
  var first = ways.length ? ways[0] : bc;
  var last = ways.length ? ways[ways.length - 1] : ac;
  var p0 = clipToRect(A, ac[0], ac[1], first[0], first[1], 3);
  var p1 = clipToRect(B, bc[0], bc[1], last[0], last[1], 3);
  return [p0].concat(ways, [p1]);
}
function pathOf(pts) {
  return "M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L");
}
function arrowHead(pts, atEnd) {
  var i = atEnd ? pts.length - 1 : 0, j = atEnd ? pts.length - 2 : 1;
  var tip = pts[i], from = pts[j];
  var dx = tip[0] - from[0], dy = tip[1] - from[1], L = Math.hypot(dx, dy) || 1;
  dx /= L; dy /= L;
  var s = 10, w = 4.8;
  var bx = tip[0] - dx * s, by = tip[1] - dy * s;
  return [[tip[0], tip[1]], [bx - dy * w, by + dx * w], [bx + dy * w, by - dx * w]]
    .map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
}
var F_ELAB = "italic 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif";

/* Point at fraction t along a polyline, with the local unit normal. */
function alongPolyline(pts, t) {
  var segs = [], total = 0, i;
  for (i = 1; i < pts.length; i++) {
    var L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    segs.push(L); total += L;
  }
  var want = total * t, acc = 0;
  for (var k = 0; k < segs.length; k++) {
    if (acc + segs[k] >= want || k === segs.length - 1) {
      var f = segs[k] ? (want - acc) / segs[k] : 0;
      f = Math.max(0, Math.min(1, f));
      var dx = pts[k + 1][0] - pts[k][0], dy = pts[k + 1][1] - pts[k][1];
      var L2 = Math.hypot(dx, dy) || 1;
      return { x: pts[k][0] + dx * f, y: pts[k][1] + dy * f,
               nx: -dy / L2, ny: dx / L2 };
    }
    acc += segs[k];
  }
  return { x: pts[0][0], y: pts[0][1], nx: 0, ny: 1 };
}

function rectHit(a, b, pad) {
  pad = pad || 0;
  return !(a.x + a.w + pad <= b.x || b.x + b.w + pad <= a.x ||
           a.y + a.h + pad <= b.y || b.y + b.h + pad <= a.y);
}

/* An enzyme name is useless if it is sitting under a molecule box or off the
   edge of the canvas, so slide it along its own edge until it is clear of
   every node and every label already placed. */
function placeLabel(pts, w, hgt, mapId, placed, vb) {
  var boxes = BOX[mapId];
  var along = [0.5, 0.42, 0.58, 0.34, 0.66, 0.27, 0.73, 0.2, 0.8];
  var perp = [0, -1, 1, -1.9, 1.9];
  for (var pi = 0; pi < perp.length; pi++) {
    for (var ci = 0; ci < along.length; ci++) {
      var q = alongPolyline(pts, along[ci]);
      var off = perp[pi] * (hgt * 0.85 + 4);
      var x = q.x + q.nx * off, y = q.y + q.ny * off;
      x = Math.max(vb[0] + w / 2 + 6, Math.min(vb[0] + vb[2] - w / 2 - 6, x));
      y = Math.max(vb[1] + hgt / 2 + 6, Math.min(vb[1] + vb[3] - hgt / 2 - 6, y));
      var r = { x: x - w / 2, y: y - hgt / 2, w: w, h: hgt };
      var clash = false, id;
      for (id in boxes) {
        if (rectHit(r, boxes[id], 2)) { clash = true; break; }
      }
      if (!clash) {
        for (var j = 0; j < placed.length; j++) {
          if (rectHit(r, placed[j], 1)) { clash = true; break; }
        }
      }
      if (!clash) { placed.push(r); return [x, y]; }
    }
  }
  var m = alongPolyline(pts, 0.5);
  placed.push({ x: m.x - w / 2, y: m.y - hgt / 2, w: w, h: hgt });
  return [m.x, m.y];
}

function midOf(pts) {
  var total = 0, segs = [];
  for (var i = 1; i < pts.length; i++) {
    var L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    segs.push(L); total += L;
  }
  var want = total / 2, acc = 0;
  for (var k = 0; k < segs.length; k++) {
    if (acc + segs[k] >= want) {
      var t = (want - acc) / (segs[k] || 1);
      return [pts[k][0] + (pts[k + 1][0] - pts[k][0]) * t,
              pts[k][1] + (pts[k + 1][1] - pts[k][1]) * t];
    }
    acc += segs[k];
  }
  return pts[Math.floor(pts.length / 2)];
}

/* ========================================================== map rendering */
var V = { map: null, sel: null, pwOn: {}, state: null, k: 1, tx: 0, ty: 0, dragEnd: 0 };

function svgEl(name, attrs) {
  var n = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (var k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  return n;
}

function renderMap(mapId) {
  var m = MAPBY[mapId];
  V.map = mapId;
  var svg = el("canvas");
  svg.innerHTML = "";
  svg.setAttribute("viewBox", m.vb.join(" "));
  var vp = svgEl("g", { id: "vp" });
  svg.appendChild(vp);

  var gBands = svgEl("g", {}), gEdges = svgEl("g", {}),
      gLabels = svgEl("g", {}), gNodes = svgEl("g", {});
  vp.appendChild(gBands); vp.appendChild(gEdges);
  vp.appendChild(gLabels); vp.appendChild(gNodes);

  (m.bands || []).forEach(function (b) {
    gBands.appendChild(svgEl("rect", {
      x: 8, y: b.y, width: (m.bandw || m.vb[2]) - 16, height: b.h, rx: 5,
      "class": "band", fill: "var(--band-" + b.c + ")"
    }));
    var t = svgEl("text", { x: 24, y: b.y + 22, "class": "bandlabel" });
    t.textContent = b.n; gBands.appendChild(t);
  });
  (m.boxes || []).forEach(function (b) {
    gBands.appendChild(svgEl("rect", {
      x: b.x, y: b.y, width: b.w, height: b.h, rx: 4, "class": "boxrect"
    }));
    var t = svgEl("text", { x: b.x + 14, y: b.y + 20, "class": "bandlabel" });
    t.textContent = b.n; gBands.appendChild(t);
  });

  var placed = [];
  m.edges.forEach(function (e, i) {
    var pts = edgePoints(mapId, e);
    var col = pwColor(e.pw) || "var(--rule-2)";
    var g = svgEl("g", { "data-edge": i });
    var p = svgEl("path", {
      d: pathOf(pts), "class": "edge" + (e.dash ? " dash" : ""),
      stroke: col, "stroke-opacity": 0.88, "stroke-linejoin": "round", "stroke-linecap": "round",
      "vector-effect": "non-scaling-stroke"
    });
    g.appendChild(p);
    g.appendChild(svgEl("polygon", { points: arrowHead(pts, true), fill: col, "fill-opacity": 0.85 }));
    if (e.d === "both")
      g.appendChild(svgEl("polygon", { points: arrowHead(pts, false), fill: col, "fill-opacity": 0.85 }));
    var hit = svgEl("path", { d: pathOf(pts), "class": "ehit" });
    g.appendChild(hit);
    gEdges.appendChild(g);

    var name = e.e ? ENZ[e.e].n : e.lbl;
    if (name) {
      var lg = svgEl("g", { "data-elab": i });
      var lines = wrapText(name, F_ELAB, 170);
      var lw = 0;
      lines.forEach(function (L) { lw = Math.max(lw, tw(L, F_ELAB)); });
      var lh = lines.length * 12;
      var at = placeLabel(pts, lw + 8, lh + 4, mapId, placed, m.vb);
      lines.forEach(function (L, k) {

          x: at[0], y: at[1] - lh / 2 + 9 + k * 12, "class": "elabel"
        });
        t.textContent = L; lg.appendChild(t);
      });
      if (e.n) {
        var nt = svgEl("text", { x: at[0], y: at[1] + lh / 2 + 11, "class": "enote" });
        nt.textContent = e.n; lg.appendChild(nt);
      }

    function hot(on) {
      g.querySelector(".edge").classList.toggle("hot", on);

      if (lab) Array.prototype.forEach.call(lab.children, function (c) { c.classList.toggle("hot", on); });
    }
    hit.addEventListener("pointerenter", function () { hot(true); });
    hit.addEventListener("pointerleave", function () { hot(false); });
