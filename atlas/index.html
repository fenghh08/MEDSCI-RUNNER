<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Human Metabolic Pathways</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230f172a%27/%3E%3Cg stroke=%27white%27 stroke-width=%272%27 fill=%27none%27%3E%3Cpath d=%27M7 10h8M15 10l5 6M20 16h5M20 16l-4 6%27/%3E%3C/g%3E%3Ccircle cx=%277%27 cy=%2710%27 r=%272.6%27 fill=%27white%27/%3E%3Ccircle cx=%2725%27 cy=%2716%27 r=%272.6%27 fill=%27white%27/%3E%3Ccircle cx=%2716%27 cy=%2722%27 r=%272.6%27 fill=%27white%27/%3E%3C/svg%3E">
<style>/* Human Metabolic Pathways - standalone site.

   Swiss/International discipline: one neutral sans, hierarchy by weight and
   space rather than by ornament, hairline rules, square corners.

   The chrome is deliberately ACHROMATIC. All 24 hues on this site belong to
   the pathways, so the interface cannot borrow one without the selected
   molecule reading as a glycolysis line. Ink is the accent instead. */

:root {
  color-scheme: light dark;

  /* cool slate paper - deliberately not the warm cream of the study site */
  --bg: #f8fafc;
  --panel: #ffffff;
  --panel-2: #f1f5f9;
  --panel-3: #e2e8f0;
  --ink: #0f172a;
  --ink-2: #475569;
  --ink-3: #5b6a7a;
  --rule: #e2e8f0;
  --rule-2: #cbd5e1;
  --accent: #0f172a;
  --accent-soft: #eef2f7;
  --on-accent: #ffffff;
  --link: #2563eb;
  --ok: #047857;
  --ok-soft: #ecfdf5;
  --bad: #b91c1c;
  --bad-soft: #fef2f2;
  --warn: #92400e;
  --warn-soft: #fffbeb;
  --extra: #6d28d9;
  --extra-soft: #f5f3ff;

  /* compartment tints: hue still carries the meaning, saturation pulled right
     down so the bands sit behind the data instead of competing with it */
  --band-blood: #fdf2f4;
  --band-cyto:  #f1f6fc;
  --band-mito:  #fdf6ee;
  --band-memb:  #f0f7f5;
  --band-ink:   #5b6a7a;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --panel-w: 440px;
  --r: 5px;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 10px 30px rgba(15,23,42,.09);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1116; --panel: #121a21; --panel-2: #1a242d; --panel-3: #243039;
    --ink: #e6edf3; --ink-2: #a3b4c2; --ink-3: #7d8e9c;
    --rule: #22303b; --rule-2: #31404c;
    --accent: #e6edf3; --accent-soft: #1e2a33; --on-accent: #0b1116;
    --link: #7dadff;
    --ok: #34d399; --ok-soft: #0e2620; --bad: #f87171; --bad-soft: #2a1718;
    --warn: #fbbf24; --warn-soft: #241c0e; --extra: #c4b5fd; --extra-soft: #1f1b2e;
    --band-blood: #1e1618; --band-cyto: #111a22; --band-mito: #1f1a14;
    --band-memb: #121e1c; --band-ink: #8b9bab;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1116; --panel: #121a21; --panel-2: #1a242d; --panel-3: #243039;
  --ink: #e6edf3; --ink-2: #a3b4c2; --ink-3: #7d8e9c;
  --rule: #22303b; --rule-2: #31404c;
  --accent: #e6edf3; --accent-soft: #1e2a33; --on-accent: #0b1116;
  --link: #7dadff;
  --ok: #34d399; --ok-soft: #0e2620; --bad: #f87171; --bad-soft: #2a1718;
  --warn: #fbbf24; --warn-soft: #241c0e; --extra: #c4b5fd; --extra-soft: #1f1b2e;
  --band-blood: #1e1618; --band-cyto: #111a22; --band-mito: #1f1a14;
  --band-memb: #121e1c; --band-ink: #8b9bab;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.55);
}
:root[data-theme="light"] {
  --bg: #f8fafc; --panel: #ffffff; --panel-2: #f1f5f9; --panel-3: #e2e8f0;
  --ink: #0f172a; --ink-2: #475569; --ink-3: #5b6a7a;
  --rule: #e2e8f0; --rule-2: #cbd5e1;
  --accent: #0f172a; --accent-soft: #eef2f7; --on-accent: #ffffff;
  --link: #2563eb;
  --ok: #047857; --ok-soft: #ecfdf5; --bad: #b91c1c; --bad-soft: #fef2f2;
  --warn: #92400e; --warn-soft: #fffbeb; --extra: #6d28d9; --extra-soft: #f5f3ff;
  --band-blood: #fdf2f4; --band-cyto: #f1f6fc; --band-mito: #fdf6ee;
  --band-memb: #f0f7f5; --band-ink: #5b6a7a;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15.5px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
a { color: var(--link); }
b, strong { font-weight: 650; color: var(--ink); }

/* ------------------------------------------------------------- app frame */
#app { display: flex; flex-direction: column; height: 100dvh; min-height: 0; }

header#top {
  display: flex; align-items: center; gap: 14px;
  padding: 0 14px; height: 54px; flex: 0 0 auto;
  background: var(--panel); border-bottom: 1px solid var(--rule);
  position: relative; z-index: 30;
}
#top .brand { display: flex; align-items: baseline; gap: 9px; cursor: pointer; }
#top .brand h1 {
  margin: 0; font: 650 17px/1 var(--sans); letter-spacing: -.3px; white-space: nowrap;
}
#top .brand span { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
#top .spacer { flex: 1; }

#searchwrap { position: relative; flex: 0 1 300px; }
#search {
  width: 100%; padding: 7px 11px 7px 30px; font: 14px var(--sans);
  background: var(--panel-2); color: var(--ink);
  border: 1px solid var(--rule); border-radius: var(--r);
}
#search:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--panel); }
#searchwrap::before {
  content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-52%);
  color: var(--ink-3); font-size: 15px; pointer-events: none;
}
#results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 60vh;
  overflow: auto; background: var(--panel); border: 1px solid var(--rule-2);
  border-radius: var(--r); box-shadow: var(--shadow); padding: 5px; display: none;
}
#results.on { display: block; }
#results button {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  padding: 7px 9px; border-radius: var(--r); cursor: pointer; color: var(--ink);
  font: 14px var(--sans);
}
#results button:hover, #results button[aria-selected="true"] { background: var(--panel-2); }
#results .k { font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
#results .sub { font-size: 12px; color: var(--ink-3); }

.btn {
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule);
  border-radius: var(--r); padding: 6px 11px; font: 13.5px/1.2 var(--sans); cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--rule-2); background: var(--panel-3); }
.btn[aria-current="true"], .btn.on {
  background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 550;
}
.btn.icon { padding: 6px 9px; font-size: 15px; line-height: 1; }

/* ------------------------------------------------------------------ main */
#main { flex: 1; min-height: 0; display: flex; }
#stage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }

/* ------------------------------------------------------------- home view */
.scroll { overflow: auto; flex: 1; min-height: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 30px 22px 90px; }

.hero h2 {
  margin: 0 0 8px; font: 650 32px/1.12 var(--sans); letter-spacing: -.9px;
}
.hero p { margin: 0 0 4px; color: var(--ink-2); max-width: 66ch; }
.hero .meta { font-size: 12.5px; color: var(--ink-3); margin-top: 12px; }

h3.sec {
  margin: 36px 0 14px; font: 650 12px/1 var(--sans);
  text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3);
  border-bottom: 1px solid var(--rule); padding-bottom: 8px;
}

.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); }

.card {
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r);
  padding: 15px 16px; cursor: pointer; text-align: left; color: inherit;
  font: inherit; display: flex; flex-direction: column; gap: 6px;
  transition: border-color .15s ease, background-color .15s ease;
}
.card:hover { border-color: var(--accent); background: var(--panel-2); }
.card h4 { margin: 0; font: 600 15.5px/1.3 var(--sans); }
.card p { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.card .foot { margin-top: 4px; display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--ink-3); }

.maprow { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card.map { border-left: 3px solid var(--accent); }

/* ------------------------------------------------------- map view: chrome */
#mapbar {
  flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--rule);
}
#mapbar .label {
  font: 650 10.5px var(--sans); text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3); margin-right: 1px;
}
#mapbar .sep { width: 1px; align-self: stretch; background: var(--rule); margin: 0 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink-2);
  border-radius: var(--r); padding: 4px 10px; font: 12.5px/1.25 var(--sans); cursor: pointer;
}
.chip:hover { border-color: var(--rule-2); color: var(--ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 550; }

#statebar {
  flex: 0 0 auto; padding: 11px 16px; background: var(--accent-soft);
  border-bottom: 1px solid var(--rule); font-size: 13.5px; color: var(--ink-2);
  display: none; line-height: 1.55;
}
#statebar.on { display: block; }
#statebar b { color: var(--ink); }
#statebar .st { font: 650 13px var(--sans); color: var(--accent); display: block; margin-bottom: 3px; }

#canvaswrap { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--bg); }
/* The chart is a graphic, not a document: dragging it must pan, never start a
   text selection across every label. The panel stays selectable so cards can
   still be copied. */
#canvas {
  width: 100%; height: 100%; display: block; touch-action: none; cursor: grab;
  user-select: none; -webkit-user-select: none;
}
#canvas text { pointer-events: none; }
#canvas .node text { pointer-events: auto; }
#canvas.drag { cursor: grabbing; }
#zoomui {
  position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 5px;
}
#zoomui .btn { background: var(--panel); box-shadow: var(--shadow); }
#maphint {
  position: absolute; left: 12px; bottom: 12px; font-size: 11.5px; color: var(--ink-3);
  background: color-mix(in srgb, var(--panel) 85%, transparent);
  padding: 4px 9px; border-radius: var(--r); pointer-events: none;
}

/* ------------------------------------------------------------ svg styling */
.band { stroke: none; }
.bandlabel {
  font: 650 12px var(--sans); fill: var(--band-ink);
  text-transform: uppercase; letter-spacing: .12em;
}
.boxrect { fill: none; stroke: var(--rule-2); stroke-width: 1.5; stroke-dasharray: 7 5; rx: 4; }

/* Pathway lines carry the weight, the way a printed pathways chart does. */
/* no stroke here: a CSS declaration would beat the per-pathway colour that
   the renderer sets as a presentation attribute */
.edge { fill: none; stroke-width: 3.2; }
.edge.dim { opacity: .09; }
.edge.hot { stroke-width: 5.4; }
.edge.dash { stroke-dasharray: 2 7; stroke-linecap: round; }
.elabel {
  font: italic 11px var(--sans); fill: var(--ink-2); paint-order: stroke;
  stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round;
  pointer-events: none; text-anchor: middle;
}
.elabel.dim { opacity: .08; }
.elabel.hot { fill: var(--ink); font-weight: 600; font-size: 11.5px; }
.enote {
  font: 10.5px var(--sans); fill: var(--ink-3); font-style: italic;
  paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round;
  pointer-events: none; text-anchor: middle; opacity: 0;
}
.enote.hot { opacity: 1; fill: var(--accent); font-style: normal; }
.ehit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }

/* A metabolite is its name on the page. The box is only a backing plate that
   keeps the lines from running through the letters; hubs get a real pill. */
.node { cursor: pointer; }
/* A constant-size tap halo. The stroke is transparent and non-scaling, so it
   adds the same number of device pixels around every molecule at every zoom -
   pointer-events:all makes the interior and that halo hittable even though
   neither is painted. */
.node rect.hit {
  fill: none; stroke: transparent; stroke-width: 14; pointer-events: all;
}
@media (pointer: coarse) { .node rect.hit { stroke-width: 30; } }
.node rect.box { fill: var(--bg); stroke: none; rx: 3; }
.node:hover rect.box { stroke: var(--accent); stroke-width: 1.6; }
.node text.n { font: 600 13px var(--sans); fill: var(--ink); text-anchor: middle; }
.node text.s { font: 10.5px var(--sans); fill: var(--ink-3); text-anchor: middle; }
.node.hub rect.box { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.5; }
.node.hub text.n { font-weight: 650; }
.node.hub2 rect.box { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.4; }
.node.hub2 text.n { font-weight: 750; font-size: 15px; fill: var(--accent); }
.node.sel rect.box { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.6; }
.node.dim { opacity: .2; }
.node.enz rect.box { fill: var(--panel-2); stroke: var(--rule-2); stroke-width: 1; rx: 3; }
.node.jump rect.box { fill: var(--panel-2); stroke: var(--accent); stroke-width: 1.3; stroke-dasharray: 5 4; }
.node.jump text.n { fill: var(--accent); font-size: 12px; font-weight: 600; }
.node.note rect.box { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1; stroke-dasharray: 4 3; }
.node.note text.s { fill: var(--ink-2); }
.node.reg rect.box { fill: var(--extra-soft); stroke: var(--extra); stroke-width: 1.4; }
.node.reg text.n { fill: var(--extra); }
.node .inh {
  font: 600 10px var(--sans); fill: var(--bad); text-anchor: middle;
}
.node .rlsdot { fill: var(--accent); }

/* -------------------------------------------------------------- the panel */
#panel {
  flex: 0 0 var(--panel-w); width: var(--panel-w); min-width: 0;
  background: var(--panel); border-left: 1px solid var(--rule);
  display: none; flex-direction: column; overflow: hidden;
}
#panel.on { display: flex; }
#panel header {
  flex: 0 0 auto; padding: 14px 16px 12px; border-bottom: 1px solid var(--rule);
  display: flex; align-items: flex-start; gap: 10px;
}
#panel header .t { flex: 1; min-width: 0; }
#panel h2 { margin: 0; font: 650 21px/1.2 var(--sans); letter-spacing: -.5px; }
#panel .formula { font: 11.5px var(--mono); color: var(--ink-3); margin-top: 3px; }
#panel .x { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--ink-3); cursor: pointer; padding: 0 2px; }
#panel .x:hover { color: var(--ink); }
#panel .body { overflow: auto; padding: 0 16px 60px; flex: 1; min-height: 0; }

.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag {
  font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .06em;
  padding: 3px 7px; border-radius: 5px; background: var(--panel-2); color: var(--ink-3);
  border: 1px solid var(--rule);
}
.tag.cls { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tag.extra { background: var(--extra-soft); color: var(--extra); border-color: transparent; }
.tag.rls { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tag.link { cursor: pointer; }
.tag.link:hover { border-color: var(--accent); color: var(--accent); }

.one {
  font: 400 15.5px/1.55 var(--sans); color: var(--ink); margin: 15px 0 0;
  padding-left: 11px; border-left: 3px solid var(--accent);
}
.blk { margin-top: 20px; }
.blk > h5 {
  margin: 0 0 7px; font: 650 10.5px var(--sans); text-transform: uppercase;
  letter-spacing: .1em; color: var(--ink-3);
}
.blk ul { margin: 0; padding-left: 17px; }
.blk li { margin-bottom: 5px; font-size: 14px; line-height: 1.55; color: var(--ink-2); }
.blk.clin li { color: var(--ink-2); }
.blk.clin > h5 { color: var(--bad); }
.blk.reg > h5 { color: var(--warn); }

.why {
  margin-top: 20px; padding: 11px 13px; background: var(--ok-soft);
  border-radius: var(--r); font-size: 13.5px; line-height: 1.55; color: var(--ink-2);
  border: 1px solid color-mix(in srgb, var(--ok) 25%, transparent);
}
.why b, .why strong { color: var(--ink); }
.why::before {
  content: "The point"; display: block; font: 650 10px var(--sans);
  text-transform: uppercase; letter-spacing: .1em; color: var(--ok); margin-bottom: 4px;
}

.conn { margin-top: 8px; }
.conn .row {
  display: flex; gap: 8px; align-items: baseline; padding: 6px 0;
  border-bottom: 1px dashed var(--rule);
}
.conn .row:last-child { border-bottom: 0; }
.conn .arrow { color: var(--ink-3); font-size: 13px; flex: 0 0 auto; width: 15px; }
.conn .who {
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
  font: 550 13.5px var(--sans); color: var(--link); flex: 0 0 auto;
}
.conn .who:hover { text-decoration: underline; }
.conn .via { font-size: 12px; color: var(--ink-3); flex: 1; min-width: 0; }
.conn .via button {
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink-2);
  font: 12px var(--sans); text-decoration: underline dotted; text-underline-offset: 2px;
}
.conn .via button:hover { color: var(--accent); }

details.deep {
  margin-top: 9px; border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--panel-2); overflow: hidden;
}
details.deep > summary {
  cursor: pointer; padding: 9px 12px; font: 600 13.5px var(--sans); color: var(--ink);
  list-style: none;
}
details.deep > summary::-webkit-details-marker { display: none; }
details.deep > summary::before { content: "▸ "; color: var(--accent); }
details.deep[open] > summary::before { content: "▾ "; }
details.deep .d { padding: 0 13px 12px; font-size: 13.5px; line-height: 1.62; color: var(--ink-2); }

.jumpbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* --------------------------------------------------------------- topic pg */
.tophead { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.tophead .t { flex: 1; min-width: 260px; }
.tophead h2 { margin: 0 0 6px; font: 650 28px/1.15 var(--sans); letter-spacing: -.8px; }
.tophead p { margin: 0; color: var(--ink-2); max-width: 62ch; }

.pills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.pill {
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r);
  padding: 7px 11px; cursor: pointer; font: 13.5px var(--sans); color: var(--ink);
  display: inline-flex; align-items: center; gap: 7px;
}
.pill:hover { border-color: var(--accent); }
.pill .mini { font: 10px var(--mono); color: var(--ink-3); }
.pill.enzpill { background: var(--panel-2); }

/* --------------------------------------------------------------- quiz */
.quizwrap { max-width: 760px; margin: 0 auto; padding: 26px 22px 100px; }
.qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.qhead h2 { margin: 0; font: 650 24px/1.2 var(--sans); letter-spacing: -.6px; }
.qmeta { font-size: 13px; color: var(--ink-3); margin-bottom: 20px; }
.qprog { height: 4px; background: var(--panel-3); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
.qprog i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

.qcard { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px; }
.qn { font: 650 11px var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.qstem { margin: 7px 0 17px; font-size: 16.5px; line-height: 1.55; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; gap: 11px; align-items: flex-start; text-align: left;
  background: var(--panel-2); border: 1.5px solid var(--rule); border-radius: var(--r);
  padding: 12px 14px; cursor: pointer; font: 14.5px/1.5 var(--sans); color: var(--ink);
}
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .ltr {
  font: 700 12px var(--mono); color: var(--ink-3); flex: 0 0 auto;
  width: 18px; height: 18px; border-radius: 4px; background: var(--panel-3);
  display: grid; place-items: center; margin-top: 2px;
}
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .ltr { background: var(--ok); color: var(--panel); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ltr { background: var(--bad); color: var(--panel); }
.opt[disabled] { cursor: default; }
.fb {
  margin-top: 15px; padding: 12px 14px; border-radius: var(--r); font-size: 14px; line-height: 1.55;
  background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 28%, transparent);
}
.fb.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 28%, transparent); }
.fb .h { font: 650 10.5px var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--ok); display: block; margin-bottom: 4px; }
.fb.bad .h { color: var(--bad); }
.qfoot { display: flex; gap: 9px; align-items: center; margin-top: 18px; }
.qfoot .spacer { flex: 1; }
.score { font: 600 15px var(--sans); }
.scorebig { text-align: center; padding: 40px 20px; }
.scorebig .big { font: 650 52px/1 var(--sans); letter-spacing: -2px; color: var(--accent); }
.scorebig p { color: var(--ink-2); }

/* ------------------------------------------------------------- responsive */
@media (max-width: 1000px) {
  :root { --panel-w: 380px; }
}
@media (max-width: 760px) {
  #top { gap: 8px; padding: 0 10px; }
  #top .brand span { display: none; }
  #searchwrap { flex: 1 1 auto; }
  .wrap, .quizwrap { padding-left: 16px; padding-right: 16px; }
  .hero h2 { font-size: 24px; }
  #main { position: relative; }
  #panel {
    position: absolute; inset: auto 0 0 0; width: auto; height: 82%;
    border-left: 0; border-top: 1px solid var(--rule-2);
    border-radius: 10px 10px 0 0; box-shadow: var(--shadow); z-index: 20;
  }
  #maphint { display: none; }
  .grid, .maprow { grid-template-columns: 1fr; }
}

/* ------------------------------------------------ focus, motion, targets -- */
/* A visible focus ring is non-negotiable: the maps are keyboard navigable and
   every molecule is a tab stop. */
:where(button, input, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}
.node:focus-visible { outline: none; }
.node:focus-visible rect.box { stroke: var(--accent); stroke-width: 3; }

/* Comfortable hit targets; a full 44px on touch widths. */
.btn, .chip, .pill { min-height: 32px; }
@media (pointer: coarse), (max-width: 760px) {
  .btn, .chip, .pill { min-height: 44px; padding-top: 10px; padding-bottom: 10px; }
  #mapbar { gap: 8px; }
  .opt { padding: 15px 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Swiss: hierarchy from weight and rule, not from ornament. */
h3.sec { border-bottom-width: 1px; }
#top { border-bottom-width: 1px; }
.card h4 { letter-spacing: -.2px; }

/* ------------------------------------------------------------ breadcrumb -- */
#crumb { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
#crumb .clink {
  background: none; border: 0; padding: 3px 5px; cursor: pointer; border-radius: 3px;
  font: 13px var(--sans); color: var(--ink-2); white-space: nowrap;
}
#crumb .clink:hover { color: var(--ink); background: var(--panel-2); }
#crumb .csep { color: var(--ink-3); font-size: 13px; }
#crumb .ccur {
  font: 550 13px var(--sans); color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
@media (max-width: 760px) {
  #crumb .clink, #crumb .csep { display: none; }
  #crumb .clink:nth-last-child(3) { display: inline-block; }
  #crumb .clink:nth-last-child(3)::before { content: "\2190  "; }
}

/* State caption: the gist by default, the whole thing on request, so the
   map is not pushed off the bottom of the screen. */
#statebar .cap {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
#statebar.open .cap { display: block; }
#statebar .capmore {
  display: inline-block; margin-top: 4px; background: none; border: 0; padding: 2px 0;
  font: 600 12px var(--sans); color: var(--accent); cursor: pointer;
  text-decoration: underline; text-underline-offset: 2px;
}
</style>
</head>

["**Trapped**: the phosphate means it cannot cross the membrane back out.","Out 1 **glycolysis** → energy. Out 2 **glycogenesis** → storage.","Out 3 **pentose phosphate pathway** → NADPH + ribose 5-P.","Out 4 **G6Pase → free glucose** (liver only). Out 5 back from gluconeogenesis."],"reg":["Inhibits **hexokinase** (feedback) — if G6P is piling up, stop trapping glucose.","Liver **glucokinase** is *not* inhibited by G6P and has a high Km (10 mM), so hepatic [G6P] tracks blood glucose.","G6P can activate even phosphorylated **glycogen synthase**."],"clin":["In type 1 diabetes there is nowhere for G6P to go, so it rises, inhibits hexokinase, and **glucose goes back out** of the cell."],"why":"Almost every regulation question in this unit is really 'what happens to G6P now?'","course":[{"l":"L03","t":"Glycolysis","ids":["3S22.1"]},{"l":"L07","t":"Regulation, RLS","ids":["7S14.2","7S14.3"]},{"l":"L09","t":"Glycogenesis","ids":["9S13.5","9S14.2","9S23.2","9S23.3","9S23.5"]},{"l":"L13","t":"Type 1 diabetes","ids":["13S9.1","13S9.2"]}]},"f6p":{"n":"Fructose 6-phosphate","cls":"sugar","f":"F6P","one":"The substrate of the committed step — one isomerisation away from G6P, one phosphorylation from no return.","does":["Sits in equilibrium with G6P (phosphoglucose isomerase), so it is still reversible.","**PFK-1** pushes it to F1,6BP — the classic rate-limiting step of glycolysis.","**F1,6BPase** brings it back in gluconeogenesis (liver only).","Receives recycled carbon from the pentose phosphate pathway."],"reg":["The F6P ⇌ F1,6BP step is where **F2,6BP** does all its work — see fructose 2,6-bisphosphate."],"why":"Everything above F6P is reversible; past it you are committed.","course":[{"l":"L03","t":"Glycolysis","ids":["3S23.2"]},{"l":"L08","t":"Gluconeogenesis in depth","ids":["8S8.1","8S9.1"]}]},"f16bp":{"n":"Fructose 1,6-bisphosphate","cls":"sugar","f":"F1,6BP","one":"The symmetrical, doubly-phosphorylated sugar that the investment phase paid for.","does":["Product of the
